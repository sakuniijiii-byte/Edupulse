  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-main);
    color: var(--text-main);
  }
  .glass-card {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);

  .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
  .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; }
  
  .custom-modal {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .custom-modal.open { opacity: 1; pointer-events: auto; }
  .modal-box {
    width: 92%; max-width: 780px; max-height: 90vh;
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    transform: scale(0.95) translateY(10px);
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .custom-modal.open .modal-box { transform: scale(1) translateY(0); }
  .custom-modal.fullscreen-modal .modal-box { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; }
  
  .badge-bio { background: #ecfdf5; color: #047857; }
  .dark .badge-bio { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
  .badge-chem { background: #f5f3ff; color: #6d28d9; }
  .dark .badge-chem { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; }
  .badge-phy { background: #f0fdfa; color: #0f766e; }
  .dark .badge-phy { background: rgba(20, 184, 166, 0.15); color: #5eead4; }
  
  .lecture-ratio { aspect-ratio: 16 / 9; }

<script>
// ===== Global Storage & Settings =====
const STORAGE_KEYS = {
  attempts: 'edupulse_attempts_v1',
  settings: 'edupulse_settings_v1',
  streak: 'edupulse_streak_v1',
  progress: 'edupulse_progress_v2',
  todos: 'edupulse_todos_v1',
  theme: 'edupulse_theme',
  customLectures: 'edupulse_lectures_custom'
};

const defaultSettings = {
  marksCorrect: 4,
  marksWrong: -1,
  minutesPerQuestion: 1,
  dailyGoalQuestions: 30
};

const StorageModule = {
  get(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  set(key, val) {
    try {
      localStorage.setItem(key, JSON.stringify(val));
      return true;
    } catch(e) { return false; }
  }
};

// Curriculum Chapters Database
const CHAPTERS_DATA = {
  Biology: [
    'The Living World','Biological Classification','Plant Kingdom','Animal Kingdom',
    'Morphology and Anatomy of Flowering Plants','Structural Organisation in Animals',
    'Cell: The Unit of Life','Biomolecules','Cell Cycle and Cell Division',
    'Photosynthesis in Plants','Respiration in Plants','Plant Growth and Development',
    'Breathing and Exchange of Gases','Body Fluids and Circulation','Excretory Products and their Elimination',
    'Locomotion and Movement','Neural Control and Coordination','Chemical Coordination and Integration',
    'Sexual Reproduction in Flowering Plants','Human Reproduction','Reproductive Health',
    'Principles of Inheritance and Variation','Molecular Basis of Inheritance','Evolution',
    'Human Health and Disease','Microbes in Human Welfare','Biotechnology: Principles and Processes',
    'Biotechnology and its Applications','Organisms and Populations','Ecosystem','Biodiversity and Conservation'
  ],
  Chemistry: [
    'Some Basic Concepts of Chemistry','Structure of Atom','Chemical Thermodynamics',
    'Chemical and Ionic Equilibrium','Solutions','Electrochemistry and Redox Reactions',
    'Chemical Kinetics','Classification of Elements and Periodicity','Chemical Bonding',
    'p-Block Elements','d- and f-Block Elements','Coordination Compounds',
    'Purification and Characterisation','General Organic Chemistry','Hydrocarbons',
    'Haloalkanes and Haloarenes','Oxygen-Containing Compounds','Nitrogen-Containing Compounds',
    'Biomolecules','Principles Related to Practical Chemistry'
  ],
  Physics: [
    'Units and Measurements','Motion in a Straight Line','Motion in a Plane','Laws of Motion',
    'Work, Energy and Power','Rotational Motion','Gravitation','Mechanical Properties of Solids',
    'Mechanical Properties of Fluids','Thermal Properties of Matter','Thermodynamics',
    'Kinetic Theory of Gases','Oscillations','Waves','Electric Charges and Fields',
    'Electrostatic Potential and Capacitance','Current Electricity','Moving Charges and Magnetism',
    'Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves',
    'Ray Optics and Optical Instruments','Wave Optics','Dual Nature of Radiation and Matter',
    'Atoms','Nuclei','Semiconductor Electronics'
  ]
};

const TOTAL_CHAPTERS = Object.values(CHAPTERS_DATA).reduce((n, l) => n + l.length, 0);

// Comprehensive Youtube One-Shot Search Data & Mappings
const ONE_SHOT_LECTURES = {
  // Biology
  'The Living World': 'https://www.youtube.com/embed/videoseries?list=PLbAqb4DLfUasPhrjrSqNnxyiLwaDI_Qml',
  'Cell: The Unit of Life': 'https://www.youtube.com/embed/videoseries?list=PLbAqb4DLfUauIS74mnISFrQttmOdM1-As',
  'Human Reproduction': 'https://www.youtube.com/embed/videoseries?list=PLbAqb4DLfUatKeD-H1MIcRIFsfgnYoARM',
  'Molecular Basis of Inheritance': 'https://www.youtube.com/embed/videoseries?list=PLbAqb4DLfUatxrU7mofuhm4EIqjJTOGsx',
  // Default Search Fallback pattern generator for embeds
};

// Global State
let currentTab = 'home';
let selectedSubject = 'Biology';
let userProgress = StorageModule.get(STORAGE_KEYS.progress, {});
let attemptsHistory = StorageModule.get(STORAGE_KEYS.attempts, []);
let todos = StorageModule.get(STORAGE_KEYS.todos, []);
let customLectures = StorageModule.get(STORAGE_KEYS.customLectures, {});

// Quiz Runtime State
let quizState = {
  mode: 'practice',
  chapter: '',
  subject: '',
  questions: [],
  currentIndex: 0,
  userAnswers: {},
  marked: {},
  startTime: null
};

// Initialize App
document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  updateGlobalProgress();
  updateStreakDisplay();
  renderView();
});

function initTheme() {
  const isDark = StorageModule.get(STORAGE_KEYS.theme, 'light') === 'dark';
  document.body.classList.toggle('dark', isDark);
  document.documentElement.classList.toggle('dark', isDark);
}

function toggleTheme() {
  const isDark = document.body.classList.toggle('dark');
  document.documentElement.classList.toggle('dark', isDark);
  StorageModule.set(STORAGE_KEYS.theme, isDark ? 'dark' : 'light');
}

function toggleMobileNav(open) {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('navOverlay');
  if (open) {
    sidebar.classList.remove('-translate-x-full');
    overlay.classList.remove('opacity-0', 'pointer-events-none');
  } else {
    sidebar.classList.add('-translate-x-full');
    overlay.classList.add('opacity-0', 'pointer-events-none');
  }
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  const bg = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-teal-600 text-white';
  toast.className = `px-4 py-3 rounded-2xl shadow-xl text-xs font-bold ${bg} transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2`;
  toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : 'fa-check-circle'}"></i> ${escapeHtml(msg)}`;
  container.appendChild(toast);
  setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
  setTimeout(() => {
    toast.classList.add('translate-y-2', 'opacity-0');
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function escapeHtml(str = '') {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function slugify(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
}

function updateGlobalProgress() {
  const completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
  const pct = Math.round((completedCount / TOTAL_CHAPTERS) * 100);
  document.getElementById('sidebar-progress-bar').style.width = `${pct}%`;
  document.getElementById('sidebar-progress-percent').textContent = `${pct}%`;
  document.getElementById('sidebar-progress-text').textContent = `${completedCount} of ${TOTAL_CHAPTERS} completed`;
}

function updateStreakDisplay() {
  const streak = StorageModule.get(STORAGE_KEYS.streak, { current: 1 });
  document.getElementById('streak-count').textContent = streak.current || 1;
}

// ===== Router / Navigation =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('nav button').forEach(b => {
    b.classList.remove('bg-slate-100', 'dark:bg-slate-800', 'text-teal-600', 'dark:text-teal-400');
  });
  const activeBtn = document.getElementById(`nav-${tab}`);
  if (activeBtn) activeBtn.classList.add('bg-slate-100', 'dark:bg-slate-800', 'text-teal-600', 'dark:text-teal-400');
  toggleMobileNav(false);
  renderView();
}

function renderView() {
  const main = document.getElementById('main-container');
  if (currentTab === 'home') renderHomeView(main);
  else if (currentTab === 'lectures') renderLecturesView(main);
  else if (currentTab === 'practice') renderPracticeBankView(main);
  else if (currentTab === 'progress') renderProgressView(main);
  else if (currentTab === 'mock') renderMockBuilderView(main);
  else if (currentTab === 'directory') renderDirectoryView(main);
  else if (currentTab === 'faculty') renderFacultyView(main);
  else if (currentTab === 'tools') renderToolsView(main);
  else if (currentTab === 'settings') renderSettingsView(main);
}

// ===== 1. HOME VIEW (CHAPTER MODULES) =====
function renderHomeView(container) {
  const subjects = ['Biology', 'Chemistry', 'Physics'];
  
  let html = `
    <div class="space-y-6">
      <!-- Subject Tabs Selector -->
      <div class="grid grid-cols-3 gap-4">
        ${subjects.map(subj => {
          const isSelected = selectedSubject === subj;
          const icon = subj === 'Biology' ? 'fa-dna' : subj === 'Chemistry' ? 'fa-flask' : 'fa-atom';
          const colorClass = subj === 'Biology' ? 'text-emerald-500' : subj === 'Chemistry' ? 'text-purple-500' : 'text-teal-500';
          return `
            <button onclick="selectedSubject='${subj}'; renderView();" class="p-5 rounded-2xl border transition-all flex flex-col items-center justify-center gap-2 ${isSelected ? 'border-teal-500 bg-teal-500/5 shadow-md shadow-teal-500/10' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-slate-300'}">
              <i class="fa-solid ${icon} text-2xl ${colorClass}"></i>
              <span class="font-extrabold text-sm text-slate-800 dark:text-slate-200">${subj}</span>
              <span class="text-[10px] text-slate-400 font-bold">${CHAPTERS_DATA[subj].length} Chapters</span>
            </button>
          `;
        }).join('')}
      </div>

      <!-- Chapter Search & Filter Bar -->
      <div class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800">
        <div class="relative w-full sm:w-96">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-xs"></i>
          <input type="text" id="chapter-search" oninput="renderHomeChapters()" placeholder="Search ${selectedSubject} chapters..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-xs font-bold text-slate-800 dark:text-slate-200 outline-none focus:border-teal-500">
        </div>
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <select id="chapter-filter" onchange="renderHomeChapters()" class="px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-xs font-bold text-slate-800 dark:text-slate-200 outline-none">
            <option value="all">All Status</option>

function renderHomeChapters() {
  const container = document.getElementById('chapters-grid');
  if (!container) return;
  
  const search = (document.getElementById('chapter-search')?.value || '').toLowerCase();
  const filter = document.getElementById('chapter-filter')?.value || 'all';
  const list = CHAPTERS_DATA[selectedSubject];

  const filtered = list.filter(ch => {
    const matchSearch = ch.toLowerCase().includes(search);
    const isCompleted = userProgress[ch] && userProgress[ch].completed;
    if (filter === 'completed') return matchSearch && isCompleted;
    if (filter === 'pending') return matchSearch && !isCompleted;
    return matchSearch;
  });

  if (!filtered.length) {
    container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 font-bold text-xs"><i class="fa-solid fa-folder-open text-3xl mb-2"></i><p>No chapters match your criteria</p></div>`;
    return;
  }

  const badgeClass = selectedSubject === 'Biology' ? 'badge-bio' : selectedSubject === 'Chemistry' ? 'badge-chem' : 'badge-phy';
  
  container.innerHTML = filtered.map(ch => {
    const isCompleted = userProgress[ch] && userProgress[ch].completed;
    const chAttempts = attemptsHistory.filter(a => a.chapter === ch);
    const bestScore = chAttempts.length ? Math.max(...chAttempts.map(a => a.score)) : 0;
    
    return `
      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-teal-500/50 transition-all flex flex-col justify-between group shadow-sm hover:shadow-md">
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="px-2.5 py-1 rounded-lg text-[10px] font-black uppercase ${badgeClass}">${selectedSubject.substring(0,3)}</span>
            <button onclick="toggleChapterCompletion('${escapeHtml(ch)}')" class="px-2.5 py-1 rounded-lg text-[10px] font-extrabold ${isCompleted ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400' : 'bg-slate-100 dark:bg-slate-800 text-slate-400'}">
              ${isCompleted ? 'Completed ✓' : 'Mark Done'}
            </button>
          </div>
          <h4 class="font-extrabold text-sm text-slate-900 dark:text-white leading-snug group-hover:text-teal-600 dark:group-hover:text-teal-400 transition-colors">${escapeHtml(ch)}</h4>
          <div class="mt-4 flex items-center justify-between text-[11px] text-slate-400 font-bold">
            <span>Attempts: ${chAttempts.length}</span>
            <span>Best Score: ${bestScore} pts</span>
          </div>
        </div>
        
        <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-2">
          <button onclick="openOneShotModal('${selectedSubject}', '${escapeHtml(ch)}')" class="w-full py-2 px-3 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 font-black text-xs flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-play text-[10px]"></i> One-Shot

          <button onclick="startQuizMode('${selectedSubject}', '${escapeHtml(ch)}')" class="w-full py-2 px-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-black text-xs flex items-center justify-center gap-1.5 transition">
            <i class="fa-solid fa-bolt text-[10px]"></i> Solve MCQs

        </div>
      </div>
    `;
  }).join('');
}

function toggleChapterCompletion(ch) {

// Simulated Quiz Generator & Modal Runner
function startQuizMode(subj, chapter) {
  // Generate high-yield dynamic practice questions for demonstration
  const sampleQuestions = [
    {
      q: `Which of the following is considered a defining characteristic of living organisms?`,
      options: ['Growth', 'Reproduction', 'Metabolism', 'Response to stimuli'],
      correct: 2,
      explanation: 'Metabolism is a defining feature as it occurs in all living organisms without exception.'
    },
    {
      q: `In binomial nomenclature, the first word denotes the _______ and the second denotes the _______.`,
      options: ['Species, Genus', 'Genus, Specific epithet', 'Family, Genus', 'Order, Family'],
      correct: 1,
      explanation: 'The first word is the Genus (capitalized) and the second is the specific epithet.'
    },
    {
      q: `Which taxonomical aid contains actual account of habitat and distribution of plants of a given area?`,
      options: ['Manual', 'Flora', 'Monograph', 'Catalogue'],
      correct: 1,
      explanation: 'Flora contains the actual account of habitat and distribution of plants of a given area.'
    }
  ];

  quizState = {
    mode: 'practice',
    chapter: chapter,
    subject: subj,
    questions: sampleQuestions,
    currentIndex: 0,
    userAnswers: {},
    marked: {},
    startTime: Date.now()
  };

  renderQuizInterface();
}

function renderQuizInterface() {
  const q = quizState.questions[quizState.currentIndex];
  const total = quizState.questions.length;
  const selectedOpt = quizState.userAnswers[quizState.currentIndex];

  const content = `
    <div class="space-y-6">
      <!-- Quiz Header Details -->
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <span class="text-xs font-black text-teal-600 dark:text-teal-400">Question ${quizState.currentIndex + 1} of ${total}</span>
        <span class="px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 font-bold text-[10px]">${quizState.subject}</span>
      </div>

      <!-- Question Text -->
      <h4 class="font-extrabold text-base text-slate-900 dark:text-white leading-relaxed">${escapeHtml(q.q)}</h4>

      <!-- Options List -->
      <div class="space-y-3">
        ${q.options.map((opt, idx) => {
          let stateClass = 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-200';
          if (selectedOpt !== undefined) {
            if (idx === q.correct) stateClass = 'border-emerald-500 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 font-bold';
            else if (selectedOpt === idx) stateClass = 'border-rose-500 bg-rose-500/10 text-rose-700 dark:text-rose-300';
          }
          return `
            <button onclick="selectOption(${idx})" class="w-full p-4 rounded-xl border text-left text-xs font-bold transition flex items-center gap-3 ${stateClass}">
              <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-[10px] font-black">${String.fromCharCode(65 + idx)}</span>
              <span>${escapeHtml(opt)}</span>
            </button>
          `;
        }).join('')}
      </div>

      <!-- Explanation Box -->
      ${selectedOpt !== undefined ? `
        <div class="p-4 rounded-2xl bg-teal-500/10 border border-teal-500/20 text-xs text-teal-900 dark:text-teal-200 space-y-1">
          <span class="font-black text-[10px] uppercase text-teal-600 dark:text-teal-400">Explanation:</span>
          <p class="font-medium">${escapeHtml(q.explanation)}</p>
        </div>
      ` : ''}
    </div>
  `;

  const actions = `
    <div class="flex items-center justify-between w-full">
      <button onclick="prevQuestion()" ${quizState.currentIndex === 0 ? 'disabled class="opacity-40 px-4 py-2 text-xs font-bold"' : 'class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-extrabold"'}>Previous</button>
      ${quizState.currentIndex < total - 1 ? `
        <button onclick="nextQuestion()" class="px-5 py-2.5 rounded-xl bg-teal-600 text-white text-xs font-extrabold hover:bg-teal-700">Next Question</button>
      ` : `
        <button onclick="finishQuiz()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-extrabold hover:bg-emerald-700">Finish Session</button>
      `}
    </div>
  `;

  setModal(`${quizState.chapter} Practice`, `Solve high-yield NEET MCQs`, content, actions);
}

function selectOption(idx) {
  quizState.userAnswers[quizState.currentIndex] = idx;
  renderQuizInterface();
}

function nextQuestion() {
  if (quizState.currentIndex < quizState.questions.length - 1) {
    quizState.currentIndex++;
    renderQuizInterface();
  }
}

function prevQuestion() {
  if (quizState.currentIndex > 0) {
    quizState.currentIndex--;
    renderQuizInterface();
  }
}

function finishQuiz() {
  let score = 0;
  quizState.questions.forEach((q, idx) => {
    if (quizState.userAnswers[idx] === q.correct) score += 4;
    else if (quizState.userAnswers[idx] !== undefined) score -= 1;
  });

  const attempt = {
    chapter: quizState.chapter,
    score: score,
    total: quizState.questions.length * 4,
    finishedAt: Date.now()
  };

  attemptsHistory.unshift(attempt);
  StorageModule.set(STORAGE_KEYS.attempts, attemptsHistory);
  showToast(`Quiz completed! Score: ${score} pts`);
  closeModal();
  renderView();
}

// Modal Helpers
function openModal() { document.getElementById('appModal').classList.add('open'); }
function closeModal() { document.getElementById('appModal').classList.remove('open'); }
function setModal(title, body, content, actions = '') {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').textContent = body;
  document.getElementById('modalContentSlot').innerHTML = content;
  document.getElementById('modalActions').innerHTML = actions;
  openModal();
}

function openHelpModal() {
  setModal('Keyboard Shortcuts', 'Accelerate navigation', `
    <div class="space-y-2 text-xs font-bold">
      <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-900"><span>Option Shortcuts</span><span>Keys 1, 2, 3, 4</span></div>
      <div class="flex justify-between p-2 rounded bg-slate-50 dark:bg-slate-900"><span>Next Question</span><span>Right Arrow</span></div>
    </div>
  `, `<button onclick="closeModal()" class="px-4 py-2 bg-teal-600 text-white font-bold text-xs rounded-xl">Got it</button>`);
}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduPulse — The Living World</title>
    <style>
      :root {
        --bg: #f3f7f5;
        --panel: #ffffff;
        --panel-alt: #edf9f5;
        --text: #12212a;
        --muted: #5a6d7a;
        --primary: #0f766e;
        --primary-strong: #0b5d5a;
        --primary-soft: #dffaf4;
        --correct: #15803d;
        --correct-soft: #dcfce7;
        --wrong: #be123c;
        --wrong-soft: #ffe4e6;
        --border: #dfe7ea;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(135deg, #edfdf7, #f4f9ff 60%, #f8fafc);
        color: var(--text);
      }

      .wrap {
        max-width: 980px;
        margin: 40px auto;
        padding: 24px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .title {
        font-size: clamp(1.6rem, 2vw, 2.5rem);
        margin: 0;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 6px 10px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-strong);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(15, 118, 110, 0.08);
        overflow: hidden;
      }

      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--panel-alt);
      }

      .status-stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: #fff;
        border: 1px solid var(--border);
        font-size: 13px;
        font-weight: 700;
      }

      .content {
        padding: 28px 22px 18px;
      }

      .progress {
        position: relative;
        width: 100%;
        height: 12px;
        border-radius: 999px;
        background: #e7f0ed;
        overflow: hidden;
        margin: 8px 0 18px;
      }

      .progress-bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, var(--primary), #34d399);
        border-radius: inherit;
        transition: width 0.25s ease;
      }

      .question {
        font-size: clamp(1.05rem, 2vw, 1.45rem);
        line-height: 1.6;
        margin: 12px 0 20px;
        font-weight: 800;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        width: 100%;
        text-align: left;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        padding: 14px 16px;
        font-size: 1rem;
        color: var(--text);
        cursor: pointer;
        transition: 0.2s ease;
      }

      .option:hover {
        border-color: rgba(15, 118, 110, 0.5);
        transform: translateY(-1px);
      }

      .option.correct {
        background: var(--correct-soft);
        border-color: var(--correct);
        color: var(--correct);
        font-weight: 800;
      }

      .option.wrong {
        background: var(--wrong-soft);
        border-color: var(--wrong);
        color: var(--wrong);
        font-weight: 800;
      }

      .option.disabled {
        opacity: 0.7;
        cursor: default;
      }

      .feedback {
        margin-top: 22px;
        border-radius: 16px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: #f8fafc;
      }

      .feedback.correct {
        background: var(--correct-soft);
        border-color: rgba(21, 128, 61, 0.25);
        color: #166534;
      }

      .feedback.wrong {
        background: var(--wrong-soft);
        border-color: rgba(190, 18, 60, 0.28);
        color: #9f1239;
      }

      .feedback strong {
        display: block;
        margin-bottom: 8px;
        font-size: 0.95rem;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }

      .btn {
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 800;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--primary);
        color: white;
      }

      .btn.primary:hover { background: var(--primary-strong); }

      .btn.secondary {
        background: #eef2f7;
        color: var(--text);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .loader {
        text-align: center;
        padding: 40px 20px;
        color: var(--muted);
        font-weight: 700;
      }

      .result {
        padding: 28px 20px 20px;
        text-align: center;
      }

      .score {
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 900;
        margin: 12px 0 8px;
      }

      @media (max-width: 640px) {
        .wrap { padding: 14px; }
        .statusbar { flex-direction: column; align-items: flex-start; }
        .nav { flex-direction: column-reverse; }
        .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div>
          <div class="tag">EduPulse</div>
          <h1 class="title">The Living World</h1>
        </div>
      </div>

      <div class="card" id="app"></div>
    </div>

    <script>
      const app = document.getElementById('app');
      let questions = [];
      let currentIndex = 0;
      let selected = {};
      let showExplanation = {};

      function normalizeAnswer(value) {
        return String(value).trim();
      }

      function mapQuestion(item, index) {
        const correctIndex = Number(item.a);
        const correctValue = item.o[correctIndex - 1];
        return {
          id: index + 1,
          question: item.q,
          options: item.o,
          answer: correctValue,
          explanation: item.s || 'No explanation provided.'
        };
      }

      function renderLoading() {
        app.innerHTML = '<div class="loader">Loading questions...</div>';
      }

      function renderQuiz() {
        if (!questions.length) return;

        const q = questions[currentIndex];
        const answered = selected[currentIndex] !== undefined;
        const chosen = selected[currentIndex];

        const progress = ((currentIndex + 1) / questions.length) * 100;

        const optionsHtml = q.options.map((option, idx) => {
          const isCorrect = normalizeAnswer(option) === normalizeAnswer(q.answer);
          const isChosen = normalizeAnswer(option) === normalizeAnswer(chosen);
          const classes = [
            'option',
            answered && isCorrect ? 'correct' : '',
            answered && isChosen && !isCorrect ? 'wrong' : '',
            answered ? 'disabled' : ''
          ].join(' ');

          return `
            <button class="${classes}" type="button" ${answered ? 'disabled' : ''} data-option="${escapeHtml(option)}" aria-label="Choose answer ${idx + 1}">
              ${idx + 1}. ${escapeHtml(option)}
            </button>
          `;
        }).join('');

        let feedbackHtml = '';
        if (answered) {
          const isCorrect = normalizeAnswer(chosen) === normalizeAnswer(q.answer);
          feedbackHtml = `
            <div class="feedback ${isCorrect ? 'correct' : 'wrong'}">
              <strong>${isCorrect ? 'Correct answer' : 'Wrong answer'}</strong>
              ${isCorrect ? 'Well done!' : `Correct answer: <strong>${escapeHtml(q.answer)}</strong><br>`}
              ${escapeHtml(q.explanation)}
            </div>
          `;
        }

        app.innerHTML = `
          <div class="statusbar">
            <div class="status-stats">
              <span class="pill">Question ${currentIndex + 1}/${questions.length}</span>
              <span class="pill">Score: ${Object.values(selected).filter((value) => value && normalizeAnswer(value) === normalizeAnswer(questions[Object.keys(selected).find((key) => normalizeAnswer(questions[Number(key)].answer) === normalizeAnswer(value))]?.answer)).length || 0}</span>
            </div>
            <span class="pill">NCERT Biology</span>
          </div>

          <div class="content">
            <div class="progress">
              <div class="progress-bar" style="width: ${progress}%"></div>
            </div>

            <div class="question">${escapeHtml(q.question)}</div>

            <div class="options">
              ${optionsHtml}
            </div>

            ${feedbackHtml}

            <div class="nav">
              <button class="btn secondary" type="button" ${currentIndex === 0 ? 'disabled' : ''} id="prevBtn">Previous</button>
              <button class="btn primary" type="button" id="nextBtn">${currentIndex === questions.length - 1 ? 'Finish' : 'Next'}</button>
            </div>
          </div>
        `;

        app.querySelectorAll('.option').forEach((button) => {
          button.addEventListener('click', () => {
            if (selected[currentIndex] !== undefined) return;
            const value = button.textContent.replace(/^\d+\.\s*/, '').trim();
            selected[currentIndex] = value;
            showExplanation[currentIndex] = true;
            renderQuiz();
          });
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
          if (currentIndex > 0) {
            currentIndex -= 1;
            renderQuiz();
          }
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
          if (currentIndex < questions.length - 1) {
            currentIndex += 1;
            renderQuiz();
            return;
          }
          renderResult();
        });
      }

      function renderResult() {
        const total = questions.length;
        const correct = questions.reduce((count, question, index) => {
          const chosen = selected[index];
          return count + (chosen && normalizeAnswer(chosen) === normalizeAnswer(question.answer) ? 1 : 0);
        }, 0);

        const percent = Math.round((correct / total) * 100);

        app.innerHTML = `
          <div class="result">
            <div class="tag">Practice Complete</div>
            <div class="score">${correct}/${total}</div>
            <div style="font-size: 1.1rem; font-weight: 700; color: var(--muted);">Accuracy: ${percent}%</div>
            <p style="margin-top: 18px; color: var(--muted); line-height: 1.7;">
              ${percent >= 70 ? 'Excellent work! You have a strong grasp of the chapter.' : percent >= 50 ? 'Good job—review the explanations for the missed questions.' : 'Keep practicing. Revise the chapter explanations and try again.'}
            </p>
            <div class="nav" style="justify-content: center; margin-top: 24px;">
              <button class="btn primary" type="button" id="restartBtn">Restart Quiz</button>
            </div>
          </div>
        `;

        document.getElementById('restartBtn').addEventListener('click', () => {
          currentIndex = 0;
          selected = {};
          showExplanation = {};
          renderQuiz();
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      async function loadQuestions() {
        renderLoading();
        try {
          const response = await fetch('Data/living_world_mcqs.json');
          if (!response.ok) throw new Error('Could not load Data/living_world_mcqs.json');
          const payload = await response.json();
          questions = (payload.qs || []).map(mapQuestion);
          if (!questions.length) throw new Error('No quiz data found in the JSON file.');
          renderQuiz();
        } catch (error) {
          app.innerHTML = `
            <div class="result">
              <div class="tag" style="background: #ffe4e6; color: #9f1239;">Error</div>
              <h2 style="margin-top: 16px;">Unable to load quiz data</h2>
              <p style="color: var(--muted); margin: 12px 0 0;">${escapeHtml(error.message)}</p>
            </div>
          `;
        }
      }

      loadQuestions();
    </script>
  </body>
</html>

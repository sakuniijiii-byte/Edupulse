const livingWorldQuestionsCache = { data: null, loading: false, error: null };

function escapeHtml(value = '') {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

async function loadLivingWorldQuestions() {
    if (livingWorldQuestionsCache.data) return livingWorldQuestionsCache.data;
    if (livingWorldQuestionsCache.loading) return null;

    livingWorldQuestionsCache.loading = true;

    for (const url of LIVING_WORLD_JSON_URLS) {
        try {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) continue;

            const text = await response.text();
            const questions = JSON.parse(text);
            if (Array.isArray(questions) && questions.length) {
                livingWorldQuestionsCache.data = questions;
                livingWorldQuestionsCache.error = null;
                livingWorldQuestionsCache.loading = false;
                return questions;
            }
        } catch (error) {
            console.warn('Remote Living World JSON failed to parse, using fallback data.', error);
        }
    }

    livingWorldQuestionsCache.data = FALLBACK_LIVING_WORLD_QUESTIONS;
    livingWorldQuestionsCache.error = 'The source JSON is malformed, so a fallback question set is being used.';
    livingWorldQuestionsCache.loading = false;
    return FALLBACK_LIVING_WORLD_QUESTIONS;
}

function buildLivingWorldQuestionsMarkup(questions) {
    if (!Array.isArray(questions) || !questions.length) {
        return '<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-900/50 dark:bg-red-950/30 dark:text-red-300">Unable to load the Living World MCQ data from the remote JSON source. A fallback set is being used instead.</div>';
    }

    return `
        <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
            ${questions.map((question, index) => {
                const options = Array.isArray(question.options) ? question.options : [];
                const answer = question.answer || 'Answer not provided';
                const qNumber = question.id || index + 1;
                return `
                    <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4 dark:border-slate-700 dark:bg-slate-900/40">
                        <div class="mb-2 flex items-center justify-between gap-3">
                            <span class="text-[10px] font-extrabold uppercase tracking-[0.16em] text-teal-600 dark:text-teal-400">Q${qNumber}</span>
                        </div>
                        <p class="text-sm font-semibold leading-6 text-slate-800 dark:text-slate-100">${escapeHtml(question.question || 'Question unavailable')}</p>
                        <div class="mt-3 space-y-2">
                            ${options.map((option, optIndex) => `
                                <div class="flex items-start gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200">
                                    <span class="mt-0.5 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-slate-100 text-[10px] font-bold text-slate-600 dark:bg-slate-700 dark:text-slate-300">${String.fromCharCode(65 + optIndex)}</span>
                                    <span>${escapeHtml(option)}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="mt-3 rounded-lg bg-emerald-50 px-3 py-2 text-xs font-semibold text-emerald-700 dark:bg-emerald-950/30 dark:text-emerald-300">
                            Answer: ${escapeHtml(answer)}
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;
}

function toggleMobileNav(open) {
    const drawer = document.getElementById('sidebarDrawer');

        overlay.classList.add('open');

        overlay.classList.remove('open');

function switchTab(tab) {
    if (currentTab !== tab) previousTab = currentTab;
    currentTab = tab;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + tab);
    if (btn) btn.classList.add('active');
    toggleMobileNav(false);
    renderView();
}

    switchTab(previousTab || 'home');

function toggleBookmark(resourceId) {
    if (bookmarks.includes(resourceId)) {
        bookmarks = bookmarks.filter(b => b !== resourceId);
    } else {
        bookmarks.push(resourceId);
    }
    localStorage.setItem('edupulse_bookmarks', JSON.stringify(bookmarks));
    renderView();
}

function showModal(title, message, actionsHtml = null, contentHtml = '') {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = message;
    document.getElementById('modalContentSlot').innerHTML = contentHtml;
    const actionsContainer = document.getElementById('modalActions');
    if (actionsHtml) {
        actionsContainer.innerHTML = actionsHtml;
    } else {
        actionsContainer.innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm">Close</button>`;
    }
    openModal();
}

function openModal() {
    document.getElementById('appModal').classList.add('open');
}

function closeModal() {
    document.getElementById('appModal').classList.remove('open');
}

function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            showModal("Time's Up!", 'Your 25-minute focus block is complete. Take a well-deserved short break!');
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    pauseTimer();
    timerSeconds = 25 * 60;
    updateTimerDisplay();
}

function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (!el) return;
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;
}

function saveScratchpad(text) {

async function handleChapterClick(chapterName) {
    const isCompleted = userProgress[chapterName] && userProgress[chapterName].completed;
    const safeName = chapterName.replace(/'/g, "\\'");

    if (chapterName === 'The Living World') {
        const questions = await loadLivingWorldQuestions();
        const content = buildLivingWorldQuestionsMarkup(questions);
        showModal(
            `Chapter: ${chapterName}`,
            'Practice the chapter with MCQs loaded from the raw GitHub JSON file. If the source JSON is malformed, the app automatically falls back to a valid built-in set.',
            `
            <div class="flex flex-wrap gap-2 justify-end w-full">
                <button onclick="toggleChapterProgress('${safeName}')" class="px-4 py-2 rounded-xl ${isCompleted ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'} text-white font-bold text-xs">
                    ${isCompleted ? 'Mark as Pending' : 'Mark as Completed ✓'}
                </button>
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300 text-xs">
                    Close
                </button>
            </div>
            `,
            content
        );
        return;
    }

    showModal(
        `Chapter: ${chapterName}`,
        `Coming Soon! Interactive Question Practice & CBT Sets for "${chapterName}" are currently under preparation. You can track your progress by toggling this chapter below:`,
        `
        <div class="flex flex-wrap gap-2 justify-end w-full">
            <button onclick="toggleChapterProgress('${safeName}')" class="px-4 py-2 rounded-xl ${isCompleted ? 'bg-amber-500 hover:bg-amber-600' : 'bg-emerald-600 hover:bg-emerald-700'} text-white font-bold text-xs">

        </div>
        `
    );
}

function toggleChapterProgress(chapterName) {
    if (!userProgress[chapterName]) {

}

function renderChapters() {
    const searchInput = document.getElementById('search');
    if (searchInput) searchQuery = searchInput.value;
    const filterSelect = document.getElementById('statusFilter');
    if (filterSelect) filterStatus = filterSelect.value;

    let list = data[subject].filter(x => x.toLowerCase().includes(searchQuery.toLowerCase()));

    if (filterStatus === 'completed') {
        list = list.filter(x => userProgress[x] && userProgress[x].completed);
    } else if (filterStatus === 'pending') {
        list = list.filter(x => !userProgress[x] || !userProgress[x].completed);
    }

    const titleEl = document.getElementById('subject-title');
    const countEl = document.getElementById('count');
    const chaptersEl = document.getElementById('chapters');

    if (titleEl) titleEl.textContent = subject + ' chapters';
    if (countEl) countEl.textContent = list.length + ' chapters · chapter-wise practice';

    if (chaptersEl) {
        chaptersEl.innerHTML = list.map((x) => {
            const isDone = userProgress[x] && userProgress[x].completed;
            const prog = isDone ? 100 : 0;
            const chipClass = subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy';
            const chipText = subject === 'Chemistry' ? 'CHEM' : subject.slice(0, 3).toUpperCase();
            return `
                <article class="card chapter relative cursor-pointer" onclick="handleChapterClick('${x.replace(/'/g, "\\'")}')">
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <span class="chip ${chipClass}">${chipText}</span>
                            ${isDone ? '<span class="bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Completed</span>' : '<span class="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Pending</span>'}
                        </div>
                        <div class="chapter-title">${x}</div>
                    </div>
                    <div>
                        <div class="meta"><span>Progress</span><b>${prog}%</b></div>
                        <div class="progress"><i style="width:${prog}%"></i></div>
                        <button class="practice" onclick="event.stopPropagation(); handleChapterClick('${x.replace(/'/g, "\\'")}')">Open chapter →</button>
                    </div>
                </article>
            `;
        }).join('');
    }
}

function updateGlobalProgress() {
    const totalChapters = 79;
    const completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
    const pct = Math.round((completedCount / totalChapters) * 100);

    const bar = document.getElementById('sidebar-progress-bar');
    const txt = document.getElementById('sidebar-progress-text');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = pct + '% syllabus covered';
}

renderView();
</script>
</body>
</html>

const livingWorldQuestionsCache = { data: null, loading: false, error: null };

function escapeHtml(value = '') {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

async function loadLivingWorldQuestions() {
    if (livingWorldQuestionsCache.data) return livingWorldQuestionsCache.data;
    if (livingWorldQuestionsCache.loading) return null;

    livingWorldQuestionsCache.loading = true;
    for (const url of LIVING_WORLD_JSON_URLS) {
        try {
            const response = await fetch(url, { cache: 'no-store' });
            if (!response.ok) continue;
            const text = await response.text();
            const data = JSON.parse(text);
            if (Array.isArray(data) && data.length > 0) {
                livingWorldQuestionsCache.data = data;
                livingWorldQuestionsCache.error = null;
                livingWorldQuestionsCache.loading = false;
                return data;
            }
        } catch (error) {
            console.warn('Remote JSON failed for Living World, trying fallback.', error);
        }
    }

    livingWorldQuestionsCache.data = FALLBACK_LIVING_WORLD_QUESTIONS;
    livingWorldQuestionsCache.error = 'Remote data unavailable, using local fallback set.';
    livingWorldQuestionsCache.loading = false;
    return FALLBACK_LIVING_WORLD_QUESTIONS;
}

function normalizeQuestion(option) {
    return String(option).trim();
}

function renderLivingWorldQuiz() {
    const currentQuestion = quizState.questions[quizState.currentIndex];
    if (!currentQuestion) return;

    const currentQuestionNumber = quizState.currentIndex + 1;
    const isAnswered = quizState.answered;
    const selected = quizState.selectedOption;
    const correctAnswer = currentQuestion.answer;

    const optionsMarkup = currentQuestion.options.map((option) => {
        const normalizedOption = normalizeQuestion(option);
        const isSelected = selected === normalizedOption;
        const isCorrect = normalizedOption === normalizeQuestion(correctAnswer);

        let optionClasses = 'flex items-center gap-3 w-full rounded-xl border px-4 py-3 text-left text-sm font-medium transition ';

        if (isAnswered) {
            if (isCorrect) {
                optionClasses += 'border-emerald-500 bg-emerald-100 text-emerald-900 dark:bg-emerald-900/20 dark:text-emerald-200';
            } else if (isSelected && !isCorrect) {
                optionClasses += 'border-rose-500 bg-rose-100 text-rose-900 dark:bg-rose-950/20 dark:text-rose-200';
            } else {
                optionClasses += 'border-slate-200 bg-slate-50 text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200';
            }
        } else {
            optionClasses += isSelected
                ? 'border-teal-500 bg-teal-50 text-teal-900 dark:bg-teal-950/30 dark:text-teal-100'
                : 'border-slate-200 bg-slate-50 text-slate-700 hover:border-teal-300 hover:bg-teal-50/40 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700';
        }

        return `
            <button type="button" data-option="${escapeHtml(normalizedOption)}" class="${optionClasses}" onclick="chooseLivingWorldOption('${escapeHtml(normalizedOption)}')">
                <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-white text-[10px] font-bold text-slate-700 shadow-sm dark:bg-slate-700 dark:text-slate-100">${String.fromCharCode(65 + currentQuestion.options.indexOf(option))}</span>
                <span>${escapeHtml(option)}</span>
            </button>
        `;
    }).join('');

    const resultMarkup = isAnswered ? `
        <div class="mt-4 rounded-xl border ${selected === normalizeQuestion(correctAnswer) ? 'border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950/30 dark:text-emerald-300' : 'border-amber-200 bg-amber-50 text-amber-800 dark:border-amber-900 dark:bg-amber-950/30 dark:text-amber-300'} px-4 py-3 text-sm font-semibold">
            ${selected === normalizeQuestion(correctAnswer) ? 'Correct!' : 'Wrong answer.'} Correct answer: <span class="font-black">${escapeHtml(correctAnswer)}</span>
        </div>
    ` : '';

    const isLastQuestion = quizState.currentIndex === quizState.questions.length - 1;
    const nextButtonLabel = isLastQuestion ? 'Finish Quiz' : 'Next Question';

    const content = `
        <div class="w-full max-w-3xl mx-auto">
            <div class="mb-5 flex items-center justify-between gap-3">
                <div>
                    <div class="text-[10px] font-extrabold uppercase tracking-[0.18em] text-teal-600 dark:text-teal-400">The Living World</div>
                    <div class="mt-1 text-lg font-black text-slate-900 dark:text-slate-100">Question ${currentQuestionNumber} of ${quizState.questions.length}</div>
                </div>
                <div class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600 dark:bg-slate-800 dark:text-slate-200">
                    Score: ${quizState.score}/${quizState.questions.length}
                </div>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-900/50">
                <p class="text-lg font-bold leading-7 text-slate-900 dark:text-slate-100">${escapeHtml(currentQuestion.question)}</p>
                <div class="mt-5 space-y-3">${optionsMarkup}</div>
                ${resultMarkup}
            </div>

            <div class="mt-5 flex justify-between gap-3">
                <button type="button" onclick="closeModal()" class="rounded-xl bg-slate-200 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">Close</button>
                <button type="button" onclick="${isAnswered ? (isLastQuestion ? 'finishLivingWorldQuiz()' : 'goToNextLivingWorldQuestion()') : 'submitLivingWorldAnswer()'}" class="rounded-xl bg-teal-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-teal-700 disabled:cursor-not-allowed disabled:opacity-50">
                    ${isAnswered ? nextButtonLabel : 'Submit Answer'}
                </button>
            </div>
        </div>
    `;
    document.getElementById('modalTitle').textContent = 'Living World Quiz';
    document.getElementById('modalBody').textContent = 'Answer each question and track your score in real time.';
    document.getElementById('modalContentSlot').innerHTML = content;
    document.getElementById('modalActions').innerHTML = '';
    openModal();
}

function chooseLivingWorldOption(optionValue) {
    if (quizState.answered) return;
    quizState.selectedOption = optionValue;
    const currentQuestion = quizState.questions[quizState.currentIndex];
    if (!currentQuestion) return;

    const correctAnswer = normalizeQuestion(currentQuestion.answer);
    if (normalizeQuestion(optionValue) === correctAnswer) {
        quizState.score += 1;
    }
    quizState.answered = true;
    renderLivingWorldQuiz();
}

function submitLivingWorldAnswer() {
    if (quizState.answered || quizState.selectedOption === null) return;
    chooseLivingWorldOption(quizState.selectedOption);
}

function goToNextLivingWorldQuestion() {
    quizState.currentIndex += 1;
    quizState.selectedOption = null;
    quizState.answered = false;

    if (quizState.currentIndex >= quizState.questions.length) {
        finishLivingWorldQuiz();
        return;
    }
    renderLivingWorldQuiz();
}

function finishLivingWorldQuiz() {
    const total = quizState.questions.length;
    const score = quizState.score;
    const percent = Math.round((score / total) * 100);

    const resultHtml = `
        <div class="w-full max-w-md mx-auto rounded-2xl border border-slate-200 bg-slate-50 p-5 text-center dark:border-slate-700 dark:bg-slate-900/50">
            <div class="text-[10px] font-extrabold uppercase tracking-[0.18em] text-teal-600 dark:text-teal-400">Quiz Result</div>
            <div class="mt-3 text-4xl font-black text-slate-900 dark:text-slate-100">${score}/${total}</div>
            <div class="mt-2 text-sm font-semibold text-slate-600 dark:text-slate-300">Accuracy: ${percent}%</div>
            <div class="mt-5 text-sm text-slate-600 dark:text-slate-300">
                ${percent >= 70 ? 'Excellent! You are well prepared.' : percent >= 50 ? 'Good work — keep revising the weak spots.' : 'Keep practicing. Review the explanations and retake the set.'}
            </div>
            <div class="mt-5 flex justify-center gap-3">
                <button type="button" onclick="restartLivingWorldQuiz()" class="rounded-xl bg-teal-600 px-4 py-2.5 text-sm font-bold text-white hover:bg-teal-700">Retake Quiz</button>
                <button type="button" onclick="closeModal()" class="rounded-xl bg-slate-200 px-4 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">Close</button>
            </div>
        </div>
    `;

    document.getElementById('modalTitle').textContent = 'Quiz Complete';
    document.getElementById('modalBody').textContent = 'Your Living World practice session is finished.';
    document.getElementById('modalContentSlot').innerHTML = resultHtml;
    document.getElementById('modalActions').innerHTML = '';
    openModal();
}

function restartLivingWorldQuiz() {
    quizState.currentIndex = 0;
    quizState.score = 0;
    quizState.selectedOption = null;
    quizState.answered = false;
    quizState.showResults = false;
    renderLivingWorldQuiz();
}

async function startLivingWorldQuiz() {
    const questions = await loadLivingWorldQuestions();
    quizState.questions = Array.isArray(questions) ? questions : FALLBACK_LIVING_WORLD_QUESTIONS;
    quizState.currentIndex = 0;
    quizState.score = 0;
    quizState.selectedOption = null;
    quizState.answered = false;
    quizState.showResults = false;
    renderLivingWorldQuiz();
}

function toggleTheme() {
    document.body.classList.toggle('dark');

    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('edupulse_theme', isDark ? 'dark' : 'light');
}

function toggleMobileNav(open) {
    const drawer = document.getElementById('sidebarDrawer');
    const overlay = document.getElementById('navOverlay');

        overlay.classList.add('open');

function switchTab(tab) {
    if (currentTab !== tab) previousTab = currentTab;
    currentTab = tab;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + tab);
    if (btn) btn.classList.add('active');
    toggleMobileNav(false);
    renderView();
}

    switchTab(previousTab || 'home');
}

function toggleBookmark(resourceId) {
    if (bookmarks.includes(resourceId)) {
        bookmarks = bookmarks.filter(b => b !== resourceId);
    } else {
        bookmarks.push(resourceId);
    }
    localStorage.setItem('edupulse_bookmarks', JSON.stringify(bookmarks));
    renderView();
}

function showModal(title, message, actionsHtml = null, contentHtml = '') {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = message;

    const actionsContainer = document.getElementById('modalActions');
    if (actionsHtml) {

}

function openModal() {
    document.getElementById('appModal').classList.add('open');
}

function closeModal() {
    document.getElementById('appModal').classList.remove('open');
}

function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            showModal("Time's Up!", 'Your 25-minute focus block is complete. Take a well-deserved short break!');
        }
    }, 1000);
}

function pauseTimer() { clearInterval(timerInterval); timerInterval = null; }
function resetTimer() { pauseTimer(); timerSeconds = 25 * 60; updateTimerDisplay(); }
function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (!el) return;
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;
}

    const isCompleted = userProgress[chapterName] && userProgress[chapterName].completed;

    showModal(

                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1 text-slate-900 dark:text-slate-100">Teacher Cards & Playlists</h2>
                <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-1">Direct access to renowned NEET faculty lectures and course playlists.</p>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 mt-6">
                ${TEACHERS_DATA.map(fac => `
                    <div class="card p-3 flex flex-col justify-between text-center items-center">
                        <div class="w-full flex flex-col items-center">
                            <img src="${fac.img}" alt="${fac.name}" class="w-20 h-20 rounded-2xl object-cover border border-slate-200 dark:border-slate-700 shadow-sm" onerror="this.src='https://placehold.co/200x200/0f172a/ffffff?text=EduPulse'">
                            <span class="mt-2 text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">${fac.badge}</span>
                            <h4 class="font-bold text-xs sm:text-sm mt-1.5 text-slate-800 dark:text-slate-100 line-clamp-1">${fac.name}</h4>
                        </div>
                        <button onclick="showModal('${fac.name}', 'Opening faculty playlist: ${fac.playlist}')" class="mt-3 w-full py-1.5 bg-teal-600 text-white text-xs font-bold rounded-xl hover:bg-teal-700"><i class="fa-solid fa-circle-play text-[10px]"></i> Playlist</button>
                    </div>
                `).join('')}
            </div>
        `;
    } else if (currentTab === 'tools') {
        container.innerHTML = `
            <div>
                <div class="tag">✦ Productivity Suite</div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1 text-slate-900 dark:text-slate-100">Focus Timer & Notes</h2>
                <p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-1">Maintain deep focus during study blocks and record quick formula notes.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                <div class="card p-6 text-center">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100">Focus Block (25 Min)</h3>
                    <div class="text-4xl sm:text-5xl font-black my-6 tracking-wider text-teal-600 dark:text-teal-400 font-mono" id="timerDisplay">25:00</div>
                    <div class="flex justify-center gap-2 sm:gap-3">
                        <button onclick="startTimer()" class="px-5 py-2 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 text-sm">Start</button>
                        <button onclick="pauseTimer()" class="px-5 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl font-bold text-sm">Pause</button>
                        <button onclick="resetTimer()" class="px-5 py-2 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-xl font-bold text-sm">Reset</button>
                    </div>
                </div>
                <div class="card p-6 flex flex-col">
                    <h3 class="text-lg font-bold mb-2 text-slate-900 dark:text-slate-100">Quick Scratchpad & Notes</h3>
                    <textarea id="scratchpadArea" oninput="saveScratchpad(this.value)" placeholder="Type key formulas, weak topics, or daily targets..." class="w-full h-40 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-teal-500">${userNotes}</textarea>
                    <span class="text-[10px] text-slate-400 dark:text-slate-500 mt-2 font-semibold">Auto-saved to local storage</span>
                </div>
            </div>
        `;
    }
}

function setSubject(s) { subject = s; renderView(); }

function renderChapters() {
    const searchInput = document.getElementById('search');
    if (searchInput) searchQuery = searchInput.value;
    const filterSelect = document.getElementById('statusFilter');
    if (filterSelect) filterStatus = filterSelect.value;

    let list = data[subject].filter(x => x.toLowerCase().includes(searchQuery.toLowerCase()));

    if (filterStatus === 'completed') {
        list = list.filter(x => userProgress[x] && userProgress[x].completed);
    } else if (filterStatus === 'pending') {
        list = list.filter(x => !userProgress[x] || !userProgress[x].completed);
    }

    const titleEl = document.getElementById('subject-title');
    const countEl = document.getElementById('count');
    const chaptersEl = document.getElementById('chapters');

    if (titleEl) titleEl.textContent = subject + ' chapters';
    if (countEl) countEl.textContent = list.length + ' chapters · chapter-wise practice';

    if (chaptersEl) {
        chaptersEl.innerHTML = list.map((x) => {
            const isDone = userProgress[x] && userProgress[x].completed;
            const prog = isDone ? 100 : 0;
            const chipClass = subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy';
            const chipText = subject === 'Chemistry' ? 'CHEM' : subject.slice(0, 3).toUpperCase();
            return `
                <article class="card chapter relative cursor-pointer" onclick="handleChapterClick('${x.replace(/'/g, "\\'")}')">
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <span class="chip ${chipClass}">${chipText}</span>
                            ${isDone ? '<span class="bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Completed</span>' : '<span class="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Pending</span>'}
                        </div>
                        <div class="chapter-title">${x}</div>
                    </div>
                    <div>
                        <div class="meta"><span>Progress</span><b>${prog}%</b></div>
                        <div class="progress"><i style="width:${prog}%"></i></div>
                        <button class="practice" onclick="event.stopPropagation(); handleChapterClick('${x.replace(/'/g, "\\'")}')">Open chapter →</button>
                    </div>
                </article>
            `;
        }).join('');
    }
}

function updateGlobalProgress() {
    const totalChapters = 79;
    const completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
    const pct = Math.round((completedCount / totalChapters) * 100);
    const bar = document.getElementById('sidebar-progress-bar');
    const txt = document.getElementById('sidebar-progress-text');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = pct + '% syllabus covered';
}

renderView();
</script>
</body>

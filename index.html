  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accent: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          animation: {
            'pulse-glow': 'pulseGlow 3s infinite alternate',
            'float': 'float 6s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s infinite linear',
            'fade-in-up': 'fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'scale-up': 'scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            pulseGlow: {
              '0%': { boxShadow: '0 0 15px rgba(56, 189, 248, 0.15), 0 0 30px rgba(99, 102, 241, 0.1)' },
              '100%': { boxShadow: '0 0 25px rgba(56, 189, 248, 0.35), 0 0 50px rgba(99, 102, 241, 0.25)' }
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' }
            },
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(12px) scale(0.98)' },
              '100%': { opacity: '1', transform: 'translateY(0) scale(1)' }
            },
            scaleUp: {
              '0%': { transform: 'scale(0.95)', opacity: '0' },
              '100%': { transform: 'scale(1)', opacity: '1' }
            }
          }
        }
      }
    }

    body {

    .theme-slate {
      --bg-main: #070a12;

      --bg-card: rgba(26, 36, 56, 0.65);

      --glow-gradient: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12), transparent 70%);
    }

    .theme-light {
      --bg-main: #f1f5f9;
      --bg-surface: rgba(255, 255, 255, 0.85);
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-card-hover: rgba(255, 255, 255, 0.98);

      --border-highlight: rgba(37, 99, 235, 0.4);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-color: #2563eb;
      --badge-bg: rgba(37, 99, 235, 0.08);
      --badge-text: #1d4ed8;
      --glow-gradient: radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.08), transparent 70%);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      background-image: var(--glow-gradient);
      background-attachment: fixed;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.3);
    }

    .glass-nav {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
    }

    .app-border { border-color: var(--border-color); }
    .app-muted { color: var(--text-muted); }
    .app-badge {
      background-color: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--border-color);
    }

    /* Custom animated gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shimmer-btn {
      background: linear-gradient(90deg, #0284c7 0%, #38bdf8 50%, #0284c7 100%);
      background-size: 200% 100%;
      animation: shimmer 3s infinite linear;

      width: 8px;
      height: 8px;

      background: var(--bg-main);

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-color);
    }
  </style>
</head>

      const [pomoTime, setPomoTime] = useState(25 * 60);

        const html = document.documentElement;

          html.className = 'theme-light';

      useEffect(() => {
        let timer = null;
        if (pomoActive && pomoTime > 0) {
          timer = setInterval(() => setPomoTime(t => t - 1), 1000);
        } else if (pomoTime === 0) {
          addToast('Pomodoro Timer Finished!', 'success');
          setPomoActive(false);
        }
        return () => clearInterval(timer);
      }, [pomoActive, pomoTime]);

      const addToast = (msg, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 2800);
      };

      const toggleBookmark = (id) => {
        setBookmarks(prev => {
          const updated = prev.includes(id) ? prev.filter(bId => bId !== id) : [...prev, id];
          localStorage.setItem('edupulse_bookmarks_v3', JSON.stringify(updated));
          addToast(prev.includes(id) ? 'Removed from saved links' : 'Saved to bookmarks', 'success');
          return updated;
        });
      };

      const filteredResources = useMemo(() => {
        return resources.filter(res => {
          if (selectedCategory === 'Saved Links') {
            if (!bookmarks.includes(res.id)) return false;
          } else if (selectedCategory !== 'All' && res.category !== selectedCategory) {
            return false;
          }

          if (selectedSubtag !== 'All' && res.subtag !== selectedSubtag) {
            return false;
          }

          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            return (
              res.title.toLowerCase().includes(q) ||
              res.description.toLowerCase().includes(q) ||
              res.category.toLowerCase().includes(q) ||
              (res.badge && res.badge.toLowerCase().includes(q))

          }

          return true;
        });

                    }`}
                  >
                    <i className="fas fa-graduation-cap"></i>
                    <span>Faculty Hub</span>
                    <span className="px-1.5 py-0.5 text-[10px] rounded-full bg-indigo-500/20 font-mono">{TEACHERS_DATA.length}</span>
                  </button>

                  <button 
                    onClick={() => setActiveTab('tools')}
                    className={`px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 ${
                      activeTab === 'tools' 
                        ? 'bg-sky-500/15 text-sky-400 border border-sky-500/30 shadow-sm' 
                        : 'app-muted hover:text-white hover:bg-white/5'
                    }`}
                  >
                    <i className="fas fa-pen-ruler"></i>
                    <span>Scratchpad & Timer</span>
                  </button>
                </nav>
              </div>

              {/* Action Buttons */}
              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => setIsPomoOpen(!isPomoOpen)}
                  className={`px-3 py-2 rounded-xl border text-xs font-medium transition-all duration-200 flex items-center gap-2 ${
                    isPomoOpen 
                      ? 'bg-sky-500/20 border-sky-500/50 text-sky-400 shadow-lg shadow-sky-500/10' 
                      : 'glass-card hover:border-sky-500/40'
                  }`}
                  title="Toggle Focus Timer"
                >
                  <i className="fas fa-stopwatch text-sky-400 animate-pulse"></i>
                  <span className="hidden sm:inline font-mono">
                    {Math.floor(pomoTime / 60).toString().padStart(2, '0')}:{(pomoTime % 60).toString().padStart(2, '0')}
                  </span>
                </button>

                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="p-2.5 rounded-xl border glass-card hover:border-sky-500/40 text-xs transition-all duration-200"
                  title="Toggle Theme"
                >
                  <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'} text-sm`}></i>
                </button>

                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="px-4 py-2 rounded-xl shimmer-btn text-white font-bold text-xs transition-all duration-200 shadow-md shadow-sky-500/20 hover:scale-105 active:scale-95 flex items-center gap-2"
                >
                  <i className="fas fa-plus text-xs"></i>
                  <span className="hidden sm:inline">Add Resource</span>
                </button>
              </div>

            </div>

            {/* Mobile Navigation Bar */}
            <div className="md:hidden flex border-t app-border px-3 py-2 gap-1.5 text-xs font-semibold">
              <button 
                onClick={() => setActiveTab('directory')}
                className={`flex-1 py-2 rounded-lg text-center transition-all ${
                  activeTab === 'directory' ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' : 'app-muted'
                }`}
              >
                Directory
              </button>
              <button 
                onClick={() => setActiveTab('teachers')}
                className={`flex-1 py-2 rounded-lg text-center transition-all ${
                  activeTab === 'teachers' ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' : 'app-muted'
                }`}
              >
                Faculty
              </button>
              <button 
                onClick={() => setActiveTab('tools')}
                className={`flex-1 py-2 rounded-lg text-center transition-all ${
                  activeTab === 'tools' ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' : 'app-muted'
                }`}
              >
                Tools
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-8 space-y-8">

            {/* FLOATING POMODORO TIMER PANEL */}
            {isPomoOpen && (
              <div className="p-5 rounded-2xl glass-card flex flex-col sm:flex-row items-center justify-between gap-4 animate-scale-up border-l-4 border-l-sky-500">
                <div className="flex items-center gap-4">
                  <div className="w-12 h-12 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center text-xl animate-pulse">
                    <i className="fas fa-stopwatch"></i>
                  </div>
                  <div>
                    <h4 className="font-extrabold text-sm tracking-tight">Focus Pomodoro Timer</h4>
                    <span className="font-mono text-2xl font-black text-sky-400 tracking-wider">
                      {Math.floor(pomoTime / 60).toString().padStart(2, '0')}:{(pomoTime % 60).toString().padStart(2, '0')}
                    </span>
                  </div>
                </div>

                <div className="flex items-center gap-2.5 w-full sm:w-auto">
                  <button 
                    onClick={() => setPomoActive(!pomoActive)}
                    className="flex-1 sm:flex-none px-6 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs transition-all shadow-lg shadow-sky-600/20 active:scale-95"
                  >
                    {pomoActive ? <><i className="fas fa-pause mr-1.5"></i> Pause</> : <><i className="fas fa-play mr-1.5"></i> Start</>}
                  </button>
                  <button 
                    onClick={() => { setPomoActive(false); setPomoTime(25 * 60); }}
                    className="flex-1 sm:flex-none px-5 py-2.5 rounded-xl border glass-card app-muted hover:text-white font-semibold text-xs transition-all"
                  >
                    Reset
                  </button>
                </div>
              </div>
            )}

            {}
            {activeTab === 'directory' && (
              <section className="space-y-6 animate-fade-in-up">
                
                {/* HERO BANNER & SEARCH BAR */}
                <div className="relative p-6 sm:p-8 rounded-3xl glass-card overflow-hidden border border-sky-500/20">
                  <div className="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                  <div className="absolute bottom-0 left-0 -ml-16 -mb-16 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                  <div className="relative z-10 max-w-2xl space-y-4">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-sky-500/10 text-sky-400 border border-sky-500/20">
                      <span className="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
                      Curated Study Hub for Aspirants
                    </div>
                    <h1 className="text-2xl sm:text-4xl font-black tracking-tight leading-tight">
                      Find lectures, test series & materials in <span className="gradient-text">seconds</span>.
                    </h1>
                    
                    {/* Modern Search Field */}
                    <div className="relative pt-2">
                      <i className="fas fa-magnifying-glass absolute left-4 top-6 text-sm text-sky-400"></i>
                      <input 
                        type="text" 
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        placeholder="Search books, test series, modules, PYQs, AI tools..." 
                        className="w-full pl-11 pr-10 py-3.5 rounded-2xl glass-card text-xs sm:text-sm font-medium focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all shadow-inner"
                      />
                      {searchQuery && (
                        <button 
                          onClick={() => setSearchQuery('')} 
                          className="absolute right-3.5 top-5 p-1 text-xs app-muted hover:text-white transition-colors"
                        >
                          <i className="fas fa-xmark"></i>
                        </button>
                      )}
                    </div>
                  </div>
                </div>

                {/* CATEGORY NAV & VIEW SWITCHER */}
                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                  {/* Category Pills */}
                  <div className="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 scrollbar-none text-xs font-semibold">
                    {CATEGORIES.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedCategory(cat)}
                        className={`px-4 py-2 rounded-xl border whitespace-nowrap transition-all duration-200 ${
                          selectedCategory === cat 
                            ? 'bg-gradient-to-r from-sky-500 to-indigo-600 border-transparent text-white shadow-lg shadow-sky-500/25' 
                            : 'glass-card hover:border-sky-500/30 app-muted hover:text-white'
                        }`}
                      >
                        {cat} {cat === 'Saved Links' && `(${bookmarks.length})`}
                      </button>
                    ))}
                  </div>

                  {/* View Switching Control */}
                  <div className="flex items-center justify-between sm:justify-end gap-3">
                    <span className="text-xs font-mono app-muted">{filteredResources.length} resources</span>
                    <div className="flex items-center p-1 rounded-xl glass-card border app-border">
                      <button 
                        onClick={() => setViewMode('grid')}
                        className={`px-3 py-1.5 rounded-lg text-xs transition-all ${viewMode === 'grid' ? 'bg-sky-500 text-white shadow' : 'app-muted'}`}
                        title="Grid Layout"
                      >
                        <i className="fas fa-border-all"></i>
                      </button>
                      <button 
                        onClick={() => setViewMode('list')}
                        className={`px-3 py-1.5 rounded-lg text-xs transition-all ${viewMode === 'list' ? 'bg-sky-500 text-white shadow' : 'app-muted'}`}
                        title="Compact List Layout"
                      >
                        <i className="fas fa-list-ul"></i>
                      </button>
                    </div>
                  </div>
                </div>

                {/* Subtag Pill Filters */}
                <div className="flex items-center gap-2 text-xs pt-2">
                  <span className="app-muted font-mono text-[11px]">Subtags:</span>
                  <div className="flex items-center gap-1.5 overflow-x-auto">
                    {SUBTAGS.map(st => (
                      <button
                        key={st}
                        onClick={() => setSelectedSubtag(st)}
                        className={`px-3 py-1 rounded-lg text-[11px] font-semibold transition-all ${
                          selectedSubtag === st 
                            ? 'bg-sky-500/20 text-sky-400 border border-sky-500/30' 
                            : 'app-muted hover:text-white hover:bg-white/5'
                        }`}
                      >
                        #{st}
                      </button>
                    ))}
                  </div>
                </div>

                {/* RESOURCE CARDS DISPLAY */}
                {filteredResources.length === 0 ? (
                  <div className="py-16 text-center rounded-2xl border border-dashed app-border glass-card space-y-3">
                    <div className="w-12 h-12 mx-auto rounded-full bg-sky-500/10 text-sky-400 flex items-center justify-center text-lg">
                      <i className="fas fa-search"></i>
                    </div>
                    <p className="text-sm font-semibold">No learning resources found matching your filter.</p>
                    <button 
                      onClick={() => { setSearchQuery(''); setSelectedCategory('All'); setSelectedSubtag('All'); }} 
                      className="px-4 py-2 rounded-xl bg-sky-500/20 text-sky-400 text-xs font-bold hover:bg-sky-500/30 transition-all"
                    >
                      Clear Search Filters
                    </button>
                  </div>
                ) : viewMode === 'grid' ? (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredResources.map(res => (
                      <div 
                        key={res.id}
                        onClick={() => window.open(res.url, '_blank')}
                        className="glass-card p-5 rounded-2xl cursor-pointer flex flex-col justify-between space-y-4 group relative overflow-hidden"
                      >
                        <div className="space-y-3">
                          <div className="flex items-start justify-between gap-3">
                            <div className="flex items-center gap-3">
                              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500/20 to-indigo-500/20 text-sky-400 border border-sky-500/30 flex items-center justify-center text-sm shrink-0 group-hover:scale-110 group-hover:bg-sky-500 group-hover:text-white transition-all duration-300">
                                <i className={`fas ${res.icon || 'fa-globe'}`}></i>
                              </div>
                              <div>
                                <h3 className="font-bold text-sm tracking-tight group-hover:text-sky-400 transition-colors line-clamp-1">
                                  {res.title}
                                </h3>
                                <span className="text-[10px] font-mono app-muted">#{res.subtag}</span>
                              </div>
                            </div>
                            <button 
                              onClick={(e) => { e.stopPropagation(); toggleBookmark(res.id); }}
                              className={`p-2 rounded-lg transition-transform active:scale-75 ${bookmarks.includes(res.id) ? 'text-amber-400' : 'app-muted hover:text-amber-400'}`}
                              title={bookmarks.includes(res.id) ? "Bookmarked" : "Bookmark link"}
                            >
                              <i className={`fa-${bookmarks.includes(res.id) ? 'solid' : 'regular'} fa-star text-sm`}></i>
                            </button>
                          </div>

                          <p className="text-xs app-muted leading-relaxed line-clamp-2">
                            {res.description}
                          </p>
                        </div>

                        <div className="flex items-center justify-between text-[11px] pt-3 border-t app-border">
                          <span className="app-badge px-2.5 py-1 rounded-lg font-mono text-[10px] font-bold">
                            {res.badge || res.category}
                          </span>
                          <span className="text-sky-400 group-hover:translate-x-1 transition-transform flex items-center gap-1.5 font-bold">
                            Visit Hub <i className="fas fa-arrow-right text-[10px]"></i>
                          </span>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="space-y-2">
                    {filteredResources.map(res => (
                      <div 
                        key={res.id}
                        onClick={() => window.open(res.url, '_blank')}
                        className="glass-card p-3.5 rounded-xl cursor-pointer flex items-center justify-between gap-4 text-xs group hover:border-sky-500/50"
                      >
                        <div className="flex items-center gap-3.5 truncate">
                          <div className="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-400 flex items-center justify-center text-xs shrink-0 group-hover:bg-sky-500 group-hover:text-white transition-all">
                            <i className={`fas ${res.icon || 'fa-globe'}`}></i>
                          </div>
                          <span className="font-bold truncate text-sm">{res.title}</span>
                          <span className="app-muted text-xs hidden md:inline truncate">— {res.description}</span>
                        </div>
                        <div className="flex items-center gap-3 shrink-0">
                          <span className="app-badge px-2.5 py-1 rounded-md text-[10px] font-mono font-bold">{res.badge || res.category}</span>
                          <button 
                            onClick={(e) => { e.stopPropagation(); toggleBookmark(res.id); }}
                            className={`p-1 ${bookmarks.includes(res.id) ? 'text-amber-400' : 'app-muted hover:text-amber-400'}`}
                          >
                            <i className={`fa-${bookmarks.includes(res.id) ? 'solid' : 'regular'} fa-star`}></i>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

              </section>
            )}

            {}
            {activeTab === 'teachers' && (
              <section className="space-y-6 animate-fade-in-up">
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 p-6 rounded-2xl glass-card border-l-4 border-l-red-500">
                  <div>
                    <div className="flex items-center gap-2 text-red-500 text-xs font-bold uppercase tracking-wider mb-1">
                      <i className="fab fa-youtube text-sm"></i> YouTube Masterclass Faculty
                    </div>
                    <h2 className="text-xl font-extrabold">Top Educator Playlists</h2>
                    <p className="text-xs app-muted mt-1">Direct access to structured YouTube courses, batch lectures, and revision playlists.</p>
                  </div>
                  <span className="app-badge px-3 py-1.5 rounded-xl text-xs font-mono font-bold self-start sm:self-center">
                    {TEACHERS_DATA.length} Top Educators
                  </span>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {TEACHERS_DATA.map(t => (
                    <div key={t.id} className="glass-card p-5 rounded-2xl flex flex-col justify-between space-y-4 group">
                      <div className="flex items-center gap-3.5">
                        <div className="relative shrink-0">
                          <img 
                            src={t.image} 
                            alt={t.name}
                            className="w-14 h-14 rounded-xl object-cover border-2 border-sky-500/30 group-hover:border-red-500 transition-colors shadow-md"
                            onError={(e) => { e.target.src = "https://placehold.co/150x150/0284c7/ffffff?text=Faculty"; }}
                          />
                          <span className="absolute -bottom-1 -right-1 w-4 h-4 bg-red-600 rounded-full flex items-center justify-center text-[8px] text-white">
                            <i className="fas fa-play"></i>
                          </span>
                        </div>
                        <div className="truncate">
                          <h3 className="font-extrabold text-xs sm:text-sm truncate group-hover:text-sky-400 transition-colors">{t.name}</h3>
                          <span className="text-[10px] font-mono app-muted block mt-0.5">{t.subject}</span>
                        </div>
                      </div>

                      <a 
                        href={t.playlist} 
                        target="_blank" 
                        rel="noopener noreferrer"
                        className="w-full py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold text-xs text-center transition-all shadow-md shadow-red-600/20 active:scale-95 flex items-center justify-center gap-2"
                      >
                        <i className="fab fa-youtube text-sm"></i>
                        <span>Open Playlist</span>
                      </a>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {}
            {activeTab === 'tools' && (
              <section className="space-y-6 animate-fade-in-up">
                <div className="glass-card p-6 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between border-b app-border pb-3">
                    <div className="flex items-center gap-2.5">
                      <div className="w-9 h-9 rounded-xl bg-sky-500/10 text-sky-400 flex items-center justify-center text-sm">
                        <i className="fas fa-pen-to-square"></i>
                      </div>
                      <div>
                        <h2 className="text-sm font-extrabold">Aspirant's Study Scratchpad</h2>
                        <span className="text-[10px] app-muted block font-mono">Persisted instantly in your browser</span>
                      </div>
                    </div>
                    <button 
                      onClick={() => { setNotes(''); localStorage.removeItem('edupulse_notes'); addToast('Scratchpad cleared'); }}
                      className="px-3 py-1.5 rounded-lg text-xs font-semibold text-rose-400 hover:bg-rose-500/10 transition-all"
                    >
                      <i className="fas fa-trash-can mr-1"></i> Clear Notes
                    </button>
                  </div>

                  <textarea 
                    value={notes}
                    onChange={(e) => { setNotes(e.target.value); localStorage.setItem('edupulse_notes', e.target.value); }}
                    rows="10"
                    placeholder="Write down today's targets, formula shortcuts, remaining backlogs, revision checklist..."
                    className="w-full p-4 rounded-xl glass-card text-xs sm:text-sm font-mono focus:outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 transition-all leading-relaxed"
                  ></textarea>

                  <div className="flex justify-between items-center text-[11px] app-muted font-mono pt-1">
                    <span>{notes.length} characters</span>
                    <span>Auto-saved locally</span>
                  </div>
                </div>
              </section>
            )}

          </main>

          {}
          {/* MODAL: ADD CUSTOM RESOURCE */}
          {isAddModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-center justify-center p-4">
              <div className="p-6 rounded-2xl glass-card max-w-md w-full space-y-5 animate-scale-up border-sky-500/30">
                <div className="flex items-center justify-between border-b app-border pb-3">
                  <h3 className="text-sm font-extrabold flex items-center gap-2">
                    <i className="fas fa-plus-circle text-sky-400"></i> Add New Study Resource
                  </h3>
                  <button onClick={() => setIsAddModalOpen(false)} className="app-muted hover:text-white p-1">
                    <i className="fas fa-xmark text-sm"></i>
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  const form = e.target;
                  const newRes = {
                    id: Date.now().toString(),
                    title: form.title.value,
                    url: form.url.value,
                    category: form.category.value,
                    badge: form.badge.value || 'Custom',
                    description: form.desc.value || 'User added link.',
                    icon: 'fa-globe',
                    subtag: 'Batches'
                  };
                  const updated = [...resources, newRes];
                  setResources(updated);
                  const customOnly = updated.filter(r => !INITIAL_RESOURCES.some(i => i.id === r.id));
                  localStorage.setItem('edupulse_custom_resources_v3', JSON.stringify(customOnly));
                  addToast('Resource added successfully!', 'success');
                  setIsAddModalOpen(false);
                }} className="space-y-4 text-xs font-semibold">
                  <div>
                    <label className="block app-muted mb-1 font-mono">Resource Title *</label>
                    <input name="title" required className="w-full p-2.5 rounded-xl glass-card focus:outline-none focus:border-sky-500" placeholder="e.g. Organic Chemistry Module" />
                  </div>
                  <div>
                    <label className="block app-muted mb-1 font-mono">Website URL *</label>
                    <input name="url" type="url" required className="w-full p-2.5 rounded-xl glass-card focus:outline-none focus:border-sky-500" placeholder="https://..." />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block app-muted mb-1 font-mono">Category</label>
                      <select name="category" className="w-full p-2.5 rounded-xl glass-card focus:outline-none focus:border-sky-500">
                        {CATEGORIES.filter(c => c !== 'All' && c !== 'Saved Links').map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block app-muted mb-1 font-mono">Badge Label</label>
                      <input name="badge" className="w-full p-2.5 rounded-xl glass-card focus:outline-none focus:border-sky-500" placeholder="e.g. Physics" />
                    </div>
                  </div>
                  <div>
                    <label className="block app-muted mb-1 font-mono">Description</label>
                    <input name="desc" className="w-full p-2.5 rounded-xl glass-card focus:outline-none focus:border-sky-500" placeholder="Short description..." />
                  </div>
                  <button type="submit" className="w-full py-3 rounded-xl shimmer-btn text-white font-bold transition-all shadow-lg active:scale-95">
                    Save Resource Link
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t glass-nav py-6 text-xs app-muted mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-3">
              <span className="font-semibold">EduPulse PRO • Modern Study Portal</span>
              <span className="font-mono text-[11px]">All 12 Faculty Playlists & Links Active</span>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

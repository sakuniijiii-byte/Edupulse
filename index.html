<script>
// ===== Storage Module & Versioned Models =====
const STORAGE_KEYS = {
attempts: 'edupulse_attempts_v1',
qstats: 'edupulse_qstats_v1',
session: 'edupulse_session_v1',
settings: 'edupulse_settings_v1',
streak: 'edupulse_streak_v1',
progress: 'edupulse_progress',
todos: 'edupulse_todos',
theme: 'edupulse_theme',
focus: 'edupulse_focus_sessions',
timerPreset: 'edupulse_timer_preset'
};

const defaultSettings = {
marksCorrect: 4,
marksWrong: -1,
minutesPerQuestion: 1,
shuffleQuestions: false,
shuffleOptions: false,
showTimer: true,
confirmSubmit: true,
haptics: true,
dailyGoalQuestions: 30
};

const StorageModule = {
get(key, fallback) {
try {
const raw = localStorage.getItem(key);
if (raw === null) return fallback;
return JSON.parse(raw);
} catch (e) {
console.warn(`Storage read error for ${key}:`, e);
return fallback;
}
},
set(key, value) {
try {
localStorage.setItem(key, JSON.stringify(value));
return true;
} catch (e) {
console.warn(`Storage write error for ${key}, trimming attempts...`, e);
if (key === STORAGE_KEYS.attempts) {
try {
const trimmed = (Array.isArray(value) ? value : []).slice(0, 100);
localStorage.setItem(key, JSON.stringify(trimmed));
return true;
} catch (err) {
console.error('Critical quota exceeded:', err);
}
}
showToast('Storage quota reached! Oldest history trimmed.', 'error');
return false;
}
},
init() {
if (!localStorage.getItem(STORAGE_KEYS.settings)) {
this.set(STORAGE_KEYS.settings, defaultSettings);
}
if (!localStorage.getItem(STORAGE_KEYS.attempts)) {
this.set(STORAGE_KEYS.attempts, []);
}
if (!localStorage.getItem(STORAGE_KEYS.qstats)) {
this.set(STORAGE_KEYS.qstats, {});
}
if (!localStorage.getItem(STORAGE_KEYS.streak)) {
const today = new Date().toISOString().split('T')[0];
this.set(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: today, dailyCounts: {} });
}
this.updateStreak();
},
updateStreak() {
const streak = this.get(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: '', dailyCounts: {} });
const today = new Date().toISOString().split('T')[0];
if (streak.lastActiveDate === today) return;
const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
if (streak.lastActiveDate === yesterday) {
streak.current += 1;
} else if (streak.lastActiveDate !== today) {
streak.current = streak.dailyCounts[today] ? streak.current : 0;
}
if (streak.current > streak.best) streak.best = streak.current;
this.set(STORAGE_KEYS.streak, streak);
},
recordActivity(questionsAnsweredCount) {
const streak = this.get(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: '', dailyCounts: {} });
const today = new Date().toISOString().split('T')[0];
streak.dailyCounts[today] = (streak.dailyCounts[today] || 0) + questionsAnsweredCount;
streak.lastActiveDate = today;
if (streak.current === 0) streak.current = 1;
if (streak.current > streak.best) streak.best = streak.current;

const keys = Object.keys(streak.dailyCounts).sort();
if (keys.length > 120) {
for (let i = 0; i < keys.length - 120; i++) delete streak.dailyCounts[keys[i]];
}
this.set(STORAGE_KEYS.streak, streak);

const settings = this.get(STORAGE_KEYS.settings, defaultSettings);
const todayTotal = streak.dailyCounts[today];
if (todayTotal >= settings.dailyGoalQuestions && todayTotal - questionsAnsweredCount < settings.dailyGoalQuestions) {
showToast(`🎯 Daily goal of ${settings.dailyGoalQuestions} questions reached!`, 'success');
}
}
};

function showToast(msg, type = 'success') {
const container = document.getElementById('toast-container');
if (!container) return;
const toast = document.createElement('div');
const bg = type === 'error' ? 'bg-rose-600 text-white' : type === 'warning' ? 'bg-amber-500 text-slate-950 font-bold' : 'bg-teal-600 text-white';
toast.className = `px-4 py-3 rounded-2xl shadow-xl text-xs font-bold ${bg} transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto flex items-center gap-2`;
toast.innerHTML = `<i class="fa-solid ${type === 'error' ? 'fa-circle-exclamation' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-check'}"></i> ${escapeHtml(msg)}`;
container.appendChild(toast);
setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 20);
setTimeout(() => {
toast.classList.add('translate-y-2', 'opacity-0');
setTimeout(() => toast.remove(), 300);
}, 3000);
}

function escapeHtml(v = '') {
return String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
const multiline = v => escapeHtml(v).replace(/\n/g, '<br>');
const jsArg = s => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");

function simpleHash(str) {
let hash = 0;
for (let i = 0; i < str.length; i++) {
hash = ((hash << 5) - hash) + str.charCodeAt(i);
hash |= 0;
}
return Math.abs(hash).toString(36);
}

// ===== Chapter Availability Checks =====
let activeAvailabilityFetches = 0;
const availabilityQueue = [];

function checkChapterAvailability(chapterName, callback) {
if (chapterAvailability[chapterName] !== undefined) {
callback(chapterAvailability[chapterName]);
return;
}
availabilityQueue.push({ chapterName, callback });
processAvailabilityQueue();
}

function processAvailabilityQueue() {
if (activeAvailabilityFetches >= 4 || availabilityQueue.length === 0) return;
const item = availabilityQueue.shift();
activeAvailabilityFetches++;

fetch(quizUrl(item.chapterName), { method: 'HEAD', cache: 'force-cache' })
.then(res => {
const available = res.ok;
chapterAvailability[item.chapterName] = available;
item.callback(available);
})
.catch(() => {
fetch(quizUrl(item.chapterName), { cache: 'force-cache' })
.then(res => {
const available = res.ok;
chapterAvailability[item.chapterName] = available;
item.callback(available);
})
.catch(() => {
chapterAvailability[item.chapterName] = false;
item.callback(false);
});
})
.finally(() => {
activeAvailabilityFetches--;
processAvailabilityQueue();
});
}

async function setupQuizMode(mode, subj, chapterName, customQuestions = null) {
subject = subj;
toggleFullScreenMode(false);
setModal('', '', `<div class="flex flex-col items-center justify-center py-10"> <i class="fa-solid fa-spinner fa-spin text-4xl text-teal-600 mb-4"></i> <p class="text-sm font-bold text-slate-700 dark:text-slate-200">Preparing ${mode === 'practice' ? 'Practice' : 'Test'} session...</p> </div>`);

try {
let rawQuestions = customQuestions;
let chapterTitle = chapterName;

if (!rawQuestions) {
const res = await fetch(quizUrl(chapterName), { cache: 'no-cache' });
if (res.status === 404) { showComingSoon(chapterName); return; }
if (!res.ok) throw new Error(`HTTP ${res.status}`);
const raw = await res.json();
const list = Array.isArray(raw) ? raw : raw.qs;
if (!Array.isArray(list) || !list.length) throw new Error('No questions found in file.');
chapterTitle = raw.name || chapterName;
rawQuestions = list.map((q, i) => {
const options = (q.o || q.options || q.opts || []).map(String);
const a = q.a ?? q.answer ?? q.ans;
let correct = typeof a === 'number' ? a - 1 : options.findIndex(o => o.trim() === String(a).trim());
if (correct < 0 || correct >= options.length) correct = 0;
return {
qKey: slugify(chapterName) + '#' + simpleHash(q.q || q.question || String(i)),
question: q.q || q.question || `Question ${i + 1}`,
options,
correct,
explanation: q.s || '',
img: q.img || '',
alt: q.alt || '',
sourceChapter: chapterName
};
});
}

if (mode === 'practice') {
setModal('Practice Settings', chapterName, `<div class="space-y-4 py-2"> <div> <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Question Count</label> <select id="pracCount" class="w-full mt-1.5 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-semibold"> <option value="all">All (${rawQuestions.length})</option> <option value="10">10 Questions</option> <option value="20">20 Questions</option> <option value="50">50 Questions</option> </select> </div> <div class="space-y-2"> <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300"><input type="checkbox" id="pracShuffleQ" class="w-4 h-4 rounded text-teal-600"> Shuffle Questions</label> <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300"><input type="checkbox" id="pracShuffleO" class="w-4 h-4 rounded text-teal-600"> Shuffle Options</label> <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 dark:text-slate-300"><input type="checkbox" id="pracOnlyWrong" class="w-4 h-4 rounded text-teal-600"> Only Wrong / Bookmarked Questions</label> </div> </div>`,

function launchPracticeSession(subj, chapterName, rawQuestions) {
const countVal = document.getElementById('pracCount')?.value || 'all';
const shuffleQ = document.getElementById('pracShuffleQ')?.checked || false;
const shuffleO = document.getElementById('pracShuffleO')?.checked || false;
const onlyWrong = document.getElementById('pracOnlyWrong')?.checked || false;

let qs = [...rawQuestions];
if (onlyWrong) {
const qstats = StorageModule.get(STORAGE_KEYS.qstats, {});
qs = qs.filter(q => {
const st = qstats[q.qKey];
return st && (st.bookmarked || st.wrong > st.correct);
});
if (!qs.length) {
showToast('No wrong or bookmarked questions found for this filter!', 'warning');
qs = [...rawQuestions];
}
}

if (shuffleQ) {
for (let i = qs.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[qs[i], qs[j]] = [qs[j], qs[i]];
}
}

if (countVal !== 'all') {
const limit = parseInt(countVal, 10);
qs = qs.slice(0, limit);
}

if (shuffleO) {
qs = qs.map(q => {
const indexedOpts = q.options.map((o, idx) => ({ text: o, originalIdx: idx }));
for (let i = indexedOpts.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[indexedOpts[i], indexedOpts[j]] = [indexedOpts[j], indexedOpts[i]];
}
const newOptions = indexedOpts.map(io => io.text);
const newCorrect = indexedOpts.findIndex(io => io.originalIdx === q.correct);
return { ...q, options: newOptions, correct: newCorrect };
});
}

Object.assign(quizState, {
mode: 'practice',
chapter: chapterName,
subject: subj,
title: `${subj} — ${chapterName} (Practice)`,
questions: qs,
currentIndex: 0,
userAnswers: {},
marked: {},
bookmarked: {},
skippedQuestions: {},
questionTimes: {},
questionStartTimer: Date.now(),
testEndTimestamp: null,
tabSwitches: 0,
paletteExpanded: false
});

closeModal();
renderPracticeQuiz();
}

function launchTestSession(subj, chapterName, rawQuestions) {
const durationMins = parseInt(document.getElementById('testDuration')?.value || '60', 10);
const endTimestamp = Date.now() + durationMins * 60 * 1000;

Object.assign(quizState, {

chapter: chapterName,
subject: subj,
title: `${subj} — ${chapterName} (Test Mode)`,
questions: rawQuestions,
currentIndex: 0,
userAnswers: {},
marked: {},
bookmarked: {},
skippedQuestions: {},
questionTimes: {},
questionStartTimer: Date.now(),
testEndTimestamp: endTimestamp,
tabSwitches: 0,
paletteExpanded: false
});

closeModal();
renderTestQuiz();
}

// ===== Practice Quiz Engine & UI =====
function renderPracticeQuiz() {
toggleFullScreenMode(true);
if (quizState.timerInterval) { clearInterval(quizState.timerInterval); quizState.timerInterval = null; }

const q = quizState.questions[quizState.currentIndex];

const isRight = selected === q.correct;

if (ans !== undefined) {

} else if (quizState.skippedQuestions[i]) {
stateClass = 'bg-amber-500 text-white font-bold border-transparent';
}
if (quizState.bookmarked[i]) stateClass += ' ring-2 ring-amber-400';
return `<button onclick="jumpToPracticeQuestion(${i})" class="w-8 h-8 rounded-lg text-xs flex items-center justify-center shrink-0 transition-all ${stateClass} ${ring}">${i + 1}</button>`;
}).join('');

let c = 'flex items-center gap-3 w-full rounded-xl border px-4 py-3 text-left text-sm font-medium transition cursor-pointer ';
if (answered) {
if (i === q.correct) c += 'border-emerald-500 bg-emerald-100 text-emerald-900 dark:bg-emerald-900/30 dark:text-emerald-200 font-bold';
else if (i === selected) c += 'border-rose-500 bg-rose-100 text-rose-900 dark:bg-rose-950/30 dark:text-rose-200 font-bold';
else c += 'border-slate-200 bg-slate-50 text-slate-700 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 opacity-60';
} else {
c += 'border-slate-200 bg-slate-50 text-slate-700 hover:border-teal-300 hover:bg-teal-50/40 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700';
}
return `<button type="button" class="${c}" ${answered ? 'disabled' : `onclick="selectPracticeOption(${i})"`}> <span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-white text-[10px] font-bold text-slate-700 shadow-sm dark:bg-slate-700 dark:text-slate-100">${String.fromCharCode(65 + i)}</span> <span class="flex-1">${escapeHtml(opt)}</span></button>`;
}).join('');

const imageHtml = q.img ? `<div class="my-4"><img src="${DATA_BASE}img/${escapeHtml(q.img)}" alt="${escapeHtml(q.alt || 'Question diagram')}" class="max-h-60 rounded-xl border border-slate-200 dark:border-slate-700 object-contain mx-auto" onerror="this.onerror=null;this.parentElement.style.display='none';"></div>` : '';

const result = answered ? `<div class="mt-4 rounded-xl border ${isRight ? 'border-emerald-200 bg-emerald-50 text-emerald-800 dark:border-emerald-900 dark:bg-emerald-950/30 dark:text-emerald-300' : 'border-rose-200 bg-rose-50 text-rose-800 dark:border-rose-900 dark:bg-rose-950/30 dark:text-rose-300'} px-4 py-3 text-sm font-semibold"> ${isRight ? '<i class="fa-solid fa-circle-check text-emerald-500 mr-2"></i>Correct!' : '<i class="fa-solid fa-circle-xmark text-rose-500 mr-2"></i>Incorrect.'} Correct option: <span class="font-black">${String.fromCharCode(65 + q.correct)}. ${escapeHtml(q.options[q.correct])}</span> ${q.explanation ? `<div class="mt-2 text-xs font-medium opacity-80">${escapeHtml(q.explanation)}</div>` : ''} </div>` : '';

const last = idx === total - 1;
const html = `<div class="w-full h-full flex flex-col justify-between max-w-5xl mx-auto p-2 sm:p-4 relative"> <div class="mb-2 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3"> <div class="flex items-center gap-3"> <button type="button" onclick="confirmExitQuiz()" class="p-2 rounded-xl text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i class="fa-solid fa-arrow-left text-lg"></i></button> <div> <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 leading-tight">${escapeHtml(quizState.title)}</h2> <p class="text-xs text-slate-500 dark:text-slate-400">Practice Mode (Instant Feedback)</p> </div> </div> <div class="flex items-center gap-2"> <button type="button" onclick="toggleBookmarkCurrent()" class="px-3 py-1.5 rounded-xl border ${isBookmarked ? 'border-amber-500 bg-amber-500/10 text-amber-600' : 'border-slate-200 dark:border-slate-700 text-slate-500'} text-xs font-bold transition flex items-center gap-1.5"><i class="fa-solid fa-star"></i> ${isBookmarked ? 'Bookmarked' : 'Bookmark'}</button> <div class="rounded-full bg-slate-100 px-3 py-1 text-xs font-bold text-slate-600 dark:bg-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700">Q: ${idx + 1}/${total}</div> </div> </div> <div class="flex items-center gap-2 mb-3 px-1 py-1"> <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-2 px-1 scroll-smooth flex-1">${palette}</div> </div> <div class="flex-1 overflow-y-auto my-2 rounded-2xl border border-slate-200 bg-white p-4 sm:p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/50 flex flex-col justify-between"> <div> <span class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Question ${idx + 1} of ${total}</span> <p class="mt-3 text-base sm:text-lg font-bold leading-relaxed text-slate-900 dark:text-slate-100">${multiline(q.question)}</p> ${imageHtml} <div class="mt-5 space-y-3">${options}</div> ${result} </div> <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2"> <button type="button" onclick="jumpToPracticeQuestion(${Math.max(0, idx - 1)})" ${idx === 0 ? 'disabled' : ''} class="rounded-xl bg-slate-100 dark:bg-slate-800 px-4 py-2 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-200 disabled:opacity-40">← Previous</button> <div class="flex items-center gap-2"> ${!answered && !last ? `<button type="button" onclick="skipPracticeQuestion()" class="rounded-xl bg-amber-500 hover:bg-amber-600 px-4 py-2 text-xs font-bold text-white shadow-sm transition"><i class="fa-solid fa-forward-step mr-1"></i> Skip</button>` : ''} <button type="button" onclick="${last ? 'finishPracticeQuiz()' : 'goToNextPracticeQuestion()'}" class="rounded-xl bg-teal-600 px-5 py-2 text-xs font-bold text-white hover:bg-teal-700 transition">${last ? 'Finish Quiz' : 'Next →'}</button> </div> </div> </div> </div>`;
setModal('', '', html);
}

function selectPracticeOption(optionIndex) {
const idx = quizState.currentIndex;
if (quizState.userAnswers[idx] !== undefined) return;

const now = Date.now();
const elapsed = Math.round((now - quizState.questionStartTimer) / 1000);
quizState.questionTimes[idx] = (quizState.questionTimes[idx] || 0) + elapsed;
quizState.questionStartTimer = now;

quizState.userAnswers[idx] = optionIndex;
delete quizState.skippedQuestions[idx];

const q = quizState.questions[idx];
const isCorrect = optionIndex === q.correct;

const qstats = StorageModule.get(STORAGE_KEYS.qstats, {});
if (!qstats[q.qKey]) qstats[q.qKey] = { seen: 0, correct: 0, wrong: 0, lastResult: null, lastSeen: null, bookmarked: quizState.bookmarked[idx] || false, avgTime: 0 };
const st = qstats[q.qKey];
st.seen++;
if (isCorrect) st.correct++; else st.wrong++;
st.lastResult = isCorrect;
st.lastSeen = Date.now();
st.avgTime = Math.round(((st.avgTime * (st.seen - 1)) + quizState.questionTimes[idx]) / st.seen);
StorageModule.set(STORAGE_KEYS.qstats, qstats);

renderPracticeQuiz();
}

function toggleBookmarkCurrent() {
const idx = quizState.currentIndex;
quizState.bookmarked[idx] = !quizState.bookmarked[idx];
const q = quizState.questions[idx];
const qstats = StorageModule.get(STORAGE_KEYS.qstats, {});
if (!qstats[q.qKey]) qstats[q.qKey] = { seen: 0, correct: 0, wrong: 0, lastResult: null, lastSeen: null, bookmarked: false, avgTime: 0 };
qstats[q.qKey].bookmarked = quizState.bookmarked[idx];
StorageModule.set(STORAGE_KEYS.qstats, qstats);
showToast(quizState.bookmarked[idx] ? 'Question bookmarked' : 'Bookmark removed');
renderPracticeQuiz();
}

function jumpToPracticeQuestion(i) {
if (i < 0 || i >= quizState.questions.length) return;
const now = Date.now();
const elapsed = Math.round((now - quizState.questionStartTimer) / 1000);
quizState.questionTimes[quizState.currentIndex] = (quizState.questionTimes[quizState.currentIndex] || 0) + elapsed;
quizState.currentIndex = i;
quizState.questionStartTimer = Date.now();
renderPracticeQuiz();
}

function skipPracticeQuestion() {
if (quizState.userAnswers[quizState.currentIndex] === undefined) quizState.skippedQuestions[quizState.currentIndex] = true;
goToNextPracticeQuestion();
}

function goToNextPracticeQuestion() {
quizState.currentIndex += 1;
if (quizState.currentIndex >= quizState.questions.length) {
quizState.currentIndex = quizState.questions.length - 1;
finishPracticeQuiz();
return;
}
quizState.questionStartTimer = Date.now();
renderPracticeQuiz();
}

function finishPracticeQuiz() {
const total = quizState.questions.length;
let correct = 0, wrong = 0, skipped = 0;
quizState.questions.forEach((q, i) => {
const ans = quizState.userAnswers[i];
if (ans === undefined) { skipped++; }
else if (ans === q.correct) correct++;
else wrong++;
});
const attempted = correct + wrong;
const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
const totalTimeSec = Object.values(quizState.questionTimes).reduce((a, b) => a + b, 0);

const attemptRecord = {
id: 'att_' + Date.now(),
chapter: quizState.chapter,
subject: quizState.subject,
mode: 'practice',
startedAt: Date.now() - (totalTimeSec * 1000),
finishedAt: Date.now(),
durationSec: totalTimeSec,
limitSec: null,
total, attempted, correct, wrong, skipped,
score: correct, maxScore: total, accuracy, tabSwitches: 0,
answers: quizState.questions.map((q, i) => ({
k: q.qKey,
sel: quizState.userAnswers[i] !== undefined ? quizState.userAnswers[i] : null,
ok: quizState.userAnswers[i] !== undefined ? (quizState.userAnswers[i] === q.correct) : null,
t: quizState.questionTimes[i] || 0,
marked: !!quizState.marked[i]
}))
};

const attempts = StorageModule.get(STORAGE_KEYS.attempts, []);
attempts.unshift(attemptRecord);
StorageModule.set(STORAGE_KEYS.attempts, attempts);
StorageModule.recordActivity(attempted);

if (accuracy >= 50 && quizState.chapter) {
userProgress[quizState.chapter] = { completed: true, pct: 100 };
saveToLocalStorage();
updateGlobalProgress();
}

showResultScreen(attemptRecord);
}

// ===== Test Mode UI =====
function renderTestQuiz() {
toggleFullScreenMode(true);
if (!quizState.timerInterval) {
quizState.timerInterval = setInterval(() => {
const now = Date.now();
const left = Math.max(0, Math.floor((quizState.testEndTimestamp - now) / 1000));
const timerEl = document.getElementById('test-timer-display');
if (timerEl) {
const mm = String(Math.floor(left / 60)).padStart(2, '0');
const ss = String(left % 60).padStart(2, '0');
timerEl.textContent = `${mm}:${ss}`;
if (left <= 60) timerEl.className = 'text-xs font-black px-3 py-1.5 rounded-xl bg-rose-500 text-white animate-pulse';
else if (left <= 300) timerEl.className = 'text-xs font-black px-3 py-1.5 rounded-xl bg-amber-500 text-white';
}
if (left <= 0) {
clearInterval(quizState.timerInterval);
quizState.timerInterval = null;
showToast('Time is up! Auto-submitting test...', 'warning');
submitTestQuiz(true);
}
}, 1000);
}

const q = quizState.questions[quizState.currentIndex];
if (!q) return;
const idx = quizState.currentIndex, total = quizState.questions.length;
const selected = quizState.userAnswers[idx], answered = selected !== undefined;
const isMarked = !!quizState.marked[idx];

const palette = quizState.questions.map((_, i) => {

const m = quizState.marked[i];

const html = `<div class="w-full h-full flex flex-col justify-between max-w-5xl mx-auto p-2 sm:p-4 relative"> <div class="mb-2 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3"> <div class="flex items-center gap-3"> <button type="button" onclick="confirmExitQuiz()" class="p-2 rounded-xl text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"><i class="fa-solid fa-arrow-left text-lg"></i></button> <div> <h2 class="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 leading-tight">${escapeHtml(quizState.title)}</h2> <p class="text-xs text-slate-500 dark:text-slate-400">Test Simulation Mode</p> </div> </div> <div class="flex items-center gap-3"> <div id="test-timer-display" class="text-xs font-black px-3 py-1.5 rounded-xl bg-teal-600 text-white">--:--</div> <button onclick="confirmSubmitTest()" class="px-4 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold shadow-sm transition">Submit Test</button> </div> </div> <div class="flex items-center gap-2 mb-3 px-1 py-1"> <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-2 px-1 scroll-smooth flex-1">${palette}</div> </div> <div class="flex-1 overflow-y-auto my-2 rounded-2xl border border-slate-200 bg-white p-4 sm:p-6 shadow-sm dark:border-slate-800 dark:bg-slate-900/50 flex flex-col justify-between"> <div> <div class="flex items-center justify-between"> <span class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400">Question ${idx + 1} of ${total} ${q.sourceChapter ? `(${escapeHtml(q.sourceChapter)})` : ''}</span> <button type="button" onclick="toggleMarkTestCurrent()" class="px-3 py-1 rounded-lg border ${isMarked ? 'border-amber-500 bg-amber-500/10 text-amber-600' : 'border-slate-200 dark:border-slate-700 text-slate-500'} text-xs font-bold transition"><i class="fa-solid fa-flag mr-1"></i> ${isMarked ? 'Marked for Review' : 'Mark for Review'}</button> </div> <p class="mt-3 text-base sm:text-lg font-bold leading-relaxed text-slate-900 dark:text-slate-100">${multiline(q.question)}</p> ${imageHtml} <div class="mt-5 space-y-3">${options}</div> </div> <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2"> <button type="button" onclick="jumpToTestQuestion(${Math.max(0, idx - 1)})" ${idx === 0 ? 'disabled' : ''} class="rounded-xl bg-slate-100 dark:bg-slate-800 px-4 py-2 text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-200 disabled:opacity-40">← Previous</button> <div class="flex items-center gap-2"> ${answered ? `<button type="button" onclick="clearTestResponse()" class="rounded-xl bg-slate-200 dark:bg-slate-800 px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300">Clear Response</button>` : ''} <button type="button" onclick="jumpToTestQuestion(${Math.min(total - 1, idx + 1)})" class="rounded-xl bg-teal-600 px-5 py-2 text-xs font-bold text-white hover:bg-teal-700 transition">Next →</button> </div> </div> </div> </div>`;
setModal('', '', html);
}

function selectTestOption(i) {

renderTestQuiz();
}
function clearTestResponse() {

}
function toggleMarkTestCurrent() {

function jumpToTestQuestion(i) {

function confirmSubmitTest() {
const total = quizState.questions.length;
let answered = Object.keys(quizState.userAnswers).length;

let timeLeftSec = Math.max(0, Math.floor((quizState.testEndTimestamp - Date.now()) / 1000));

`<div class="flex gap-2"> <button onclick="closeModal(); renderTestQuiz();" class="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-xs">Resume Test</button> <button onclick="submitTestQuiz(false)" class="px-5 py-2.5 rounded-xl bg-teal-600 text-white font-bold text-xs hover:bg-teal-700">Yes, Submit</button> </div>`
);
}

function submitTestQuiz(isAuto = false) {
if (quizState.timerInterval) { clearInterval(quizState.timerInterval); quizState.timerInterval = null; }

const settings = StorageModule.get(STORAGE_KEYS.settings, defaultSettings);
const total = quizState.questions.length;
let correct = 0, wrong = 0, skipped = 0;

quizState.questions.forEach((q, i) => {
const ans = quizState.userAnswers[i];
if (ans === undefined) skipped++;
else if (ans === q.correct) correct++;
else wrong++;
});

const attempted = correct + wrong;
const score = (correct * settings.marksCorrect) + (wrong * settings.marksWrong);
const maxScore = total * settings.marksCorrect;
const accuracy = attempted > 0 ? Math.round((correct / attempted) * 100) : 0;
const durationSec = Math.round(((Date.now() - (quizState.testEndTimestamp - (settings.minutesPerQuestion * total * 60 * 1000))) / 1000));

const attemptRecord = {
id: 'att_' + Date.now(),
chapter: quizState.chapter,
subject: quizState.subject,
mode: quizState.mode || 'test',
startedAt: Date.now() - (durationSec * 1000),
finishedAt: Date.now(),
durationSec: Math.max(1, durationSec),
limitSec: settings.minutesPerQuestion * total * 60,
total, attempted, correct, wrong, skipped,
score, maxScore, accuracy,
tabSwitches: quizState.tabSwitches || 0,
answers: quizState.questions.map((q, i) => ({
k: q.qKey,
sel: quizState.userAnswers[i] !== undefined ? quizState.userAnswers[i] : null,
ok: quizState.userAnswers[i] !== undefined ? (quizState.userAnswers[i] === q.correct) : null,
t: 0,
marked: !!quizState.marked[i]
}))
};

const attempts = StorageModule.get(STORAGE_KEYS.attempts, []);
attempts.unshift(attemptRecord);
StorageModule.set(STORAGE_KEYS.attempts, attempts);
StorageModule.recordActivity(attempted);

if (accuracy >= 50 && quizState.chapter) {
userProgress[quizState.chapter] = { completed: true, pct: 100 };
saveToLocalStorage();
updateGlobalProgress();
}

showResultScreen(attemptRecord);
}

{s:'Physics',src:'allen',id:'01CQR6uDEEU',t:'Aagaaz NEET 2026 – First Class (Physics)',th:'Aman Mathur Sir'},

];

}

  const q=norm(L.q);

    &&(L.f==='all'||(L.f==='watched'?st.watched[v.id]:L.f==='todo'?!st.watched[v.id]:st.bm[v.id])))
    .sort((a,b)=>idx(a)-idx(b));
}

<h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1 text-slate-900 dark:text-slate-100">Lecture Library</h2>
<p class="text-slate-500 dark:text-slate-400 text-xs sm:text-sm mt-1">Chapter-wise one-shots from ALLEN, Physics Wallah and Unacademy, embedded from YouTube. Progress, bookmarks, notes and resume are saved on this device.</p></div>
${lastV?`<div class="card p-4 flex items-center justify-between gap-3 cursor-pointer" onclick="lectOpen('${lastV.id}')"><div class="min-w-0"><div class="text-[10px] font-extrabold uppercase text-teal-600">Continue watching</div><div class="text-sm font-bold truncate text-slate-900 dark:text-slate-100">${escapeHtml(lastV.t)}</div>${st.time[lastV.id]?`<div class="text-[11px] text-slate-500">Resume at ${Math.floor(st.time[lastV.id]/60)}m ${Math.floor(st.time[lastV.id]%60)}s</div>`:''}</div><i class="fa-solid fa-circle-play text-2xl text-teal-600"></i></div>`:''}
<div class="flex flex-wrap items-center justify-between gap-3">
<div class="flex items-center gap-2">${['Biology','Chemistry','Physics'].map(s=>`<button onclick="lectSet('subj','${s}')" class="subject ${L.subj===s?'selected':''}"><b>${s}</b></button>`).join('')}</div>
<div class="controls flex items-center gap-3 w-full sm:w-auto"><input type="text" value="${escapeHtml(L.q)}" oninput="lectQ(this.value)" placeholder="Search lectures or teachers..." class="w-full sm:w-64">
<select onchange="lectF(this.value)">${[['all','All'],['todo','Not watched'],['watched','Watched'],['bm','Bookmarked']].map(o=>`<option value="${o[0]}" ${L.f===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div></div>
<div class="flex flex-wrap gap-2">${chips.map(c=>`<button onclick="lectSet('src','${c[0]}')" class="px-3 py-1.5 rounded-full text-xs font-bold border" style="${L.src===c[0]?`background:${c[3]};color:#fff;border-color:${c[3]}`:'border-color:var(--border-color);color:var(--text-muted)'}">${escapeHtml(c[1])} · ${c[2]}</button>`).join('')}</div>
<div class="text-xs font-bold text-slate-500">${L.subj}: ${w}/${sv.length} watched (${pct}%)</div>
<div id="lect-list"></div>
<details class="card p-4"><summary class="cursor-pointer text-sm font-extrabold text-slate-900 dark:text-slate-100">+ Add lectures / backup</summary>
<div class="mt-3 space-y-3 text-xs">
<p class="text-slate-500 dark:text-slate-400">Open a YouTube playlist, scroll to the bottom, run the console snippet, then paste the JSON here. Entries need a <code>videoId</code> (or a YouTube <code>url</code>) and a <code>title</code>.</p>
<div class="flex flex-wrap gap-2 controls"><select id="lect-isubj">${['Biology','Chemistry','Physics'].map(s=>`<option ${s===L.subj?'selected':''}>${s}</option>`).join('')}</select>
<select id="lect-isrc">${Object.keys(SRC).map(k=>`<option value="${k}">${SRC[k].n}</option>`).join('')}</select></div>
<textarea id="lect-ijson" rows="5" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs font-mono" placeholder='[{"title":"...","videoId":"..."}]'></textarea>
<div class="flex flex-wrap gap-2"><button onclick="lectImport()" class="px-4 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold">Import</button>
<button onclick="lectExport()" class="px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-200">Export backup</button>
<button onclick="lectReset()" class="px-4 py-2 rounded-xl bg-rose-100 dark:bg-rose-950/40 text-rose-700 dark:text-rose-300 font-bold">Reset library</button></div></div></details>
<p class="text-[11px] text-slate-400">Videos belong to their respective creators (ALLEN, Physics Wallah, Unacademy) and are embedded from YouTube. This is an unofficial study tool.</p>
</div>`;
  lectList();
}

// ---- player overlay ----
function ov(){
  let o=document.getElementById('lectOverlay');
  if(!o){
    o=document.createElement('div');o.id='lectOverlay';
    o.style.cssText='position:fixed;inset:0;z-index:110;display:none;background:rgba(2,6,23,.85);backdrop-filter:blur(4px);overflow-y:auto;padding:16px';
    o.innerHTML='<style>#lectOverlay iframe{width:100%;height:100%;border:0}</style><div id="lectBox" style="max-width:900px;margin:0 auto"></div>';
    document.body.appendChild(o);
  }
  return o;
}
function ytLoad(cb){
  if(window.YT&&window.YT.Player){cb();return;}
  ytQ.push(cb);
  if(document.getElementById('yt-api'))return;
  const s=document.createElement('script');s.id='yt-api';s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>ytQ.splice(0).forEach(f=>f(true));
  window.onYouTubeIframeAPIReady=()=>ytQ.splice(0).forEach(f=>f());
  document.head.appendChild(s);
}
function stopPlayer(){
  clearInterval(tm);tm=null;
  try{if(player){const t=player.getCurrentTime();if(t>5&&cur){st.time[cur]=t;save();}player.destroy();}}catch(e){}
  player=null;
}
function updBtns(id){
  const w=document.getElementById('lect-w'),b=document.getElementById('lect-b');
  if(w)w.innerHTML=st.watched[id]?'<i class="fa-solid fa-check mr-1"></i> Watched':'Mark as watched';
  if(b)b.className='px-3 py-2 rounded-xl text-xs font-bold '+(st.bm[id]?'bg-amber-500/15 text-amber-600':'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300');
}
function show(id){
  const v=vids.find(x=>x.id===id);if(!v)return;
  stopPlayer();cur=id;st.last=id;save();
  const o=ov();o.style.display='block';
  const list=ordered(),i=list.findIndex(x=>x.id===id),ch=chapOf(v),s=srcOf(v);
  const alts=ch?vids.filter(x=>x.id!==id&&x.s===v.s&&chapOf(x)===ch):[];
  const btn='px-3 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 disabled:opacity-40';
  document.getElementById('lectBox').innerHTML=`<div class="card p-4 sm:p-5 space-y-4">
<div class="flex items-start justify-between gap-3"><div class="min-w-0"><span class="text-[9px] font-extrabold uppercase px-2 py-0.5 rounded-full text-white" style="background:${s.c}">${escapeHtml(s.n)}</span>
<h3 class="font-black text-base mt-2 text-slate-900 dark:text-slate-100">${escapeHtml(v.t)}</h3>
<p class="text-xs text-slate-500 dark:text-slate-400">${escapeHtml(v.th||'')}${ch?' · '+escapeHtml(ch):''}</p></div>
<button onclick="lectClose()" class="p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-xmark text-lg"></i></button></div>
<div style="aspect-ratio:16/9" class="rounded-xl overflow-hidden bg-black"><div id="lect-player" style="width:100%;height:100%"></div></div>
<div class="flex flex-wrap items-center justify-between gap-2">
<button onclick="lectStep(-1)" class="${btn}" ${i<=0?'disabled':''}>← Prev</button>
<div class="flex gap-2"><button id="lect-w" onclick="lectWatch('${id}')" class="px-3 py-2 rounded-xl text-xs font-bold bg-teal-600 text-white"></button>
<button id="lect-b" onclick="lectBm('${id}',1)"><i class="fa-solid fa-star"></i></button></div>
<button onclick="lectStep(1)" class="${btn}" ${i<0||i>=list.length-1?'disabled':''}>Next →</button></div>
${alts.length?`<div><p class="text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">Other versions of this chapter</p><div class="flex flex-wrap gap-2">${alts.map(a=>`<button onclick="lectOpen('${a.id}')" class="px-3 py-1.5 rounded-full text-[11px] font-bold text-white" style="background:${srcOf(a).c}">${escapeHtml(srcOf(a).n)}${a.th?' · '+escapeHtml(a.th):''}</button>`).join('')}</div></div>`:''}
<div><label class="text-xs font-bold text-slate-700 dark:text-slate-300">My notes</label>
<textarea oninput="lectNote('${id}',this.value)" rows="3" class="w-full mt-1.5 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" placeholder="Write key points...">${escapeHtml(st.notes[id]||'')}</textarea></div>
<p class="text-[10px] text-slate-400">Shortcuts: N next · P previous · W watched · Esc close</p></div>`;
  updBtns(id);
  ytLoad(fail=>{
    const host=document.getElementById('lect-player');if(!host||cur!==id)return;
    if(fail===true||!(window.YT&&window.YT.Player)){
      host.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;return;
    }
    player=new YT.Player('lect-player',{videoId:id,width:'100%',height:'100%',
      playerVars:{rel:0,modestbranding:1,start:Math.floor(st.time[id]||0)},
      events:{onStateChange:e=>{if(e.data===0){st.watched[id]=true;st.time[id]=0;save();updBtns(id);showToast('Marked as watched');}}}});
    tm=setInterval(()=>{try{const t=player.getCurrentTime();if(t>5){st.time[id]=t;save();}}catch(e){}},5000);
  });
}
function close(){
  stopPlayer();
  const o=document.getElementById('lectOverlay');
  if(o){o.style.display='none';document.getElementById('lectBox').innerHTML='';}
  cur=null;
  if(currentTab==='lectures')renderLect();
}

// ---- handlers exposed to inline onclick ----
window.lectOpen=show;
window.lectClose=close;
window.lectSet=(k,v)=>{L[k]=v;renderLect();};
window.lectQ=v=>{L.q=v;lectList();};
window.lectF=v=>{L.f=v;lectList();};
window.lectStep=d=>{const l=ordered(),i=l.findIndex(x=>x.id===cur);if(l[i+d])show(l[i+d].id);};
window.lectWatch=id=>{st.watched[id]=!st.watched[id];save();updBtns(id);};
window.lectBm=(id,inPlayer)=>{st.bm[id]=!st.bm[id];save();showToast(st.bm[id]?'Lecture bookmarked':'Bookmark removed');if(inPlayer)updBtns(id);else lectList();};
window.lectNote=(id,v)=>{st.notes[id]=v;save();};
window.lectExport=()=>{
  const b=new Blob([JSON.stringify({videos:vids,state:st},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='edupulse-lectures-backup.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
window.lectReset=()=>{
  if(!confirm('Reset the lecture library to defaults? Your watched marks and notes are kept.'))return;
  vids=SEED.slice();saveV();renderLect();showToast('Lecture library reset');
};
window.lectImport=()=>{
  const parseId=x=>{x=String(x||'');const m=x.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(x)?x:'');};
  let arr;
  try{arr=JSON.parse(document.getElementById('lect-ijson').value);}catch(e){showToast('Invalid JSON','error');return;}
  if(!Array.isArray(arr))arr=Array.isArray(arr&&arr.videos)?arr.videos:[];
  const subj=document.getElementById('lect-isubj').value,src=document.getElementById('lect-isrc').value;
  let added=0;
  arr.forEach(o=>{
    if(!o)return;
    const id=parseId(o.videoId||o.id||o.url);
    if(!id||vids.some(x=>x.id===id))return;
    const s=data[o.s]?o.s:subj;
    vids.push({s,src:o.src||src,id,t:String(o.title||o.t||'Untitled').slice(0,200),th:String(o.teacher||o.th||'').slice(0,60),c:typeof o.chapter==='string'?o.chapter:(o.c||'')});
    added++;
  });
  saveV();
  showToast(added?`${added} lecture${added>1?'s':''} added`:'No new videos found',added?'success':'warning');
  if(added){L.subj=subj;renderLect();}
};
document.addEventListener('keydown',e=>{
  const o=document.getElementById('lectOverlay');
  if(!o||o.style.display!=='block')return;
  const k=e.key.toLowerCase();
  if(k==='escape'){close();return;}
  if(['TEXTAREA','INPUT'].includes(e.target.tagName))return;
  if(k==='n')lectStep(1);else if(k==='p')lectStep(-1);else if(k==='w')lectWatch(cur);
});
})();
</script>

</body>
  </html>

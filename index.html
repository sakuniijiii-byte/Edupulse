.goal strong{display:block;margin-top:4px;font-size:13px;color:var(--text-primary)}
.bar{height:6px;background:rgba(0,0,0,0.1);border-radius:99px;margin-top:8px;overflow:hidden}
body.dark .bar{background:rgba(255,255,255,0.15)}
.bar i{display:block;height:100%;background:var(--teal);transition:width 0.5s ease}
.goal p{font-size:11px;color:var(--text-muted);margin-top:6px}
.topbar{height:70px;border-bottom:1px solid var(--border-color);background:var(--paper);backdrop-filter:blur(16px);display:flex;align-items:center;justify-between;padding:0 24px;position:sticky;top:0;z-index:10}
.date{color:var(--text-muted);font-size:11px;font-weight:600}
.topbar h1{font-size:18px;margin:2px 0 0;color:var(--text-primary);font-weight:800}
.main{max-width:1400px;margin:auto;padding:24px}
.tag{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.17em;font-size:11px}
.card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,0.03);transition:all 0.2s ease-in-out}

.subject{padding:14px 16px;border:1px solid var(--border-color);border-radius:16px;background:var(--card-bg);display:flex;align-items:center;justify-between;text-align:left;transition:all 0.2s}
.subject.selected{border-color:var(--teal);background:rgba(16,155,141,0.08)}
.subject b{display:block;color:var(--text-primary);font-size:14px}
.subject small{display:block;color:var(--text-muted);margin-top:2px;font-size:12px}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}
.bio{background:var(--bio-bg);color:var(--bio-text)}
.chem{background:var(--chem-bg);color:var(--chem-text)}
.phy{background:var(--phy-bg);color:var(--phy-text)}
.chapter{padding:18px;transition:transform 0.2s, box-shadow 0.2s;display:flex;flex-direction:column;justify-between}

.chapter-title{font-weight:800;font-size:14px;margin-top:14px;color:var(--text-primary);line-height:1.4}
.meta{display:flex;justify-between;color:var(--text-muted);font-size:11px;margin-top:12px}

body.dark .progress{background:rgba(255,255,255,0.1)}
.progress i{display:block;height:100%;background:var(--teal);transition:width 0.4s ease}
.practice{margin-top:14px;color:var(--teal);font-weight:800;background:none;padding:0;display:inline-flex;align-items:center;gap:4px;font-size:13px}

@keyframes pulseGlow {

.animate-lock-bounce {

function escapeHtml(value = '') {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function normalizeQuestion(option) {
    return String(option).trim();
}

function selectOptionTemp(optionValue) {
    const currentIdx = quizState.currentIndex;
    if (quizState.userAnswers[currentIdx] !== undefined) return; // Answer already locked
    quizState.userAnswers[currentIdx] = optionValue;
    delete quizState.skippedQuestions[currentIdx]; // Remove from skipped state if answered
    
    // Check correctness for live score tracking
    const currentQuestion = quizState.questions[currentIdx];
    if (normalizeQuestion(optionValue) === normalizeQuestion(currentQuestion.answer)) {
        quizState.score += 1;
    }

    renderLivingWorldQuiz();
}

function togglePaletteExpanded(forceState) {
    quizState.paletteExpanded = forceState !== undefined ? forceState : !quizState.paletteExpanded;
    renderLivingWorldQuiz();
}

function skipQuestion() {
    const currentIdx = quizState.currentIndex;
    // Only mark skipped if not already answered
    if (quizState.userAnswers[currentIdx] === undefined) {
        quizState.skippedQuestions[currentIdx] = true;
    }
    goToNextLivingWorldQuestion();
}

function jumpToQuestion(index) {
    if (index >= 0 && index < quizState.questions.length) {
        quizState.currentIndex = index;
        renderLivingWorldQuiz();
    }
}

function toggleFullScreenMode(enable) {
    const modal = document.getElementById('appModal');
    if (!modal) return;
    if (enable) {
        modal.classList.add('fullscreen-modal');
    } else {
        modal.classList.remove('fullscreen-modal');
    }
}

function setTimerPreset(minutes, mode = 'work') {
    pauseTimer();
    timerMode = mode;
    timerInitialSeconds = minutes * 60;
    timerSeconds = timerInitialSeconds;
    saveToLocalStorage();
    updateTimerDisplay();
}

function startTimer() {
    if (timerInterval) return;
    const timerCard = document.getElementById('timerCard');
    if (timerCard) timerCard.classList.add('border-teal-500', 'ring-2', 'ring-teal-500/20');

    timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
        } else {
            clearInterval(timerInterval);
            timerInterval = null;
            if (timerMode === 'work') {
                timerSessionCount++;
                saveToLocalStorage();
                showModal("Focus Block Complete! 🎉", "Great job! You completed a study block. Take a 5-minute break now.");
                setTimerPreset(5, 'break');
            } else {
                showModal("Break Over! ⚡", "Ready for another session? Choose your focus duration and start.");
                setTimerPreset(25, 'work');
            }
            renderView();
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
    const timerCard = document.getElementById('timerCard');
    if (timerCard) timerCard.classList.remove('border-teal-500', 'ring-2', 'ring-teal-500/20');
}

function resetTimer() {
    pauseTimer();
    timerSeconds = timerInitialSeconds;
    updateTimerDisplay();
}

function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    const progressEl = document.getElementById('timerProgressBar');
    if (!el) return;
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;

    if (progressEl && timerInitialSeconds > 0) {
        const pct = Math.round(((timerInitialSeconds - timerSeconds) / timerInitialSeconds) * 100);
        progressEl.style.width = `${pct}%`;
    }
}

                ${TEACHERS_DATA.map(fac => `
                    <div onclick="openFacultyPlaylist('${fac.id}')" class="card p-4 flex flex-col justify-between text-center items-center h-full hover:border-teal-500/50 hover:shadow-md transition cursor-pointer group">
                        <div class="w-full flex flex-col items-center">
                            <img src="${fac.img}" alt="${fac.name}" class="w-20 h-20 rounded-2xl object-cover border border-slate-200 dark:border-slate-700 shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/200x200/0f172a/ffffff?text=${encodeURIComponent(fac.name)}';">
                            <h4 class="font-bold text-xs sm:text-sm mt-1.5 text-slate-800 dark:text-slate-100 line-clamp-1">${fac.name}</h4>
                            <p class="text-[10px] font-bold text-teal-600 dark:text-teal-400 mt-2 flex items-center gap-1"><i class="fa-solid fa-play text-[9px]"></i> View Playlist</p>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;
    } else if (currentTab === 'tools') {
        const activeTodos = todos.filter(t => !t.completed);
        const completedTodos = todos.filter(t => t.completed);

        container.innerHTML = `
            <div>
                <div class="tag">✦ Productivity & Study Suite</div>
                <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-1 text-slate-900 dark:text-slate-100">Focus Timer & Daily Planner</h2>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-6">
                <!-- Enhanced Focus Timer Card -->
                <div class="card p-6 flex flex-col justify-between transition-all" id="timerCard">
                    <div>
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-teal-600 dark:text-teal-400 flex items-center gap-1.5">
                                <i class="fa-solid fa-circle-dot text-[10px] ${timerInterval ? 'animate-ping text-teal-500' : 'text-slate-400'}"></i>
                                ${timerMode === 'work' ? 'Focus Session' : 'Rest Break'}
                            </span>
                            <span class="px-2.5 py-1 rounded-full bg-teal-50 dark:bg-teal-950/60 border border-teal-200 dark:border-teal-800 text-[10px] font-black text-teal-700 dark:text-teal-300">
                                🎯 ${timerSessionCount} Blocks Done
                            </span>
                        </div>

                        <!-- Presets -->
                        <div class="flex items-center justify-center gap-1.5 my-4">
                            <button onclick="setTimerPreset(15)" class="px-2.5 py-1 rounded-lg text-xs font-bold ${timerInitialSeconds === 900 ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} hover:bg-teal-500 hover:text-white transition">15m</button>
                            <button onclick="setTimerPreset(25)" class="px-2.5 py-1 rounded-lg text-xs font-bold ${timerInitialSeconds === 1500 ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} hover:bg-teal-500 hover:text-white transition">25m</button>
                            <button onclick="setTimerPreset(45)" class="px-2.5 py-1 rounded-lg text-xs font-bold ${timerInitialSeconds === 2700 ? 'bg-teal-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} hover:bg-teal-500 hover:text-white transition">45m</button>
                            <button onclick="setTimerPreset(5, 'break')" class="px-2.5 py-1 rounded-lg text-xs font-bold ${timerInitialSeconds === 300 ? 'bg-amber-500 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'} hover:bg-amber-500 hover:text-white transition">5m Break</button>
                        </div>

                        <div class="text-5xl sm:text-6xl font-black my-4 text-center tracking-wider text-slate-900 dark:text-slate-100 font-mono" id="timerDisplay">
                            ${Math.floor(timerSeconds / 60).toString().padStart(2, '0')}:${(timerSeconds % 60).toString().padStart(2, '0')}
                        </div>

                        <!-- Progress Bar -->
                        <div class="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden mb-6">
                            <div id="timerProgressBar" class="bg-teal-500 h-full transition-all duration-300" style="width: ${Math.round(((timerInitialSeconds - timerSeconds) / timerInitialSeconds) * 100)}%"></div>
                        </div>
                    </div>

                    <div class="flex justify-center gap-2">
                        <button onclick="startTimer()" class="flex-1 py-2.5 bg-teal-600 text-white rounded-xl font-bold hover:bg-teal-700 text-xs transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-play text-[10px]"></i> Start</button>
                        <button onclick="pauseTimer()" class="flex-1 py-2.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl font-bold text-xs hover:bg-slate-300 dark:hover:bg-slate-600 transition flex items-center justify-center gap-1.5"><i class="fa-solid fa-pause text-[10px]"></i> Pause</button>
                        <button onclick="resetTimer()" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-xl font-bold text-xs hover:bg-slate-200 dark:hover:bg-slate-700 transition"><i class="fa-solid fa-rotate-left"></i></button>
                    </div>
                </div>

                <!-- Integrated To-Do Planner -->
                <div class="lg:col-span-2 card p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                <i class="fa-solid fa-square-check text-teal-600 dark:text-teal-400"></i> Daily Study Planner
                            </h3>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-slate-500 dark:text-slate-400">${activeTodos.length} Pending</span>
                                ${completedTodos.length > 0 ? `<button onclick="clearCompletedTodos()" class="text-[11px] font-bold text-rose-500 hover:underline">Clear Done</button>` : ''}
                            </div>
                        </div>

                        <!-- Add Task Form -->
                        <form onsubmit="addTodo(event)" class="flex flex-wrap sm:flex-nowrap gap-2 mb-4">
                            <input type="text" id="todoInput" placeholder="Add new task (e.g., Solve 50 Physics MCQs)..." class="flex-1 px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 focus:border-teal-500 focus:outline-none text-xs font-medium">
                            <select id="todoSubjectSelect" class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-semibold focus:outline-none">
                                <option value="Biology">Biology</option>
                                <option value="Chemistry">Chemistry</option>
                                <option value="Physics">Physics</option>
                                <option value="General">General</option>
                            </select>
                            <select id="todoPrioritySelect" class="px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 text-xs font-semibold focus:outline-none">
                                <option value="high">🔴 High</option>
                                <option value="medium" selected>🟡 Med</option>
                                <option value="low">🟢 Low</option>
                            </select>
                            <button type="submit" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold text-xs transition shrink-0">+ Add</button>
                        </form>

                        <!-- Task List -->
                        <div class="space-y-2 max-h-56 overflow-y-auto pr-1">
                            ${todos.length === 0 ? `<p class="text-xs text-center text-slate-400 py-6">No tasks added yet. Plan your NEET targets above!</p>` : ''}
                            ${todos.map(t => {
                                const tagBg = t.subject === 'Biology' ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/60 dark:text-emerald-300' :
                                              t.subject === 'Chemistry' ? 'bg-purple-100 text-purple-800 dark:bg-purple-950/60 dark:text-purple-300' :
                                              t.subject === 'Physics' ? 'bg-teal-100 text-teal-800 dark:bg-teal-950/60 dark:text-teal-300' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300';
                                
                                const prioBorder = t.priority === 'high' ? 'border-l-4 border-l-rose-500' : t.priority === 'medium' ? 'border-l-4 border-l-amber-500' : 'border-l-4 border-l-emerald-500';

                                return `
                                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/70 ${prioBorder} transition">
                                        <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
                                            <button onclick="toggleTodo('${t.id}')" class="w-5 h-5 rounded-md border border-slate-300 dark:border-slate-600 flex items-center justify-center shrink-0 ${t.completed ? 'bg-teal-600 border-teal-600 text-white' : 'bg-white dark:bg-slate-700'}">
                                                ${t.completed ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                                            </button>
                                            <span class="text-xs font-semibold text-slate-800 dark:text-slate-200 truncate ${t.completed ? 'line-through opacity-50' : ''}">${escapeHtml(t.title)}</span>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <span class="px-2 py-0.5 rounded-md text-[9px] font-bold ${tagBg}">${t.subject}</span>
                                            <button onclick="deleteTodo('${t.id}')" class="text-slate-400 hover:text-rose-500 p-1 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Scratchpad Area -->
            <div class="card p-6 mt-6">
                <h3 class="text-lg font-bold mb-2 text-slate-900 dark:text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-teal-600 dark:text-teal-400"></i> Quick Scratchpad & Weak Notes
                </h3>
                <textarea id="scratchpadArea" oninput="saveScratchpad(this.value)" placeholder="Type key formulas, weak topics, or daily targets (auto-saved to Local Storage)..." class="w-full h-32 p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-teal-500 text-xs">${userNotes}</textarea>
            </div>
        `;
    }
}

function setSubject(s) { subject = s; renderView(); }

function renderChapters() {
    const searchInput = document.getElementById('search');
    if (searchInput) searchQuery = searchInput.value;
    const filterSelect = document.getElementById('statusFilter');
    if (filterSelect) filterStatus = filterSelect.value;

    let list = data[subject].filter(x => x.toLowerCase().includes(searchQuery.toLowerCase()));

    if (filterStatus === 'completed') {
        list = list.filter(x => userProgress[x] && userProgress[x].completed);
    } else if (filterStatus === 'pending') {
        list = list.filter(x => !userProgress[x] || !userProgress[x].completed);
    }

    const titleEl = document.getElementById('subject-title');
    const countEl = document.getElementById('count');
    const chaptersEl = document.getElementById('chapters');

    if (titleEl) titleEl.textContent = subject + ' chapters';
    if (countEl) countEl.textContent = list.length + ' chapters · chapter-wise practice';

    if (chaptersEl) {
        chaptersEl.innerHTML = list.map((x) => {
            const isDone = userProgress[x] && userProgress[x].completed;
            const prog = isDone ? 100 : 0;
            const chipClass = subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy';
            const chipText = subject === 'Chemistry' ? 'CHEM' : subject.slice(0, 3).toUpperCase();
            return `
                <article class="card chapter relative cursor-pointer" onclick="handleChapterClick('${x.replace(/'/g, "\\'")}')">
                    <div>
                        <div class="flex justify-between items-start gap-2">
                            <span class="chip ${chipClass}">${chipText}</span>
                            ${isDone ? '<span class="bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Completed</span>' : '<span class="bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Pending</span>'}
                        </div>
                        <div class="chapter-title">${x}</div>
                    </div>
                    <div>
                        <div class="meta"><span>Progress</span><b>${prog}%</b></div>
                        <div class="progress"><i style="width:${prog}%"></i></div>
                        <button class="practice" onclick="event.stopPropagation(); handleChapterClick('${x.replace(/'/g, "\\'")}')">Open chapter (180 MCQs) →</button>
                    </div>
                </article>
            `;
        }).join('');
    }
}

function updateGlobalProgress() {
    const totalChapters = 79;
    const completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
    const pct = Math.round((completedCount / totalChapters) * 100);
    const bar = document.getElementById('sidebar-progress-bar');
    const txt = document.getElementById('sidebar-progress-text');
    if (bar) bar.style.width = pct + '%';
    if (txt) txt.textContent = pct + '% syllabus covered';
}

renderView();
</script>
</body>
</html>

    const CATEGORIES = ['All', 'JEE & NEET', 'Free Books', 'AI & Study', 'Coding & Tech', 'Productivity', 'Fun & Media', 'Bookmarks'];
    const SUBTAGS = ['All', 'Batches', 'Tests', 'Books', 'PYQs', 'AI', 'Fun'];

    const THEMES = [
      { id: 'sapphire', name: 'Sapphire (Dark)', icon: 'fa-gem', mode: 'dark' },
      { id: 'cyberpunk', name: 'Cyberpunk (Dark)', icon: 'fa-bolt-lightning', mode: 'dark' },
      { id: 'emerald', name: 'Emerald (Dark)', icon: 'fa-leaf', mode: 'dark' },
      { id: 'dracula', name: 'Dracula (Dark)', icon: 'fa-skull', mode: 'dark' },
      { id: 'sunset', name: 'Sunset (Dark)', icon: 'fa-sun', mode: 'dark' },
      { id: 'light', name: 'Porcelain (Light)', icon: 'fa-sun', mode: 'light' },
      { id: 'lavender', name: 'Lavender (Light)', icon: 'fa-wand-magic', mode: 'light' }
    ];

    const playSound = (type = 'click', isMuted = false) => {
      if (isMuted) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(750, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        } else if (type === 'spin') {
          osc.frequency.setValueAtTime(300 + Math.random() * 300, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
          osc.start();
          osc.stop(ctx.currentTime + 0.03);
        }
      } catch (e) {
        // Audio context fallback
      }
    };

    function App() {
      // Theme & Appearance State
      const [currentTheme, setCurrentTheme] = useState(() => localStorage.getItem('edupulse_theme_v3') || 'sapphire');
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const th = localStorage.getItem('edupulse_theme_v3') || 'sapphire';
        return th !== 'light' && th !== 'lavender';
      });
      const [viewMode, setViewMode] = useState(() => localStorage.getItem('edupulse_view') || 'grid'); // 'grid' | 'list'
      const [isMuted, setIsMuted] = useState(false);

      // Data Persistence State
      const [resources, setResources] = useState(() => {
        const saved = localStorage.getItem('edupulse_custom_resources_v3');
        return saved ? [...INITIAL_RESOURCES, ...JSON.parse(saved)] : INITIAL_RESOURCES;
      });
      const [bookmarks, setBookmarks] = useState(() => {
        const saved = localStorage.getItem('edupulse_bookmarks_v3');
        return saved ? JSON.parse(saved) : ['sp1', 'jn1', 'jn3', '26', 'rd1', 'cd3'];
      });
      const [scratchpadText, setScratchpadText] = useState(() => localStorage.getItem('edupulse_notes') || '');

      // Filtering State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedSubtag, setSelectedSubtag] = useState('All');
      const [sortBy, setSortBy] = useState('default');

      // Modal Controls
      const [isCmdKOpen, setIsCmdKOpen] = useState(false);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isSpinModalOpen, setIsSpinModalOpen] = useState(false);
      const [isImportExportOpen, setIsImportExportOpen] = useState(false);
      const [isPomodoroOpen, setIsPomodoroOpen] = useState(false);
      const [isScratchpadOpen, setIsScratchpadOpen] = useState(false);
      const [previewResource, setPreviewResource] = useState(null);
      const [toasts, setToasts] = useState([]);

      // Pomodoro State
      const [pomoTime, setPomoTime] = useState(25 * 60);
      const [pomoRunning, setPomoRunning] = useState(false);
      const [pomoMode, setPomoMode] = useState('work'); // 'work' | 'break'

      // Toast Helper
      const addToast = (message, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message, type }]);
        playSound(type === 'success' ? 'success' : 'click', isMuted);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3000);
      };

      useEffect(() => {
        const html = document.documentElement;
        html.className = `theme-${currentTheme}`;
        if (currentTheme === 'light' || currentTheme === 'lavender') {
          html.classList.remove('dark');
          setIsDarkMode(false);
        } else {
          html.classList.add('dark');
          setIsDarkMode(true);
        }
        localStorage.setItem('edupulse_theme_v3', currentTheme);
      }, [currentTheme]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
            e.preventDefault();
            setIsCmdKOpen(prev => !prev);
            playSound('click', isMuted);
          } else if (e.key === 'Escape') {
            setIsCmdKOpen(false);
            setIsAddModalOpen(false);
            setIsSpinModalOpen(false);
            setIsImportExportOpen(false);
            setIsScratchpadOpen(false);
            setPreviewResource(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isMuted]);

      useEffect(() => {
        let interval = null;
        if (pomoRunning && pomoTime > 0) {
          interval = setInterval(() => setPomoTime(prev => prev - 1), 1000);
        } else if (pomoTime === 0) {
          addToast(pomoMode === 'work' ? 'Study session completed! Take a 5 min break.' : 'Break ended! Back to study session.', 'success');
          if (pomoMode === 'work') {
            setPomoMode('break');
            setPomoTime(5 * 60);
          } else {
            setPomoMode('work');
            setPomoTime(25 * 60);
          }
          setPomoRunning(false);
        }
        return () => clearInterval(interval);
      }, [pomoRunning, pomoTime, pomoMode]);

      // Bookmark Toggle Handler
      const toggleBookmark = (id) => {
        setBookmarks(prev => {
          const updated = prev.includes(id) ? prev.filter(bId => bId !== id) : [...prev, id];
          localStorage.setItem('edupulse_bookmarks_v3', JSON.stringify(updated));
          addToast(prev.includes(id) ? 'Removed from saved bookmarks' : 'Added to saved bookmarks!', 'success');
          return updated;
        });
      };

      // Direct Theme Toggle (Dark vs Light)
      const toggleDarkLight = () => {
        if (isDarkMode) {
          setCurrentTheme('light');
        } else {
          setCurrentTheme('sapphire');
        }
        playSound('click', isMuted);
      };

      // Notes Save Handler
      const saveScratchpad = (text) => {
        setScratchpadText(text);
        localStorage.setItem('edupulse_notes', text);
      };

      const filteredResources = useMemo(() => {
        return resources.filter(res => {
          // Category filter
          if (selectedCategory === 'Bookmarks') {
            if (!bookmarks.includes(res.id)) return false;
          } else if (selectedCategory !== 'All' && res.category !== selectedCategory) {
            return false;
          }

          // Subtag filter
          if (selectedSubtag !== 'All' && res.subtag !== selectedSubtag) {
            return false;
          }

          // Search query
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matchTitle = res.title.toLowerCase().includes(q);
            const matchDesc = res.description.toLowerCase().includes(q);
            const matchCat = res.category.toLowerCase().includes(q);
            const matchBadge = res.badge && res.badge.toLowerCase().includes(q);
            const matchSubtag = res.subtag && res.subtag.toLowerCase().includes(q);
            return matchTitle || matchDesc || matchCat || matchBadge || matchSubtag;
          }

          return true;
        }).sort((a, b) => {
          if (sortBy === 'rating') return b.rating - a.rating;
          if (sortBy === 'name') return a.title.localeCompare(b.title);
          if (sortBy === 'category') return a.category.localeCompare(b.category);
          return 0;
        });
      }, [resources, bookmarks, selectedCategory, selectedSubtag, searchQuery, sortBy]);

      const featuredPicks = useMemo(() => resources.filter(r => r.featured), [resources]);

      return (
        <div className="min-h-screen flex flex-col relative transition-colors duration-300 app-bg app-text-main">
          
          {/* TOAST NOTIFICATIONS */}
          <div className="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none">
            {toasts.map(t => (
              <div 
                key={t.id} 
                className="pointer-events-auto px-4 py-3 rounded-2xl shadow-2xl border border-indigo-500/30 app-card backdrop-blur-md flex items-center gap-3 animate-scale-up text-xs font-semibold"
              >
                <i className={`fas ${t.type === 'success' ? 'fa-circle-check text-emerald-500' : 'fa-circle-info text-indigo-500'}`}></i>
                <span>{t.message}</span>
              </div>
            ))}
          </div>

          {/* HEADER NAV BAR */}
          <header className="sticky top-0 z-40 backdrop-blur-xl border-b app-header transition-all shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4">
              
              {/* Brand Logo */}
              <div 
                className="flex items-center gap-3 cursor-pointer group" 
                onClick={() => { setSelectedCategory('All'); setSelectedSubtag('All'); setSearchQuery(''); playSound('click', isMuted); }}
              >
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
                  <i className="fas fa-bolt text-white text-xl animate-pulse"></i>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-display font-extrabold text-xl tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
                      EduPulse
                    </span>
                    <span className="px-2 py-0.5 text-[10px] font-extrabold tracking-wider rounded-full app-badge uppercase">
                      PRO 3.0
                    </span>
                  </div>
                  <p className="text-[11px] app-text-sub font-medium">Verified JEE, NEET & Tech Portal</p>
                </div>
              </div>

              {/* Action Toolbar */}
              <div className="flex items-center gap-2 sm:gap-3">
                
                {/* Search Bar Shortcut */}
                <button 
                  onClick={() => { setIsCmdKOpen(true); playSound('click', isMuted); }}
                  className="hidden md:flex items-center gap-3 px-4 py-2 rounded-xl app-card text-xs font-medium hover:border-indigo-500/50 transition-all"
                >
                  <i className="fas fa-magnifying-glass text-slate-400"></i>
                  <span className="app-text-sub">Search 56+ links...</span>
                  <kbd className="px-2 py-0.5 text-[10px] font-bold app-badge rounded-md">⌘K</kbd>
                </button>

                {/* Dark / Light Quick Switcher */}
                <button
                  onClick={toggleDarkLight}
                  title={isDarkMode ? "Switch to Light Mode" : "Switch to Dark Mode"}

                  <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'}`}></i>

              className="p-2 rounded-lg app-card hover:border-indigo-500/50 text-xs app-text-sub hover:text-indigo-500 transition-colors"
              title="Quick Info"
            >
              <i className="fas fa-circle-info"></i>
            </button>
            
            <button 
              onClick={(e) => {
                e.stopPropagation();
                window.open(res.url, '_blank', 'noopener,noreferrer');
              }}
              className="px-3.5 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition-all flex items-center gap-1.5 shadow-md shadow-indigo-600/20"
            >
              <span>Launch</span>
              <i className="fas fa-arrow-up-right-from-square text-[10px]"></i>
            </button>
          </div>
        </div>
      );
    }

    function ResourceListItem({ res, isBookmarked, onToggleBookmark, onPreview }) {
      const handleItemClick = () => {
        window.open(res.url, '_blank', 'noopener,noreferrer');
      };

      return (
        <div 
          onClick={handleItemClick}
          className="app-card border rounded-xl p-3 flex items-center justify-between gap-4 hover:border-indigo-500/50 transition-all cursor-pointer select-none group"
        >
          <div className="flex items-center gap-3 truncate">
            <div className="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-500 border flex items-center justify-center text-xs shrink-0 group-hover:scale-105 transition-transform">
              <i className={`fas ${res.icon && res.icon.startsWith('fa-') ? res.icon : 'fa-globe'}`}></i>
            </div>
            <div className="truncate">
              <div className="flex items-center gap-2">
                <h4 className="font-bold text-xs truncate group-hover:text-indigo-500 transition-colors">{res.title}</h4>
                <span className="px-1.5 py-0.2 rounded text-[9px] font-bold app-badge">
                  {res.badge || res.category}
                </span>
              </div>
              <p className="app-text-sub text-[11px] truncate">{res.description}</p>
            </div>
          </div>

          <div className="flex items-center gap-2 shrink-0">
            <button 
              onClick={(e) => { e.stopPropagation(); onToggleBookmark(); }} 
              className={`p-1.5 rounded-lg text-xs ${isBookmarked ? 'text-pink-500' : 'app-text-sub hover:text-pink-500'}`}
              title={isBookmarked ? "Remove Bookmark" : "Save Bookmark"}
            >
              <i className="fas fa-heart"></i>
            </button>
            <button 
              onClick={(e) => { e.stopPropagation(); onPreview(); }} 
              className="p-1.5 rounded-lg text-xs app-text-sub hover:text-indigo-500"
              title="Quick Info"
            >
              <i className="fas fa-circle-info"></i>
            </button>
            <button 
              onClick={(e) => { e.stopPropagation(); window.open(res.url, '_blank', 'noopener,noreferrer'); }} 
              className="px-3 py-1 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold transition-all"
            >
              Launch
            </button>
          </div>
        </div>
      );
    }

    function HeroCanvas({ theme, isDarkMode }) {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = 300;
        };
        resize();
        window.addEventListener('resize', resize);

        const particles = Array.from({ length: 35 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 2 + 1,
          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,
          alpha: Math.random() * 0.4 + 0.1
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          particles.forEach(p => {
            p.x += p.dx;
            p.y += p.dy;
            if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.dy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = isDarkMode ? `rgba(129, 140, 248, ${p.alpha})` : `rgba(79, 70, 229, ${p.alpha})`;
            ctx.fill();
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationFrameId);
        };
      }, [theme, isDarkMode]);

      return <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-[300px] pointer-events-none opacity-25 z-0" />;
    }

    function AddResourceModal({ onClose, onAdd }) {
      const [title, setTitle] = useState('');
      const [url, setUrl] = useState('');
      const [category, setCategory] = useState('JEE & NEET');
      const [badge, setBadge] = useState('Custom');
      const [description, setDescription] = useState('');
      const [subtag, setSubtag] = useState('Batches');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title || !url) return;
        const newRes = {
          id: Date.now().toString(),
          title,
          url,
          category,
          badge,
          description: description || 'User saved educational portal link.',
          rating: 5.0,
          featured: false,
          icon: 'fa-globe',
          subtag
        };
        onAdd(newRes);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="app-card border rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 animate-scale-up">
            <div className="flex items-center justify-between">
              <h3 className="text-base font-bold">Add Custom Site Link</h3>
              <button onClick={onClose} className="app-text-sub hover:text-indigo-500"><i className="fas fa-xmark"></i></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block app-text-sub font-bold mb-1">Site Title *</label>
                <input type="text" required value={title} onChange={e=>setTitle(e.target.value)} className="w-full app-input border rounded-xl p-2.5" placeholder="e.g. Physics Wallah Vault" />
              </div>
              <div>
                <label className="block app-text-sub font-bold mb-1">URL *</label>
                <input type="url" required value={url} onChange={e=>setUrl(e.target.value)} className="w-full app-input border rounded-xl p-2.5" placeholder="https://..." />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block app-text-sub font-bold mb-1">Category</label>
                  <select value={category} onChange={e=>setCategory(e.target.value)} className="w-full app-input border rounded-xl p-2.5">
                    {CATEGORIES.filter(c => c !== 'All' && c !== 'Bookmarks').map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="block app-text-sub font-bold mb-1">Subtag</label>
                  <select value={subtag} onChange={e=>setSubtag(e.target.value)} className="w-full app-input border rounded-xl p-2.5">
                    {SUBTAGS.filter(s => s !== 'All').map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="block app-text-sub font-bold mb-1">Badge Tag</label>
                <input type="text" value={badge} onChange={e=>setBadge(e.target.value)} className="w-full app-input border rounded-xl p-2.5" placeholder="e.g. Free Modules" />
              </div>
              <div>
                <label className="block app-text-sub font-bold mb-1">Description</label>
                <textarea rows="2" value={description} onChange={e=>setDescription(e.target.value)} className="w-full app-input border rounded-xl p-2.5" placeholder="Brief summary..."></textarea>
              </div>
              <button type="submit" className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg mt-2">
                Save Site
              </button>
            </form>
          </div>
        </div>
      );
    }

    function SpinWheelModal({ resources, isMuted, onClose }) {
      const [spinning, setSpinning] = useState(false);
      const [picked, setPicked] = useState(null);

      const handleSpin = () => {
        if (!resources || resources.length === 0) return;
        setSpinning(true);
        setPicked(null);
        let count = 0;
        const interval = setInterval(() => {
          const rand = resources[Math.floor(Math.random() * resources.length)];
          setPicked(rand);
          playSound('spin', isMuted);
          count++;
          if (count > 22) {
            clearInterval(interval);
            setSpinning(false);
            playSound('success', isMuted);
          }
        }, 80);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="app-card border rounded-3xl max-w-sm w-full p-6 text-center space-y-5 shadow-2xl animate-scale-up">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-sm">Random Tool Picker</h3>
              <button onClick={onClose} className="app-text-sub hover:text-indigo-500"><i className="fas fa-xmark"></i></button>
            </div>

            <div className="py-6 border border-dashed rounded-2xl app-card flex flex-col items-center justify-center min-h-[150px]">
              {picked ? (
                <div className="space-y-2 animate-scale-up">
                  <div className="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-500 mx-auto flex items-center justify-center text-xl">
                    <i className={`fas ${picked.icon && picked.icon.startsWith('fa-') ? picked.icon : 'fa-globe'}`}></i>
                  </div>
                  <div className="font-bold text-sm">{picked.title}</div>
                  <span className="text-[10px] text-indigo-500 font-semibold uppercase">{picked.badge || picked.category}</span>
                </div>
              ) : (
                <div className="app-text-sub text-xs">Click Spin to pick a random tool!</div>
              )}
            </div>

            <button 
              onClick={handleSpin} 
              disabled={spinning}
              className="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition-all shadow-lg shadow-purple-600/30"
            >
              {spinning ? 'Selecting Portal...' : 'Spin Wheel 🎲'}
            </button>

            {picked && !spinning && (
              <a href={picked.url} target="_blank" rel="noopener noreferrer" className="block w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                Launch Picked Portal <i className="fas fa-arrow-up-right-from-square ml-1"></i>
              </a>
            )}
          </div>
        </div>
      );
    }

    function ImportExportModal({ bookmarks, addToast, onClose, onImport }) {
      const [jsonText, setJsonText] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const handleExport = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(bookmarks, null, 2));
        const anchor = document.createElement('a');
        anchor.setAttribute("href", dataStr);
        anchor.setAttribute("download", "edupulse_bookmarks.json");
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        if (addToast) addToast('Bookmarks backup exported!', 'success');
      };

      const handleImportSubmit = () => {
        setErrorMsg('');
        try {
          const parsed = JSON.parse(jsonText);
          if (Array.isArray(parsed)) {
            onImport(parsed);
          } else {
            setErrorMsg('Invalid format: Exported backup must be a valid JSON array.');
          }
        } catch (err) {
          setErrorMsg('Parsing error: Please verify valid JSON text syntax.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="app-card border rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl animate-scale-up">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-sm">Backup / Restore Bookmarks</h3>
              <button onClick={onClose} className="app-text-sub hover:text-indigo-500"><i className="fas fa-xmark"></i></button>
            </div>

            {errorMsg && (
              <div className="p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-500 text-xs font-semibold flex items-center gap-2">
                <i className="fas fa-circle-exclamation"></i>
                <span>{errorMsg}</span>
              </div>
            )}

            <div className="space-y-3">
              <button onClick={handleExport} className="w-full py-2.5 rounded-xl app-card hover:border-indigo-500/50 font-semibold text-xs flex items-center justify-center gap-2">
                <i className="fas fa-download text-indigo-500"></i> Download JSON Backup
              </button>

              <div className="app-text-sub text-[10px] font-bold text-center uppercase tracking-wider">or Paste JSON String</div>

              <textarea 
                rows="3" 
                value={jsonText} 
                onChange={e=>{ setJsonText(e.target.value); setErrorMsg(''); }} 
                placeholder='["sp1", "jn1", "jn3"]' 
                className="w-full app-input border rounded-xl p-3 text-xs font-mono focus:outline-none"
              ></textarea>

              <button onClick={handleImportSubmit} className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">
                Import Bookmarks
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

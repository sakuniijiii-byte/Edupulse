<style>
:root{--ink:#12202c;--muted:#64748b;--line:#dfe8e7;--paper:#ffffff;--bg:#f8fafc;--teal:#0d9488;--deep:#123c42;--lime:#bef264;--card-bg:#ffffff;--text-primary:#0f172a;--text-muted:#64748b;--border-color:#e2e8f0;--bio-bg:#ecfdf5;--bio-text:#047857;--chem-bg:#f5f3ff;--chem-text:#6d28d9;--phy-bg:#f0fdfa;--phy-text:#0f766e}
body.dark{--ink:#f8fafc;--muted:#94a3b8;--line:#334155;--paper:#1e293b;--bg:#0f172a;--teal:#14b8a6;--deep:#0f2e33;--card-bg:#1e293b;--text-primary:#f8fafc;--text-muted:#94a3b8;--border-color:#334155;--bio-bg:rgba(16,185,129,.15);--bio-text:#6ee7b7;--chem-bg:rgba(139,92,246,.15);--chem-text:#c4b5fd;--phy-bg:rgba(20,184,166,.15);--phy-text:#5eead4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;transition:background-color .2s,color .2s;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app-layout{display:flex;flex-direction:column;min-height:100vh}
.sidebar{position:fixed;top:0;bottom:0;left:0;width:260px;height:100vh;overflow-y:auto;z-index:40;display:flex;flex-direction:column;justify-content:space-between;padding:20px 16px;transition:transform .3s ease-in-out;background:var(--paper);border-right:1px solid var(--border-color)}
@media (max-width:1023px){.sidebar{transform:translateX(-100%)}.sidebar.mobile-open{transform:translateX(0)}.content{margin-left:0;width:100%}}
@media (min-width:1024px){.content{margin-left:260px;flex:1;width:calc(100% - 260px)}}
.brand{display:flex;gap:12px;align-items:center}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--deep);color:var(--lime);font-weight:900}
.brand b{font-size:16px;color:var(--text-primary)}

.eyebrow{margin:2px 0 0;color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.nav button{padding:10px 12px;border-radius:12px;background:none;color:var(--text-muted);text-align:left;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:10px;width:100%}

body.dark .bar{background:rgba(255,255,255,.15)}

.card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:all .2s ease-in-out}
.card:hover{border-color:rgba(13,148,136,.3);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.subject{padding:14px 16px;border:1px solid var(--border-color);border-radius:16px;background:var(--card-bg);display:flex;align-items:center;justify-content:space-between;text-align:left;transition:all .2s}
.subject.selected{border-color:var(--teal);background:rgba(16,155,141,.08)}
.subject b{display:block;color:var(--text-primary);font-size:14px}
.subject small{display:block;color:var(--text-muted);margin-top:2px;font-size:12px}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}
.bio{background:var(--bio-bg);color:var(--bio-text)}.chem{background:var(--chem-bg);color:var(--chem-text)}.phy{background:var(--phy-bg);color:var(--phy-text)}

.chapter:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.06)}
.chapter-title{font-weight:800;font-size:14px;margin-top:14px;color:var(--text-primary);line-height:1.4}
.progress{height:6px;background:rgba(0,0,0,.06);border-radius:99px;margin-top:6px;overflow:hidden}
body.dark .progress{background:rgba(255,255,255,.1)}
.progress i{display:block;height:100%;background:var(--teal);transition:width .4s ease}
.practice{margin-top:14px;color:var(--teal);font-weight:800;background:none;padding:0;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.controls input,.controls select{padding:8px 12px;border:1px solid var(--border-color);border-radius:12px;background:var(--card-bg);color:var(--text-primary);outline:none;font-size:13px}
.controls input:focus,.controls select:focus{border-color:var(--teal)}
.custom-modal{position:fixed;inset:0;background:rgba(18,32,44,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s ease;padding:16px}
.custom-modal.open{opacity:1;pointer-events:auto}
.modal-box{background:var(--card-bg);color:var(--text-primary);width:100%;max-width:750px;border-radius:24px;padding:24px;border:1px solid var(--border-color);box-shadow:0 20px 40px rgba(15,23,42,.18);transform:translateY(10px) scale(.98);transition:transform .2s ease;max-height:88vh;overflow:auto}
.custom-modal.open .modal-box{transform:scale(1)}
.custom-modal.fullscreen-modal{padding:0}
.custom-modal.fullscreen-modal .modal-box{max-width:100vw;height:100vh;max-height:100vh;border-radius:0;border:none;display:flex;flex-direction:column}
.mobile-nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s ease}
.mobile-nav-overlay.open{opacity:1;pointer-events:auto}
.quick-action-card{transition:all 0.25s cubic-bezier(0.4, 0, 0.2, 1)}
.quick-action-card:hover{transform:translateY(-4px);box-shadow:0 12px 24px -8px rgba(13, 148, 136, 0.2)}
@keyframes lockBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(234,179,8,.2)}50%{box-shadow:0 0 35px rgba(234,179,8,.5)}}
.animate-lock-bounce{animation:lockBounce 2s ease-in-out infinite}
.animate-pulse-glow{animation:pulseGlow 2.5s infinite}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>

<script>
// ===== Storage Keys =====
const STORAGE_KEYS = {
attempts: 'edupulse_attempts_v1',
qstats: 'edupulse_qstats_v1',
session: 'edupulse_session_v1',
settings: 'edupulse_settings_v1',
streak: 'edupulse_streak_v1',
progress: 'edupulse_progress',
todos: 'edupulse_todos',
theme: 'edupulse_theme',
focus: 'edupulse_focus_sessions',
timerPreset: 'edupulse_timer_preset',
aiKey: 'edupulse_ai_key_v1',
aiCache: 'edupulse_ai_cache_v1',
aiFeedback: 'edupulse_ai_feedback_v1',
aiQs: 'edupulse_ai_qs_v1',
aiSummaries: 'edupulse_ai_summaries_v1'
};

const defaultSettings = {
marksCorrect: 4,
marksWrong: -1,
minutesPerQuestion: 1,
shuffleQuestions: false,
shuffleOptions: false,
showTimer: true,
confirmSubmit: true,
haptics: true,
dailyGoalQuestions: 30,
aiModel: 'gemini-1.5-flash',
aiLanguage: 'English',
rememberKey: false
};

const StorageModule = {
get(key, fallback) {
try {
let raw = sessionStorage.getItem(key);
if (raw === null) raw = localStorage.getItem(key);
if (raw === null) return fallback;
return JSON.parse(raw);
} catch (e) {
console.warn(`Storage read error for ${key}:`, e);
return fallback;
}
},
set(key, value, persistent = true) {
try {
const str = JSON.stringify(value);
if (persistent) {
localStorage.setItem(key, str);
sessionStorage.removeItem(key);
} else {
sessionStorage.setItem(key, str);
localStorage.removeItem(key);
}
return true;
} catch (e) {
console.warn(`Storage write error for ${key}:`, e);
return false;
}
},
remove(key) {
localStorage.removeItem(key);
sessionStorage.removeItem(key);
},
init() {
if (!localStorage.getItem(STORAGE_KEYS.settings) && !sessionStorage.getItem(STORAGE_KEYS.settings)) {
this.set(STORAGE_KEYS.settings, defaultSettings, true);
}
if (!localStorage.getItem(STORAGE_KEYS.attempts)) this.set(STORAGE_KEYS.attempts, [], true);
if (!localStorage.getItem(STORAGE_KEYS.qstats)) this.set(STORAGE_KEYS.qstats, {}, true);
if (!localStorage.getItem(STORAGE_KEYS.aiQs)) this.set(STORAGE_KEYS.aiQs, [], true);
if (!localStorage.getItem(STORAGE_KEYS.aiSummaries)) this.set(STORAGE_KEYS.aiSummaries, {}, true);
if (!localStorage.getItem(STORAGE_KEYS.streak)) {
const today = new Date().toISOString().split('T')[0];
this.set(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: today, dailyCounts: {} }, true);
}
this.updateStreak();
},
updateStreak() {
const streak = this.get(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: '', dailyCounts: {} });
const today = new Date().toISOString().split('T')[0];
if (streak.lastActiveDate === today) return;
const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
if (streak.lastActiveDate === yesterday) {
streak.current += 1;
} else if (streak.lastActiveDate !== today) {
streak.current = streak.dailyCounts[today] ? streak.current : 0;
}
if (streak.current > streak.best) streak.best = streak.current;
this.set(STORAGE_KEYS.streak, streak, true);
},
recordActivity(questionsAnsweredCount) {
const streak = this.get(STORAGE_KEYS.streak, { current: 0, best: 0, lastActiveDate: '', dailyCounts: {} });
const today = new Date().toISOString().split('T')[0];
streak.dailyCounts[today] = (streak.dailyCounts[today] || 0) + questionsAnsweredCount;
streak.lastActiveDate = today;
if (streak.current === 0) streak.current = 1;
if (streak.current > streak.best) streak.best = streak.current;

const keys = Object.keys(streak.dailyCounts).sort();
if (keys.length > 120) {
for (let i = 0; i < keys.length - 120; i++) delete streak.dailyCounts[keys[i]];
}
this.set(STORAGE_KEYS.streak, streak, true);
}
};

StorageModule.init();

// ===== GOOGLE GEMINI BYOK AI MODULE =====
const AI = {
getKey() {
return sessionStorage.getItem(STORAGE_KEYS.aiKey) || localStorage.getItem(STORAGE_KEYS.aiKey) || '';
},
setKey(key, persistent = false) {
key = key.trim();
if (!key) {
this.clearKey();
return;
}
if (persistent) {
localStorage.setItem(STORAGE_KEYS.aiKey, key);
sessionStorage.removeItem(STORAGE_KEYS.aiKey);
} else {
sessionStorage.setItem(STORAGE_KEYS.aiKey, key);
localStorage.removeItem(STORAGE_KEYS.aiKey);
}
},
clearKey() {
localStorage.removeItem(STORAGE_KEYS.aiKey);
sessionStorage.removeItem(STORAGE_KEYS.aiKey);
},
hasKey() {
return !!this.getKey();
},
getCache() {
return StorageModule.get(STORAGE_KEYS.aiCache, {});
},
setCache(cache) {
const keys = Object.keys(cache);
if (keys.length > 150) {
delete cache[keys[0]]; // Simple LRU eviction
}
StorageModule.set(STORAGE_KEYS.aiCache, cache, true);
},
queue: Promise.resolve(),
async request(fn) {
const res = this.queue.then(() => fn()).catch(err => { throw err; });
this.queue = res.catch(() => {});
return res;
},
async listModels() {
const key = this.getKey();
if (!key) throw new Error("No API key configured");
const url = `https://generativelanguage.googleapis.com/v1beta/models`;
const controller = new AbortController();
const timeout = setTimeout(() => controller.abort(), 15000);
try {
const res = await fetch(url, {
headers: { 'x-goog-api-key': key },
signal: controller.signal
});
clearTimeout(timeout);
if (!res.ok) throw new Error(`HTTP ${res.status}`);
const data = await res.json();
return (data.models || []).filter(m => m.name && m.name.includes('gemini') && (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace('models/', ''));
} catch (e) {
clearTimeout(timeout);
return ['gemini-1.5-flash', 'gemini-1.5-pro', 'gemini-2.0-flash-exp'];
}
},
async generateContent(contents, jsonMode = false, systemInstruction = null) {
if (!navigator.onLine) throw new Error("Offline. Please check your internet connection.");
const key = this.getKey();
if (!key) throw new Error("No Gemini API key set. Please configure it in Settings.");

const settings = StorageModule.get(STORAGE_KEYS.settings, defaultSettings);
let model = settings.aiModel || 'gemini-1.5-flash';
const lang = settings.aiLanguage || 'English';

const defaultSys = `You are EduPulse AI, an expert NEET exam coach. Always base answers strictly on NCERT textbooks. If you are unsure, state "I'm not sure". Keep answers short, structured, concise, and helpful. Reply in ${lang}.`;
const finalSys = systemInstruction || defaultSys;

const body = {
contents: Array.isArray(contents) ? contents : [{ parts: [{ text: String(contents) }] }],
system_instruction: { parts: [{ text: finalSys }] },
generationConfig: {
temperature: 0.2,
maxOutputTokens: 1500,
...(jsonMode ? { responseMimeType: "application/json" } : {})
}
};

const makeFetch = async (targetModel) => {
const url = `https://generativelanguage.googleapis.com/v1beta/models/${targetModel}:generateContent`;
const controller = new AbortController();
const timer = setTimeout(() => controller.abort(), 45000);
try {
const res = await fetch(url, {
method: 'POST',
headers: {
'Content-Type': 'application/json',
'x-goog-api-key': key
},
body: JSON.stringify(body),
signal: controller.signal
});
clearTimeout(timer);
return res;
} catch (err) {
clearTimeout(timer);
throw err;
}
};

return this.request(async () => {
let res;
try {
res = await makeFetch(model);
if (res.status === 404 && model !== 'gemini-1.5-flash') {
showToast(`Model ${model} not found, falling back to gemini-1.5-flash`, 'warning');
model = 'gemini-1.5-flash';
res = await makeFetch(model);
}
if (res.status >= 500 && res.status < 600) {
// Retry once on 5xx
await new Promise(r => setTimeout(r, 1000));
res = await makeFetch(model);
}
} catch (err) {
if (err.name === 'AbortError') throw new Error("Request timed out (45s limit). Please try again.");
throw new Error("Network error connecting to Gemini API.");
}

if (!res.ok) {
if (res.status === 400) throw new Error("Bad request (400). Invalid prompt payload.");
if (res.status === 401 || res.status === 403) throw new Error("Invalid or restricted Gemini API Key. Check Settings.");
if (res.status === 429) throw new Error("Rate limit exceeded (429). Please wait a moment.");
throw new Error(`API Error (${res.status}).`);
}

const data = await res.json();
const candidate = data.candidates?.[0];
if (!candidate || candidate.finishReason === 'SAFETY' || candidate.finishReason === 'RECITATION') {
throw new Error("Response was blocked by Gemini safety settings.");
}
const text = candidate.content?.parts?.[0]?.text;
if (!text) throw new Error("Received empty response from AI model.");
return text;
});
},
async ask(prompt, cacheKey = null) {
if (cacheKey) {
const cache = this.getCache();
if (cache[cacheKey]) return cache[cacheKey];
}
const res = await this.generateContent(prompt, false);
if (cacheKey) {
const cache = this.getCache();
cache[cacheKey] = res;
this.setCache(cache);
}
return res;
},
async askJSON(prompt) {
const text = await this.generateContent(prompt, true);
try {
return JSON.parse(text);
} catch (e) {
throw new Error("Model generated invalid JSON format.");
}
}
};

// Safe HTML sanitizer allowing bold & line breaks only

clean = clean.replace(/\*(.*?)\*/g, '<em>$1</em>');
clean = clean.replace(/\n/g, '<br>');
return clean;
}

// ===== Chapter Availability Checks =====
let activeAvailabilityFetches = 0;
const availabilityQueue = [];

function checkChapterAvailability(chapterName, callback) {
if (chapterAvailability[chapterName] !== undefined) {
callback(chapterAvailability[chapterName]);
return;
}
availabilityQueue.push({ chapterName, callback });
processAvailabilityQueue();
}

function processAvailabilityQueue() {
if (activeAvailabilityFetches >= 4 || availabilityQueue.length === 0) return;
const item = availabilityQueue.shift();
activeAvailabilityFetches++;

fetch(quizUrl(item.chapterName), { method: 'HEAD', cache: 'force-cache' })
.then(res => {
const available = res.ok;
chapterAvailability[item.chapterName] = available;
item.callback(available);
})
.catch(() => {
chapterAvailability[item.chapterName] = false;
item.callback(false);
})
.finally(() => {
activeAvailabilityFetches--;
processAvailabilityQueue();
});
}

async function setupQuizMode(mode, subj, chapterName, customQuestions = null) {

try {
let rawQuestions = customQuestions;
if (!rawQuestions) {
const res = await fetch(quizUrl(chapterName));
if (!res.ok) throw new Error(`HTTP ${res.status}`);
const raw = await res.json();
const list = Array.isArray(raw) ? raw : raw.qs;
rawQuestions = list.map((q, i) => {
const options = (q.o || q.options || []).map(String);
let correct = typeof q.a === 'number' ? q.a - 1 : options.findIndex(o => o.trim() === String(q.a).trim());
if (correct < 0 || correct >= options.length) correct = 0;
return {
qKey: slugify(chapterName) + '#' + simpleHash(q.q || String(i)),
question: q.q || `Question ${i + 1}`,
options,
correct,
explanation: q.s || '',
sourceChapter: chapterName
};
});
}
if (mode === 'practice') launchPracticeSession(subj, chapterName, rawQuestions);
else launchTestSession(subj, chapterName, rawQuestions);
} catch (err) {
showToast("Error loading quiz data", "error");
closeModal();
}
}

question: item.q,
options: item.o,
correct: item.a - 1,
explanation: item.s,
ai: true
}));

if (!validQs.length) throw new Error("Generated questions did not pass validation rules.");

const existing = StorageModule.get(STORAGE_KEYS.aiQs, []);
StorageModule.set(STORAGE_KEYS.aiQs, [...existing, ...validQs], true);

showToast(`Added ${validQs.length} AI questions to practice pool!`);
closeModal();
setupQuizMode('practice', 'AI Generated', 'Custom Practice Pool', validQs);
} catch (e) {
document.getElementById('gen-qs-res').innerHTML = `<p class="text-rose-500">${escapeHtml(e.message)}</p>`;
}
}

function resizeImageToBase64(file, maxDimension) {
return new Promise((resolve, reject) => {
const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > maxDimension || h > maxDimension) {
if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
}
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
resolve(dataUrl.split(',')[1]);
};
img.onerror = reject;
img.src = URL.createObjectURL(file);
});
}

async function saveAndTestApiKey() {
const keyInput = document.getElementById('setting-ai-key');
const rememberCheck = document.getElementById('setting-remember-key');
const modelSelect = document.getElementById('setting-ai-model');
const langSelect = document.getElementById('setting-ai-lang');
const btn = document.getElementById('save-key-btn');

const key = keyInput?.value.trim() || '';
const remember = rememberCheck?.checked || false;

if (!key) {
showToast("Please enter a valid API key.", "warning");
return;
}

btn.disabled = true;
btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Testing Key...`;

try {
AI.setKey(key, remember);

// Update settings object
const settings = StorageModule.get(STORAGE_KEYS.settings, defaultSettings);
settings.rememberKey = remember;
settings.aiModel = modelSelect?.value || 'gemini-1.5-flash';
settings.aiLanguage = langSelect?.value || 'English';
StorageModule.set(STORAGE_KEYS.settings, settings, true);

const models = await AI.listModels();
showToast(`Key verified successfully! Available models: ${models.length}`, "success");
} catch (err) {
showToast(`Key test failed: ${err.message}`, "error");
} finally {
btn.disabled = false;
btn.innerHTML = `Save & Test Key`;
renderView();
}
}

function removeApiKey() {
AI.clearKey();
showToast("API Key removed.", "success");
renderView();
}

// Initial render
renderView();
</script>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EduPulse PRO — NEET Preparation Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --ink: #12202c;
      --muted: #64748b;
      --line: #dfe8e7;
      --paper: #ffffff;
      --bg: #f8fafc;
      --teal: #0d9488;
      --deep: #123c42;
      --lime: #bef264;
      --card-bg: #ffffff;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --bio-bg: #ecfdf5;
      --bio-text: #047857;
      --chem-bg: #f5f3ff;
      --chem-text: #6d28d9;
      --phy-bg: #f0fdfa;
      --phy-text: #0f766e;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --warning: #f59e0b;
      --warning-soft: #fef3c7;
      --shadow-soft: 0 14px 32px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      transition: background-color 0.22s ease, color 0.22s ease;
    }
    body.dark {
      --paper: #0f172a;
      --bg: #020817;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
      --card-bg: #111827;
      --bio-bg: rgba(16,185,129,0.12);
      --bio-text: #6ee7b7;
      --chem-bg: rgba(139,92,246,0.12);
      --chem-text: #c4b5fd;
      --phy-bg: rgba(20,184,166,0.12);
      --phy-text: #5eead4;
      --line: #1f2937;
      --muted: #94a3b8;
      --shadow-soft: 0 18px 40px rgba(2, 6, 23, 0.35);
    }
    button, input, select { font: inherit; }
    button { border: none; cursor: pointer; }

    .app-layout { display: flex; flex-direction: column; min-height: 100vh; }
    @media (min-width: 1024px) {
      .app-layout { flex-direction: row; }
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; height: 100vh; overflow-y: auto; }
      .content { margin-left: 260px; flex: 1; width: calc(100% - 260px); }
    }

    .sidebar {
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(18px);
      border-right: 1px solid var(--border-color);
      padding: 24px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    body.dark .sidebar { background: rgba(15,23,42,0.74); }
    .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand-inner { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--deep), var(--teal));
      color: var(--lime); font-weight: 900; display: grid; place-items: center;
      box-shadow: 0 8px 20px rgba(13,148,136,.25);
    }
    .brand b { font-size: 1.02rem; }
    .brand b span { color: var(--teal); }
    .eyebrow {
      margin: 4px 0 0; color: var(--muted); font-size: 10px; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button {
      width: 100%; border-radius: 12px; background: transparent; color: var(--muted);
      padding: 11px 12px; text-align: left; display: flex; align-items: center; gap: 10px;
      font-weight: 700; transition: all 0.2s ease;
    }
    .nav button:hover { background: rgba(13,148,136,0.06); color: var(--teal); }
    .nav button.active {
      background: rgba(13,148,136,0.15); color: var(--teal); box-shadow: inset 0 0 0 1px rgba(13,148,136,0.06);
    }
    .goal {
      margin-top: auto; background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.22);
      border-radius: 16px; padding: 14px;
    }
    .goal small { color: var(--teal); text-transform: uppercase; letter-spacing: 0.1em; font-weight: 800; font-size: 10px; }
    .goal strong { display: block; margin-top: 4px; font-size: 13px; }
    .bar { height: 6px; background: rgba(0,0,0,0.08); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), #2dd4bf); }
    .goal p { font-size: 11px; color: var(--muted); margin-top: 6px; }

    .topbar {
      position: sticky; top: 0; z-index: 20;
      height: 72px; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.78);
      backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
    }
    body.dark .topbar { background: rgba(2,8,23,0.78); }
    .date { color: var(--muted); font-size: 11px; font-weight: 700; }
    .topbar h1 { font-size: 18px; margin: 3px 0 0; font-weight: 800; }
    .main { max-width: 1400px; margin: 0 auto; padding: 24px; }
    .tag { color: var(--teal); font-weight: 800; text-transform: uppercase; letter-spacing: 0.17em; font-size: 11px; }

    .search-bar {
      display: flex; gap: 12px; align-items: center; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-soft); margin-bottom: 18px;
    }
    .search-bar input {
      flex: 1; border: none; background: transparent; outline: none; font-size: 14px; color: var(--text-primary);
    }
    .search-bar input::placeholder { color: var(--muted); }

    .subject-grid, .chapter-grid { display: grid; gap: 18px; }
    .subject-grid { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 18px; }
    .subject {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 1px solid var(--border-color);
      background: var(--card-bg); border-radius: 18px; padding: 14px 16px; transition: all 0.2s ease;
    }
    .subject:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .subject.selected { border-color: rgba(13,148,136,0.42); background: rgba(13,148,136,0.06); }
    .subject b { display: block; font-size: 14px; }
    .subject small { display: block; color: var(--muted); margin-top: 2px; font-size: 12px; }
    .chip { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 9px; font-weight: 900; }
    .bio { background: var(--bio-bg); color: var(--bio-text); }
    .chem { background: var(--chem-bg); color: var(--chem-text); }
    .phy { background: var(--phy-bg); color: var(--phy-text); }

    .chapter-grid { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .chapter {
      position: relative; overflow: hidden; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 180px; animation: cardIn 0.28s ease;
    }
    .chapter::before {
      content: ''; position: absolute; inset: 0 auto auto 0; width: 100%; height: 3px; background: linear-gradient(90deg, var(--teal), transparent);
      opacity: 0; transition: opacity 0.2s ease;
    }
    .chapter:hover { transform: translateY(-3px) scale(1.01); box-shadow: var(--shadow-soft); border-color: rgba(13,148,136,0.3); }
    .chapter:hover::before { opacity: 1; }
    .chapter-title { margin-top: 12px; font-weight: 800; font-size: 14px; line-height: 1.4; }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; margin-top: 12px; }
    .progress-bar-soft { height: 6px; background: rgba(0,0,0,0.06); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .progress-bar-soft i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), #2dd4bf); }
    .practice { margin-top: 14px; color: var(--teal); font-weight: 800; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; }

    .custom-modal {
      position: fixed; inset: 0; background: rgba(15,23,42,0.65); backdrop-filter: blur(6px);
      display: grid; place-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.16s ease;
    }
    .custom-modal.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      width: min(1200px, calc(100vw - 20px)); height: min(92vh, 900px); background: rgba(255,255,255,0.94);
      border: 1px solid rgba(15,23,42,0.08); box-shadow: 0 32px 80px rgba(15,23,42,0.18); border-radius: 28px; overflow: hidden;
      display: flex; flex-direction: column; animation: modalOpen 0.22s ease;
    }
    body.dark .modal-box { background: rgba(15,23,42,0.94); border-color: rgba(148,163,184,0.2); }
    .quiz-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      border-bottom: 1px solid var(--border-color); background: rgba(240,253,250,0.8); padding: 18px 22px;
    }
    body.dark .quiz-header { background: rgba(17,24,39,0.9); }
    .quiz-header .left { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 40px; height: 40px; border-radius: 12px; background: white; border: 1px solid var(--border-color);
      color: var(--ink); display: grid; place-items: center;
    }
    body.dark .back-btn { background: #0f172a; color: #e2e8f0; border-color: var(--border-color); }
    .quiz-header h2 { margin: 0; font-size: 1.06rem; font-weight: 800; }
    .quiz-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .score-pill {
      background: rgba(255,255,255,0.9); border: 1px solid var(--border-color); border-radius: 999px;
      color: var(--ink); font-size: 12px; font-weight: 800; padding: 9px 12px;
    }
    body.dark .score-pill { background: rgba(15,23,42,0.9); color: #f8fafc; }
    .quiz-content {
      flex: 1; overflow: auto; padding: 18px 22px 20px;
      background: linear-gradient(180deg, rgba(248,250,252,0.75), rgba(255,255,255,0.98));
    }
    body.dark .quiz-content { background: linear-gradient(180deg, rgba(2,6,23,0.8), rgba(15,23,42,0.96)); }
    .palette {
      display: flex; gap: 8px; align-items: center; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px;
    }
    .palette .dot {
      min-width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 11px; font-weight: 800;
      border: 1px solid rgba(13,148,136,0.6); background: rgba(255,255,255,0.8); color: var(--teal);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .palette .dot:hover { transform: translateY(-1px); }
    .palette .dot.current { box-shadow: 0 0 0 2px rgba(13,148,136,0.18); transform: scale(1.04); }
    .palette .dot.correct { background: var(--success); color: white; border-color: transparent; }
    .palette .dot.wrong { background: var(--danger); color: white; border-color: transparent; }
    .palette .dot.skipped { background: var(--warning); color: white; border-color: transparent; }
    .question-shell {
      background: white; border: 1px solid var(--border-color); border-radius: 22px; padding: 22px; box-shadow: 0 8px 22px rgba(15,23,42,0.04);
      animation: slideIn 0.28s ease;
    }
    body.dark .question-shell { background: rgba(15,23,42,0.9); border-color: var(--border-color); }
    .q-tag { font-size: 11px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--teal); }
    .question-text {
      font-size: clamp(1.06rem, 2vw, 1.5rem); line-height: 1.55; font-weight: 800; margin-top: 12px;
    }
    .options { margin-top: 20px; display: grid; gap: 12px; }
    .option {
      width: 100%; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--border-color);
      background: #f8fafc; color: var(--text-primary); font-size: 0.97rem; font-weight: 600; display: flex; align-items: center; gap: 12px;
      transition: all 0.18s ease;
    }
    body.dark .option { background: rgba(15,23,42,0.9); }
    .option:hover { border-color: rgba(13,148,136,0.5); background: rgba(13,148,136,0.03); transform: translateY(-1px); }
    .option .index {
      width: 28px; height: 28px; border-radius: 50%; background: white; border: 1px solid var(--border-color); display: grid; place-items: center;
      font-size: 10px; font-weight: 900; color: var(--ink);
    }
    body.dark .option .index { background: #0f172a; border-color: var(--border-color); color: #e2e8f0; }
    .option.correct { background: var(--success-soft); border-color: rgba(22,163,74,0.45); color: #166534; }
    .option.correct .index { background: var(--success); color: white; border-color: transparent; }
    .option.wrong { background: var(--danger-soft); border-color: rgba(220,38,38,0.42); color: #991b1b; }
    .option.wrong .index { background: var(--danger); color: white; border-color: transparent; }
    .option.disabled { cursor: default; }

    .feedback {
      margin-top: 18px; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border-color);
      font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.2s ease;
    }
    .feedback.correct { background: var(--success-soft); border-color: rgba(22,163,74,0.24); color: #166534; }
    .feedback.wrong { background: var(--danger-soft); border-color: rgba(220,38,38,0.24); color: #991b1b; }
    .feedback strong { display: block; margin-bottom: 5px; }

    .quiz-footer {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 20px; padding-top: 14px;
      border-top: 1px solid var(--border-color);
    }
    .nav-group { display: flex; gap: 10px; }
    .plain-btn, .primary-btn {
      border-radius: 12px; padding: 11px 16px; font-weight: 800; font-size: 12px; letter-spacing: 0.02em;
    }
    .plain-btn { background: #eef2f7; color: var(--ink); }
    body.dark .plain-btn { background: #1e293b; color: #e2e8f0; }
    .primary-btn { background: linear-gradient(135deg, var(--teal), #14b8a6); color: white; }
    .primary-btn:hover { filter: brightness(0.98); }
    .primary-btn.warn { background: linear-gradient(135deg, #f59e0b, #fbbf24); color: #2f1f00; }
    .primary-btn.secondary { background: #e2e8f0; color: var(--ink); }
    body.dark .primary-btn.secondary { background: #1e293b; color: #e2e8f0; }

    .result-box {
      display: grid; place-items: center; min-height: 100%; padding: 26px; animation: fadeIn 0.22s ease;
    }
    .result-card {
      width: min(560px, 100%); background: white; border: 1px solid var(--border-color); border-radius: 24px;
      padding: 28px 18px; text-align: center; box-shadow: 0 16px 42px rgba(15,23,42,0.08);
    }
    body.dark .result-card { background: #0f172a; border-color: var(--border-color); }
    .result-card .tag { margin-bottom: 10px; display: inline-block; }
    .result-score { font-size: clamp(2.2rem, 4vw, 4rem); font-weight: 900; margin: 12px 0 8px; }
    .result-card p { color: var(--muted); line-height: 1.6; margin-top: 10px; }
    .result-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes modalOpen {
      from { opacity: 0; transform: scale(0.98) translateY(-10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 640px) {
      .topbar { padding: 0 14px; }
      .main { padding: 18px 14px; }
      .chapter-grid { grid-template-columns: 1fr; }
      .quiz-header { padding: 16px; }
      .quiz-content { padding: 12px 12px 18px; }
      .question-shell { padding: 16px; }
      .quiz-footer { flex-direction: column-reverse; align-items: stretch; }
      .nav-group { width: 100%; }
      .nav-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebarDrawer">
      <div class="brand">
        <div class="brand-inner">
          <div class="logo">✦</div>
          <div>
            <b>Edu<span>Pulse</span></b>
            <p class="eyebrow">NEET Ecosystem</p>
          </div>
        </div>
      </div>

      <nav class="nav" id="sidebarNav">
        <button class="active" data-tab="home"><i class="fa-solid fa-house"></i> Home</button>
        <button data-tab="practice"><i class="fa-solid fa-list-check"></i> Practice</button>
        <button data-tab="directory"><i class="fa-solid fa-book-bookmark"></i> Resource Directory</button>
        <button data-tab="faculty"><i class="fa-solid fa-chalkboard-user"></i> Faculty Hub</button>
        <button data-tab="tools"><i class="fa-solid fa-stopwatch"></i> Focus & Planner</button>
      </nav>

      <div class="goal">
        <small>Syllabus Goal</small>
        <strong>Finish every chapter</strong>
        <div class="bar"><i id="sidebar-progress-bar" style="width: 0%"></i></div>
        <p id="sidebar-progress-text">0% syllabus covered</p>
      </div>
    </aside>

    <section class="content">
      <header class="topbar">
        <div>
          <div class="date" id="current-date"></div>
          <h1>Welcome, Aspirant<span style="color:#0d9488">.</span></h1>
        </div>
        <button class="primary-btn secondary" id="theme-toggle" style="padding:9px 12px; border-radius:12px;"><i class="fa-solid fa-moon"></i></button>
      </header>

      <main class="main" id="main-container"></main>
    </section>
  </div>

  <div class="custom-modal" id="appModal">
    <div class="modal-box">
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    const CHAPTERS = {
      Biology: [
        'The Living World','Biological Classification','Plant Kingdom','Animal Kingdom','Morphology and Anatomy of Flowering Plants',
        'Structural Organisation in Animals','Cell: The Unit of Life','Biomolecules','Cell Cycle and Cell Division','Photosynthesis in Plants',
        'Respiration in Plants','Plant Growth and Development','Breathing and Exchange of Gases','Body Fluids and Circulation',
        'Excretory Products and their Elimination','Locomotion and Movement','Neural Control and Coordination',
        'Chemical Coordination and Integration','Sexual Reproduction in Flowering Plants','Human Reproduction','Reproductive Health',
        'Principles of Inheritance and Variation','Molecular Basis of Inheritance','Evolution','Human Health and Disease',
        'Microbes in Human Welfare','Biotechnology: Principles and Processes','Biotechnology and its Applications',
        'Organisms and Populations','Ecosystem','Biodiversity and Conservation'
      ],
      Chemistry: [
        'Some Basic Concepts of Chemistry','Structure of Atom','Chemical Thermodynamics','Chemical and Ionic Equilibrium','Solutions',
        'Electrochemistry and Redox Reactions','Chemical Kinetics','Classification of Elements and Periodicity','Chemical Bonding',
        'p-Block Elements','d- and f-Block Elements','Coordination Compounds','Purification and Characterisation','General Organic Chemistry',
        'Hydrocarbons','Haloalkanes and Haloarenes','Oxygen-Containing Compounds','Nitrogen-Containing Compounds','Biomolecules',
        'Principles Related to Practical Chemistry'
      ],
      Physics: [
        'Units and Measurements','Motion in a Straight Line','Motion in a Plane','Laws of Motion','Work, Energy and Power','Rotational Motion',
        'Gravitation','Mechanical Properties of Solids','Mechanical Properties of Fluids','Thermal Properties of Matter','Thermodynamics',
        'Kinetic Theory of Gases','Oscillations','Waves','Electric Charges and Fields','Electrostatic Potential and Capacitance','Current Electricity',
        'Moving Charges and Magnetism','Magnetism and Matter','Electromagnetic Induction','Alternating Current','Electromagnetic Waves',
        'Ray Optics and Optical Instruments','Wave Optics','Dual Nature of Radiation and Matter','Atoms','Nuclei','Semiconductor Electronics'
      ]
    };

    const state = {
      subject: 'Biology',
      tab: 'home',
      progress: JSON.parse(localStorage.getItem('edupulse_progress') || '{}'),
      quiz: {
        questions: [],
        currentIndex: 0,
        answers: {},
        score: 0,
        loading: false
      }
    };

    const fallbackQuestions = [
      {
        q: 'Which of the following is a defining characteristic of living organisms?',
        o: ['Growth', 'Reproduction', 'Metabolism', 'Both 1 and 3'],
        a: 4,
        s: 'Metabolism is a defining feature present in all living organisms, and growth is also a common feature. Thus both metabolism and growth are characteristic, making option 4 correct.'
      },
      {
        q: 'The taxonomic unit that includes one or more related families is called',
        o: ['Genus', 'Order', 'Class', 'Species'],
        a: 2,
        s: 'An order is a taxonomic category that includes one or more related families.'
      },
      {
        q: 'The scientific name of mango is written as',
        o: ['Mangifera indica', 'mangifera Indica', 'Mangifera Indica', 'mangifera indica'],
        a: 1,
        s: 'Binomial nomenclature requires the genus name to begin with a capital letter and the species epithet in lowercase.'
      },
      {
        q: 'Which one of the following is the correct hierarchy?',
        o: ['Kingdom → Class → Order → Family → Genus → Species', 'Kingdom → Order → Phylum → Class → Species → Genus', 'Kingdom → Phylum → Order → Family → Genus → Species', 'Species → Genus → Family → Order → Kingdom → Phylum'],
        a: 3,
        s: 'The correct taxonomic hierarchy is Kingdom → Phylum/Division → Class → Order → Family → Genus → Species.'
      }
    ];

    function escapeHtml(value = '') {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeChoice(value) {
      return String(value).trim();
    }

    function setCurrentDate() {
      const dateElement = document.getElementById('current-date');
      if (dateElement) {
        dateElement.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      }
    }

    function updateSidebarProgress() {
      const totalChapters = Object.values(CHAPTERS).reduce((sum, arr) => sum + arr.length, 0);
      const completed = Object.values(state.progress).filter(item => item && item.completed).length;
      const pct = Math.min(100, Math.round((completed / totalChapters) * 100));
      const bar = document.getElementById('sidebar-progress-bar');
      const text = document.getElementById('sidebar-progress-text');
      if (bar) bar.style.width = pct + '%';
      if (text) text.textContent = pct + '% syllabus covered';
    }

    function renderSubjectButtons() {
      return Object.keys(CHAPTERS).map((subject) => `
        <button class="subject ${state.subject === subject ? 'selected' : ''}" data-subject="${subject}" type="button">
          <div>
            <b>${subject}</b>
            <small>${CHAPTERS[subject].length} chapters</small>
          </div>
          <span class="chip ${subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy'}">${subject.slice(0, 2).toUpperCase()}</span>
        </button>
      `).join('');
    }

    function renderChapterCards() {
      const q = document.getElementById('chapter-search')?.value || '';
      const normalized = q.trim().toLowerCase();
      const visible = CHAPTERS[state.subject].filter((chapter) => chapter.toLowerCase().includes(normalized));

      return visible.map((chapter) => {
        const done = state.progress[chapter]?.completed;
        const pct = state.progress[chapter]?.pct || 0;
        const isLivingWorld = chapter === 'The Living World';
        return `
          <article class="chapter" data-chapter="${escapeHtml(chapter)}" tabindex="0" type="button">
            <div>
              <span class="tag">${state.subject}</span>
              <div class="chapter-title">${chapter}</div>
            </div>
            <div>
              <div class="meta">
                <span>${isLivingWorld ? '180 MCQs' : 'Chapter'}</span>
                <span>${done ? 'Done' : 'Open'}</span>
              </div>
              <div class="progress-bar-soft"><i style="width:${done ? 100 : pct}%"></i></div>
              <div class="practice"><i class="fa-solid fa-arrow-right"></i> ${isLivingWorld ? 'Start practice' : done ? 'Review' : 'Coming soon'}</div>
            </div>
          </article>
        `;
      }).join('') || '<div class="card" style="padding:24px; border-radius:18px; border:1px dashed var(--border-color);">No matching chapters found.</div>';
    }

    function renderView() {
      const container = document.getElementById('main-container');
      container.innerHTML = `
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass" style="color: var(--muted);"></i>
          <input id="chapter-search" type="text" placeholder="Search chapters..." value="${escapeHtml(document.getElementById('chapter-search') ? document.getElementById('chapter-search').value : '')}" />
        </div>
        <div class="subject-grid">${renderSubjectButtons()}</div>
        <div class="chapter-grid">${renderChapterCards()}</div>
      `;

      const searchInput = document.getElementById('chapter-search');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.subject = state.subject;
          renderView();
        });
      }

      document.querySelectorAll('[data-subject]').forEach(button => {
        button.addEventListener('click', () => {
          state.subject = button.dataset.subject;
          renderView();
        });
      });

      document.querySelectorAll('[data-chapter]').forEach(card => {
        card.addEventListener('click', () => {
          handleChapterClick(card.dataset.chapter);
        });
      });

      updateSidebarProgress();
    }

    function openModal(content) {
      const modal = document.getElementById('appModal');
      const target = document.getElementById('modalContent');
      target.innerHTML = content;
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('appModal').classList.remove('open');
      renderView();
    }

    function handleChapterClick(chapterName) {
      const cleanName = decodeHtml(chapterName);
      if (cleanName === 'The Living World') {
        startLivingWorldQuiz();
        return;
      }

      openModal(`
        <div class="result-box">
          <div class="result-card">
            <div class="tag">Coming Soon</div>
            <h3 style="font-size: 1.5rem; font-weight: 900; margin: 8px 0 0;">${escapeHtml(cleanName)}</h3>
            <p>This chapter is currently locked while the rest of the EduPulse library is being expanded.</p>
            <div class="result-actions">
              <button class="primary-btn" id="complete-lock-btn" data-chapter="${escapeHtml(cleanName)}">Mark as completed</button>
              <button class="plain-btn" id="close-lock-btn">Close</button>
            </div>
          </div>
        </div>
      `);

      document.getElementById('complete-lock-btn')?.addEventListener('click', () => {
        state.progress[cleanName] = { completed: true, pct: 100 };
        localStorage.setItem('edupulse_progress', JSON.stringify(state.progress));
        closeModal();
      });
      document.getElementById('close-lock-btn')?.addEventListener('click', closeModal);
    }

    function decodeHtml(value) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = value;
      return textarea.value;
    }

    function buildQuestionCard(question, index) {
      const selected = state.quiz.answers[index];
      const answered = selected !== undefined;
      const currentQuestionNumber = index + 1;

      const paletteButtons = state.quiz.questions.map((_, qIndex) => {
        const answer = state.quiz.answers[qIndex];
        let cls = 'dot';
        if (answer !== undefined) {
          cls += normalizeChoice(answer) === normalizeChoice(state.quiz.questions[qIndex].answer) ? ' correct' : ' wrong';
        } else if (qIndex === index) {
          cls += ' current';
        }
        return `<button class="${cls}" type="button" data-jump="${qIndex}">${qIndex + 1}</button>`;
      }).join('');

      const optionsMarkup = question.options.map((option, optionIndex) => {
        const isSelected = normalizeChoice(option) === normalizeChoice(selected);
        const isCorrect = normalizeChoice(option) === normalizeChoice(question.answer);
        const classes = ['option', answered && isCorrect ? 'correct' : '', answered && isSelected && !isCorrect ? 'wrong' : '', answered ? 'disabled' : ''].join(' ');

        return `
          <button class="${classes}" type="button" ${answered ? 'disabled' : ''} data-answer="${escapeHtml(option)}">
            <span class="index">${String.fromCharCode(65 + optionIndex)}</span>
            <span>${escapeHtml(option)}</span>
          </button>
        `;
      }).join('');

      let feedbackMarkup = '';
      if (answered) {
        const correct = normalizeChoice(selected) === normalizeChoice(question.answer);
        feedbackMarkup = `
          <div class="feedback ${correct ? 'correct' : 'wrong'}">
            <strong>${correct ? 'Correct answer' : 'Wrong answer'}</strong>
            ${correct ? 'Nice work.' : `Correct answer: <strong>${escapeHtml(question.answer)}</strong>`}<br>
            ${escapeHtml(question.explanation)}
          </div>
        `;
      }

      return `
        <div class="quiz-header">
          <div class="left">
            <button class="back-btn" id="quiz-close-btn" type="button"><i class="fa-solid fa-arrow-left"></i></button>
            <div>
              <h2>Biology — The Living World</h2>
              <p>Recommended MCQs • NCERT Pattern</p>
            </div>
          </div>
          <div class="score-pill">Score: ${state.quiz.score}/${state.quiz.questions.length}</div>
        </div>

        <div class="quiz-content">
          <div class="palette">${paletteButtons}</div>
          <div class="question-shell">
            <div class="q-tag">Question ${currentQuestionNumber} of ${state.quiz.questions.length}</div>
            <div class="question-text">${escapeHtml(question.question)}</div>
            <div class="options">${optionsMarkup}</div>
            ${feedbackMarkup}

            <div class="quiz-footer">
              <div class="nav-group">
                <button class="plain-btn" type="button" ${index === 0 ? 'disabled' : ''} id="prev-question-btn">Previous</button>
              </div>
              <div class="nav-group">
                <button class="primary-btn warn" type="button" id="skip-question-btn" ${answered ? 'style="display:none"' : ''}>Skip</button>
                <button class="primary-btn" type="button" id="next-question-btn">${index === state.quiz.questions.length - 1 ? 'Finish' : 'Next Question'}</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderQuiz() {
      const activeQuestion = state.quiz.questions[state.quiz.currentIndex];
      if (!activeQuestion) return;

      const modalContent = document.getElementById('modalContent');
      modalContent.innerHTML = buildQuestionCard(activeQuestion, state.quiz.currentIndex);
      document.getElementById('appModal').classList.add('open');

      document.getElementById('quiz-close-btn')?.addEventListener('click', closeModal);
      document.getElementById('prev-question-btn')?.addEventListener('click', prevQuestion);
      document.getElementById('skip-question-btn')?.addEventListener('click', skipQuestion);
      document.getElementById('next-question-btn')?.addEventListener('click', advanceQuestion);

      document.querySelectorAll('[data-jump]').forEach(button => {
        button.addEventListener('click', () => {
          jumpToQuestion(Number(button.dataset.jump));
        });
      });

      document.querySelectorAll('[data-answer]').forEach(button => {
        button.addEventListener('click', () => {
          const value = button.dataset.answer;
          answerQuestion(state.quiz.currentIndex, value);
        });
      });
    }

    function answerQuestion(index, value) {
      if (state.quiz.answers[index] !== undefined) return;

      const rawValue = decodeHtml(value).replace(/^[A-Z]\.?\s*/, '');
      state.quiz.answers[index] = rawValue;
      const currentQuestion = state.quiz.questions[index];

      if (normalizeChoice(rawValue) === normalizeChoice(currentQuestion.answer)) {
        state.quiz.score += 1;
      }

      renderQuiz();
    }

    function prevQuestion() {
      if (state.quiz.currentIndex > 0) {
        state.quiz.currentIndex -= 1;
        renderQuiz();
      }
    }

    function skipQuestion() {
      if (state.quiz.answers[state.quiz.currentIndex] === undefined) {
        state.quiz.answers[state.quiz.currentIndex] = 'SKIPPED';
      }

      if (state.quiz.currentIndex < state.quiz.questions.length - 1) {
        state.quiz.currentIndex += 1;
        renderQuiz();
      } else {
        finishQuiz();
      }
    }

    function jumpToQuestion(index) {
      if (index >= 0 && index < state.quiz.questions.length) {
        state.quiz.currentIndex = index;
        renderQuiz();
      }
    }

    function advanceQuestion() {
      if (state.quiz.currentIndex < state.quiz.questions.length - 1) {
        state.quiz.currentIndex += 1;
        renderQuiz();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      const total = state.quiz.questions.length;
      const correct = Object.keys(state.quiz.answers).reduce((count, idx) => {
        const value = state.quiz.answers[idx];
        const question = state.quiz.questions[Number(idx)];
        return count + (value !== 'SKIPPED' && normalizeChoice(value) === normalizeChoice(question.answer) ? 1 : 0);
      }, 0);
      const pct = Math.round((correct / total) * 100);

      state.progress['The Living World'] = { completed: pct >= 60, pct };
      localStorage.setItem('edupulse_progress', JSON.stringify(state.progress));
      updateSidebarProgress();
      renderView();

      openModal(`
        <div class="result-box">
          <div class="result-card">
            <div class="tag">Practice Complete</div>
            <div class="result-score">${correct}/${total}</div>
            <div style="font-weight:800; color: var(--muted);">Accuracy: ${pct}%</div>
            <p>${pct >= 70 ? 'Excellent work. You are well prepared for the chapter.' : pct >= 50 ? 'Good effort. Review the explanations and try one more pass.' : 'Keep revising the chapter explanations and retake the set.'}</p>
            <div class="result-actions">
              <button class="primary-btn" id="retake-btn">Retake</button>
              <button class="plain-btn" id="close-result-btn">Close</button>
            </div>
          </div>
        </div>
      `);

      document.getElementById('retake-btn')?.addEventListener('click', () => {
        state.quiz.currentIndex = 0;
        state.quiz.answers = {};
        state.quiz.score = 0;
        renderQuiz();
      });
      document.getElementById('close-result-btn')?.addEventListener('click', closeModal);
    }

    async function loadLivingWorldQuestions() {
      state.quiz.loading = true;
      try {
        const response = await fetch('Data/living_world_mcqs.json');
        let data = fallbackQuestions;

        if (response.ok) {
          const json = await response.json();
          data = (json.qs || fallbackQuestions).map((item, idx) => ({
            id: idx + 1,
            question: item.q,
            options: item.o,
            answer: item.o[item.a - 1],
            explanation: item.s || 'No explanation provided.'
          }));
        }

        state.quiz.questions = data;
        state.quiz.currentIndex = 0;
        state.quiz.answers = {};
        state.quiz.score = 0;
        renderQuiz();
      } catch (error) {
        state.quiz.questions = fallbackQuestions;
        state.quiz.currentIndex = 0;
        state.quiz.answers = {};
        state.quiz.score = 0;
        renderQuiz();
      } finally {
        state.quiz.loading = false;
      }
    }

    function startLivingWorldQuiz() {
      if (!state.quiz.questions.length) {
        loadLivingWorldQuestions();
      } else {
        state.quiz.currentIndex = 0;
        state.quiz.answers = {};
        state.quiz.score = 0;
        renderQuiz();
      }
    }

    function attachTheme() {
      const saved = localStorage.getItem('edupulse_theme');
      if (saved === 'dark') {
        document.body.classList.add('dark');
      }

      document.getElementById('theme-toggle')?.addEventListener('click', () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('edupulse_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      });
    }

    function attachSidebarActions() {
      document.getElementById('sidebarNav')?.querySelectorAll('button').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('#sidebarNav button').forEach(b => b.classList.remove('active'));
          button.classList.add('active');
          state.tab = button.dataset.tab;
          if (state.tab === 'home') renderView();
          else openModal(`
            <div class="result-box">
              <div class="result-card">
                <div class="tag">${button.dataset.tab.toUpperCase()}</div>
                <h3 style="font-size: 1.5rem; font-weight: 900; margin: 8px 0 0;">This section is active and ready for extension.</h3>
                <p>The main chapter flow and quiz are already functional on the Home/Practice experience.</p>
                <div class="result-actions">
                  <button class="primary-btn" id="close-section-btn">Close</button>
                </div>
              </div>
            </div>
          `);
          document.getElementById('close-section-btn')?.addEventListener('click', closeModal);
        });
      });
    }

    function init() {
      setCurrentDate();
      attachTheme();
      attachSidebarActions();
      renderView();
      updateSidebarProgress();
    }

    init();
  </script>
</body>
</html>

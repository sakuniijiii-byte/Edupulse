  const counts = {
    all: model.length,
    progress: model.filter(m => m.inProgress).length,
    todo: model.filter(m => m.todo).length,
    weak: model.filter(m => m.weak).length,
    done: model.filter(m => m.done).length
  };
  const chips = [['all', 'All'], ['progress', 'In progress'], ['todo', 'Not started'], ['weak', 'Needs work'], ['done', 'Completed']]
    .map(([k, l]) => `<button type="button" role="tab" aria-selected="${chapterFilter === k}" onclick="setChapterFilter('${k}')" class="chip-filter${chapterFilter === k ? ' on' : ''}">${l}<span class="pc-chip-n">${counts[k]}</span></button>`).join('');
  const countText = shown.length === model.length ? `${model.length} chapters` : `Showing ${shown.length} of ${model.length} chapters`;

  const cards = shown.map(m => {
    // Always route a chapter click through its own setup flow. The question
    // index loads asynchronously; using m.bank here caused early clicks to
    // open a generic AI screen (or the wrong flow) before the index arrived.
    const open = `openPracticeSetup('${sArg}','${jsArg(m.ch)}')`;
    const verb = !m.bank ? 'Generate questions for' : m.inProgress ? 'Resume' : 'Practise';
    const cta = !m.bank ? 'Generate with AI' : m.inProgress ? `Resume · ${m.answered}/${m.total}` : (m.finished || m.done) ? 'Practise again' : 'Start practice';
    const ctaIcon = !m.bank ? 'fa-wand-magic-sparkles' : 'fa-play';
    const badge = m.done
      ? '<span class="pc-badge pc-badge-done"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Completed</span>'
      : m.inProgress ? '<span class="pc-badge pc-badge-prog">In progress</span>' : '';
    const accChip = m.acc !== null ? `<span class="pc-acc ${m.acc >= 75 ? 'good' : m.acc >= 60 ? 'mid' : 'weak'}">${m.acc}% accuracy</span>` : '';
    const progress = m.total && m.answered
      ? `<div class="pc-bar" title="${m.answered}/${m.total} answered"><i style="width:${Math.min(100, Math.round(m.answered / m.total * 100))}%"></i></div>` : '';
    const name = escapeHtml(m.ch);
    return `
    <article class="pc-card${m.done ? ' is-done' : ''}" onpointerenter="preloadChapter('${sArg}','${jsArg(m.ch)}')" ontouchstart="preloadChapter('${sArg}','${jsArg(m.ch)}')">
      <div class="pc-top"><span class="pc-num">Ch ${m.num}</span>${badge}</div>
      <h4 class="pc-title"><button type="button" class="pc-main" aria-label="${verb} ${name}" onclick="${open}">${name}</button></h4>
      <div class="pc-meta"><span>${m.bank ? `${m.bank} questions` : 'No question bank yet'}</span>${accChip}</div>
      ${progress}
      <div class="pc-foot">
        <span class="pc-cta" aria-hidden="true"><i class="fa-solid ${ctaIcon}"></i> ${cta}</span>
        <div class="pc-tools">
          <button type="button" class="pc-ibtn${m.done ? ' on' : ''}" aria-pressed="${m.done}" aria-label="Mark ${name} as ${m.done ? 'not completed' : 'completed'}" title="${m.done ? 'Completed. Tap to undo' : 'Mark as completed'}" onclick="toggleChapterProgress('${sArg}','${jsArg(m.ch)}')"><i class="fa-${m.done ? 'solid' : 'regular'} fa-circle-check"></i></button>
          <button type="button" class="pc-ibtn pc-yt" aria-label="Watch one-shot lecture for ${name}" title="One-shot lecture" onclick="openChapterLecture('${sArg}','${jsArg(m.ch)}')"><i class="fa-brands fa-youtube"></i></button>
          ${m.hasHistory ? `<button type="button" class="pc-ibtn pc-erase" aria-label="Erase history for ${name}" title="Erase chapter history" onclick="confirmEraseChapter('${sArg}','${jsArg(m.ch)}')"><i class="fa-solid fa-eraser"></i></button>` : ''}
        </div>
      </div>
    </article>`;
  }).join('');

  const empty = `
    <div class="pc-empty">
      <b>${q ? `No ${escapeHtml(subject)} chapters match “${escapeHtml(__q.chapterSearch.trim())}”` : 'No chapters in this filter yet'}</b>
      <span>${q ? 'Check the spelling, or try a shorter search.' : 'Practise a few chapters and they will show up here.'}</span>
      <button type="button" class="pc-btn pc-btn-soft" onclick="clearChapterFilters()">Show all chapters</button>
    </div>`;

  return `
  <div class="pc">
    ${next}
    ${notes}
    <div class="pc-subjects" role="tablist" aria-label="Subject">${tabs}</div>
    <div class="pc-toolbar">
      <div class="pc-search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <label for="chapterSearch" class="pc-sr">Search ${escapeHtml(subject)} chapters</label>
        <input type="search" id="chapterSearch" oninput="onSearchInput(this)" value="${escapeHtml(__q.chapterSearch || '')}" placeholder="Search ${escapeHtml(subject)} chapters" autocomplete="off" enterkeyhint="search">
      </div>
      <div class="pc-chips" role="tablist" aria-label="Filter chapters">${chips}</div>
      <p class="pc-count" role="status">${countText}</p>
    </div>
    ${shown.length ? `<div class="pc-grid pc-s-${subjCls}">${cards}</div>` : empty}
  </div>`;
}

  const sessionSignature = () => `${quizState?.title || quizState?.chapter || ''}|${(quizState?.questions || []).map(q => q.qKey || q.question).join('|')}`;
  const readStore = (key, fallback = {}) => {
    try { return JSON.parse(localStorage.getItem(key) || 'null') || fallback; } catch (_) { return fallback; }
  };
  const writeStore = (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { console.warn('[EduPulse] Local save failed:', e); return false; }
  };

  function calculateFromAnswers(answers, questions, answerOrder = []) {
    const validOrder = [];
    (Array.isArray(answerOrder) ? answerOrder : []).forEach((index) => {
      if (Number.isInteger(index) && answers[index] !== undefined && !validOrder.includes(index)) validOrder.push(index);
    });
    Object.keys(answers || {}).forEach((key) => {
      const index = Number(key);
      if (Number.isInteger(index) && answers[index] !== undefined && !validOrder.includes(index)) validOrder.push(index);
    });

    let correct = 0;
    let correctStreak = 0;
    validOrder.forEach((index) => {
      if (questions[index] && answers[index] === questions[index].correct) {
        correct++;
        correctStreak++;
      } else {
        correctStreak = 0;
      }
    });
    return { signature: sessionSignature(), answerOrder: validOrder, correctStreak, correct, answered: validOrder.length };
  }

  function saveMetrics() {
    if (quizState?.mode !== 'practice' || quizState.infinite) return;
    metrics.signature = sessionSignature();
    writeStore(METRICS_KEY, metrics);
  }

  function restoreMetrics() {
    const saved = readStore(METRICS_KEY, null);
    metrics = saved?.signature === sessionSignature()
      ? calculateFromAnswers(quizState.userAnswers || {}, quizState.questions || [], saved.answerOrder)
      : calculateFromAnswers(quizState.userAnswers || {}, quizState.questions || []);

  async function generateAiQuestions(mode) {
    const q = currentQuestion();
    if (!q) return;
    const label = mode === 'more' ? 'similar' : mode;
    const prompt = `Create 5 new NEET MCQs based on this question's concept. Difficulty instruction: ${label}. Do not repeat the original question. Subject/chapter: ${quizState.subject} / ${quizState.chapter}. Original question: ${q.question}. Correct concept/explanation: ${q.explanation || ''}. Return only valid JSON array: [{"q":"...","o":["A","B","C","D"],"a":1,"s":"..."}], where a is 1-based.`;
    showToast('Generating a fresh practice set with AI…', 'info');
    try {
      const text = await callGeminiApi(prompt, 'You are an accurate NEET question setter. Return only valid JSON.');
      const match = text.match(/\[[\s\S]*\]/);
      if (!match) throw new Error('AI did not return a question set.');
      const parsed = JSON.parse(match[0]).filter(item => item?.q && Array.isArray(item.o) && item.o.length === 4 && Number.isInteger(item.a) && item.a >= 1 && item.a <= 4);
      if (!parsed.length) throw new Error('AI returned no valid questions.');
      const questions = parsed.map((item, index) => ({
        qKey: `ai_related_${Date.now()}_${index}_${Math.random().toString(36).slice(2, 7)}`,
        question: String(item.q), options: item.o.map(String), correct: item.a - 1,
        explanation: item.s || 'Review the related NCERT concept.', sourceChapter: `${quizState.subject}: ${quizState.chapter}`
      }));
      const settings = StorageModule.get(STORAGE_KEYS.settings, defaultSettings);
      const oldLength = settings.practiceLength, oldSource = settings.practiceSource;

      StorageModule.set(STORAGE_KEYS.settings, settings);
      launchPracticeSession(quizState.subject, `${label === 'similar' ? 'More like' : label} — ${quizState.chapter}`, questions, null);
      settings.practiceLength = oldLength; settings.practiceSource = oldSource;
      StorageModule.set(STORAGE_KEYS.settings, settings);
    } catch (error) {
      showToast(`Could not generate questions: ${error.message}`, 'error');
    }
  }

  async function explainWithAi(mode) {

    setModal(mode === 'mnemonic' ? 'Memory trick & exam tip' : 'Simple explanation', 'AI-generated study help', '<div class="animate-pulse p-4 text-sm">Preparing your explanation…</div>', `<button onclick="closeModal()" class="rounded-xl bg-slate-100 px-5 py-2 text-xs font-bold dark:bg-slate-800">Close</button>`);
    try {

  function handleAction(action) {
    const q = currentQuestion();
    if (!q) return;
    const text = `${q.question}\n\n${q.options.map((option, index) => `${String.fromCharCode(65 + index)}. ${option}`).join('\n')}`;
    if (action === 'more' || action === 'easier' || action === 'harder') return generateAiQuestions(action);
    if (action === 'mnemonic' || action === 'explain') return explainWithAi(action);
    if (action === 'copy') return copyText(text + epBrandFooter(true), 'Question');
    if (action === 'share') {
      if (navigator.share) navigator.share({ title: quizState.title || 'EduPulse question', text: text + epBrandFooter(false), url: EP_BRAND.site }).catch(() => {});
      else copyText(text + epBrandFooter(true), 'Question');
      return;
    }
    if (action === 'image') return epShareQuestionImage(q, [quizState.subject, q.sourceChapter || quizState.chapter].filter(Boolean).join(' · '));
    if (action === 'bookmark') {
      const index = quizState.currentIndex;
      quizState.bookmarked[index] = !quizState.bookmarked[index];
      const stats = StorageModule.get(STORAGE_KEYS.qstats, {});
      const key = q.qKey || `${quizState.chapter}:${index}`;
      stats[key] = { ...(stats[key] || {}), bookmarked: quizState.bookmarked[index] };

      StorageModule.set(STORAGE_KEYS.qstats, stats);
      persistQuizSession();
      renderPracticeQuiz();
      showToast(quizState.bookmarked[index] ? 'Question bookmarked.' : 'Bookmark removed.', 'success');
      return;
    }
    if (action === 'report') {
      const reports = readStore(REPORTS_KEY, []);
      reports.unshift({ question: q.question, qKey: questionId(q), chapter: quizState.chapter, reportedAt: Date.now() });
      writeStore(REPORTS_KEY, reports.slice(0, 100));
      showToast('Question saved to your local review/report list.', 'success');
      return;
    }

      if (focusTimer) {
        clearTimeout(focusTimer);
        focusTimer = null;
        showToast('Focus timer stopped.', 'info');
      } else {
        showToast('Focus session started — 25 minutes. You’ve got this!', 'success');

    if (action === 'reveal') {
      if (quizState.userAnswers[quizState.currentIndex] === undefined) {

    if (action === 'retry') {
      const missed = quizState.questions.filter((question, index) => quizState.userAnswers[index] !== undefined && quizState.userAnswers[index] !== question.correct);
      if (!missed.length) return showToast('No answered mistakes to retry yet.', 'info');

    }

  function installWrapper(name, wrap) {
    const original = window[name];

    window[name] = replacement;

  function install() {

      const result = original.apply(this, args);
      saveMetrics();
      return result;
    });

      const wasAnswered = quizState.userAnswers[index] !== undefined;

        if (optionIndex === quizState.questions[index]?.correct) {

        } else {

        }
        saveMetrics();
        renderMetrics();
      }
      return result;
    });

    installWrapper('renderPracticeQuiz', (original) => function (...args) {
      const result = original.apply(this, args);
      if (quizState.mode === 'practice' && !quizState.infinite) renderMetrics();
      else document.getElementById('normal-practice-toolkit')?.remove();
      return result;
    });

    ['resumeQuizSession', 'resumeSavedSession'].forEach((name) => {

        const result = original.apply(this, args);
        restoreMetrics();
        renderMetrics();
        return result;
      });
    });

    installWrapper('persistQuizSession', (original) => function (...args) {
      const result = original.apply(this, args);
      saveMetrics();
      return result;
    });

    restoreMetrics();
    addConfettiStyle();
    return true;
  }

      }
      if (navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'EDUPULSE_CLIENT_READY' });
      }
    } catch (e) {
      console.warn('EduPulse offline setup could not start:', e);
    }
  });
}

// ===== Back button / gesture handling (Android & browser history) =====
// Keeps one buffer entry above the app's first page so Back is handled in-app instead of closing the site.
(() => {
  let armed = false, exitArmedUntil = 0;
  const modalEl = () => document.getElementById('appModal');
  const modalOpen = () => modalEl()?.classList.contains('open');
  function arm() {
    if (armed) return;
    armed = true;
    try { history.pushState({ edu: 'app' }, ''); } catch (e) { armed = false; }
  }
  try { history.replaceState({ edu: 'home' }, ''); } catch (e) {}
  // Browsers ignore history entries added without a user gesture, so add the buffer entry on first interaction.
  ['pointerdown', 'touchstart', 'keydown', 'click'].forEach(ev => window.addEventListener(ev, arm, { once: true, passive: true, capture: true }));

  function handleBack() {
    // 1. Quiz screen (fullscreen modal)
    if (modalOpen() && modalEl().classList.contains('fullscreen-modal')) {
      const title = document.getElementById('modalTitle')?.textContent || '';
      if (title === 'Leave Practice Session?') {
        // Back pressed on the confirmation = "Continue Attempt"
        if (quizState.mode === 'test') renderTestQuiz(); else renderPracticeQuiz();
      } else {
        confirmExitQuiz();
      }
      return;
    }
    // 2. Any other open dialog
    if (modalOpen()) { closeModal(); return; }
    // 3. Mobile menu
    if (document.getElementById('sidebarDrawer')?.classList.contains('mobile-open')) { toggleMobileNav(false); return; }
    // 4. Other tabs go back to the dashboard
    if (currentTab !== 'dashboard') { switchTab('dashboard'); return; }
    // 5. Dashboard: press back twice to leave
    if (Date.now() < exitArmedUntil) { exitArmedUntil = 0; return 'exit'; }
    exitArmedUntil = Date.now() + 2000;
    showToast('Press back again to exit', 'info');
  }

  window.addEventListener('popstate', (event) => {
    if (!armed || event.state?.edu !== 'home') return;
    const result = handleBack();
    if (result === 'exit') { history.back(); return; } // leaves the site
    try { history.pushState({ edu: 'app' }, ''); } catch (e) {}
  });
})();

// Initial mount
renderView();
</script>

<script>
(function(){
  function fmt(t){t=Math.max(0,Math.min(5999,Math.round(t)));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
  setInterval(function(){
    var el=document.querySelector('#pq-timer b'); if(!el||typeof quizState==='undefined'||quizState.mode!=='practice') return;
    var i=quizState.currentIndex, done=quizState.userAnswers[i]!==undefined;
    el.textContent=fmt(done?(quizState.questionTimes[i]||0):(Date.now()-quizState.questionStartTimer)/1000);
  },1000);
  var lastIdx=-1, lastLen=-1, pqSession=null, pqSpent={}, pqHiddenAt=0;
  var orig=window.renderPracticeQuiz;
  if(typeof orig==='function'){
    window.renderPracticeQuiz=function(){
      var r=orig.apply(this,arguments);
      var i=quizState.currentIndex, now=Date.now();
      /* new session -> forget per-question carry-over */
      if(quizState.questionTimes!==pqSession){pqSession=quizState.questionTimes;pqSpent={};lastIdx=-1;}
      if(i!==lastIdx){
        /* leaving an unanswered question: remember its time so revisits continue, not restart */
        if(lastIdx!==-1 && quizState.userAnswers[lastIdx]===undefined){pqSpent[lastIdx]=Math.max(0,(now-quizState.questionStartTimer)/1000);}
        /* entering an unanswered question: start its own clock */
        if(quizState.userAnswers[i]===undefined){
          quizState.questionStartTimer=now-(pqSpent[i]||0)*1000;
          var tEl=document.querySelector('#pq-timer b'); if(tEl){tEl.textContent=fmt((now-quizState.questionStartTimer)/1000);}
        }
        if(lastIdx!==-1){
          var card=document.querySelector('.quiz-session-layout > [ontouchstart]');
          if(card){card.classList.add('pq-enter');card.addEventListener('animationend',function(){card.classList.remove('pq-enter')},{once:true});}
        }
        lastIdx=i;
      }
      return r;
    };
  }
  /* pause the question clock while the tab/app is in the background */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden){pqHiddenAt=Date.now();return;}
    if(pqHiddenAt && typeof quizState!=='undefined' && quizState.mode==='practice' && quizState.userAnswers[quizState.currentIndex]===undefined){
      quizState.questionStartTimer+=Date.now()-pqHiddenAt;
    }
    pqHiddenAt=0;
  });
})();
</script>

</style>
<script>
/* Performance Stats v2 — marks-first analytics (NEET +4 / -1 marking). Read-only over existing storage. */
function buildStatsPageV2(){
  const S=StorageModule,K=STORAGE_KEYS,set=S.get(K.settings,defaultSettings)||{};
  const mc=Number(set.marksCorrect??4),mw=Math.abs(Number(set.marksWrong??-1));
  const range=window.__statsRange||'all',days=range==='all'?0:Number(range);
  const cutoff=days?Date.now()-days*864e5:0;
  const every=S.get(K.attempts,[])||[],at=every.filter(a=>(a.finishedAt||0)>=cutoff);
  const sum=(arr,f)=>arr.reduce((s,a)=>s+(Number(f(a))||0),0);
  const att=sum(at,a=>a.attempted),cor=sum(at,a=>a.correct),wr=sum(at,a=>a.wrong),sk=sum(at,a=>a.skipped);
  const acc=cor+wr?Math.round(cor/(cor+wr)*100):0;
  const pcts=at.map(a=>a.maxScore>0?Math.max(0,Math.min(100,a.score/a.maxScore*100)):0);
  const avgPct=pcts.length?Math.round(sum(pcts,x=>x)/pcts.length):0;
  const bestIdx=pcts.length?pcts.indexOf(Math.max(...pcts)):-1,best=bestIdx>=0?at[bestIdx]:null;
  const gained=cor*mc,lost=wr*mw,net=gained-lost,projected=Math.round(avgPct/100*720);
  const band=!at.length?'Take a test to get your estimate':projected>=600?'Top-tier zone 🏆':projected>=450?'Government-seat range 🎯':projected>=300?'Building momentum 📈':'Foundation phase — keep going 💪';
  const streak=S.get(K.streak,{current:0,best:0,dailyCounts:{}})||{};const counts=streak.dailyCounts||{};
  const ring=(p,c,s=64)=>{const r=s/2-6,C=2*Math.PI*r;return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" style="flex:none"><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="rgba(148,163,184,.25)" stroke-width="6"/><circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${(C*p/100).toFixed(1)} ${C}" transform="rotate(-90 ${s/2} ${s/2})"/></svg>`;};
  /* trend */
  const last=pcts.slice(0,12).reverse();let trend;
  if(last.length<2)trend='<div class="st-empty">Complete 2+ tests to see your score trend.</div>';
  else{const W=600,H=150,P=14,x=i=>P+i*(W-2*P)/(last.length-1),y=v=>H-P-v/100*(H-2*P);
    const pts=last.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    trend=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px"><defs><linearGradient id="stg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".35"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></linearGradient></defs>${[25,50,75].map(g=>`<line x1="${P}" x2="${W-P}" y1="${y(g)}" y2="${y(g)}" stroke="rgba(148,163,184,.25)" stroke-dasharray="3 5"/>`).join('')}<polygon points="${P},${H-P} ${pts} ${W-P},${H-P}" fill="url(#stg)"/><polyline points="${pts}" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${last.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#0d9488"><title>${Math.round(v)}%</title></circle>`).join('')}</svg>`;}
  /* subjects & chapters (all-time question stats) */
  const qs=S.get(K.qstats,{})||{},subj={},chap={};
  Object.values(qs).forEach(q=>{if(!q)return;const c=q.correct||0,w=q.wrong||0;if(!(c+w))return;
    if(q.sj){const s=subj[q.sj]=subj[q.sj]||{c:0,w:0};s.c+=c;s.w+=w;}
    if(q.ch){const k=(q.sj||'')+'|'+q.ch,h=chap[k]=chap[k]||{n:q.ch,s:q.sj||'',c:0,w:0};h.c+=c;h.w+=w;}});
  const sc={Physics:'#f59e0b',Chemistry:'#0ea5e9',Biology:'#10b981',Botany:'#22c55e',Zoology:'#ec4899'};
  const subRows=Object.entries(subj).map(([n,v])=>({n,p:Math.round(v.c/(v.c+v.w)*100),t:v.c+v.w})).sort((a,b)=>b.t-a.t);
  const subHtml=subRows.length?subRows.map(r=>`<div class="st-row"><span>${escapeHtml(r.n)}</span><div class="st-bar"><i style="width:${r.p}%;background:${sc[r.n]||'#14b8a6'}"></i></div><b>${r.p}%</b></div>`).join(''):'<div class="st-empty">Practice a few chapters to unlock subject analysis.</div>';
  const chs=Object.values(chap).filter(h=>h.c+h.w>=3).map(h=>({...h,p:Math.round(h.c/(h.c+h.w)*100)}));
  const row=h=>`<div class="st-row"><span title="${escapeHtml(h.n)}">${escapeHtml(h.n)}</span><div class="st-bar"><i style="width:${h.p}%;background:${h.p>=70?'#10b981':h.p>=45?'#f59e0b':'#ef4444'}"></i></div><b>${h.p}%</b></div>`;
  const weak=[...chs].sort((a,b)=>a.p-b.p).slice(0,4),strong=[...chs].sort((a,b)=>b.p-a.p).slice(0,3).filter(h=>h.p>=60);
  const chHtml=chs.length?`<p class="st-lbl" style="margin-top:10px;color:#ef4444">Needs work</p>${weak.map(row).join('')}${strong.length?`<p class="st-lbl" style="margin-top:16px;color:#10b981">Strongest</p>${strong.map(row).join('')}`:''}`:'<div class="st-empty">Answer 3+ questions in a chapter to see strengths &amp; weak spots.</div>';
  /* heatmap: 14 weeks */
  const WK=14,end=new Date(),start=new Date(end.getTime()-(WK*7-1)*864e5),pad=start.getDay();let cells='<i style="visibility:hidden"></i>'.repeat(pad),active=0;
  for(let d=0;d<WK*7-pad+pad&&d<WK*7;d++){const dt=new Date(start.getTime()+d*864e5),k=dt.toISOString().slice(0,10),n=counts[k]||0;if(n)active++;
    cells+=`<i class="${n>=50?'l4':n>=25?'l3':n>=10?'l2':n>0?'l1':''}" title="${k}: ${n} questions"></i>`;}
  /* insights */
  const ins=[];
  if(wr>0)ins.push(['fa-triangle-exclamation','#f59e0b',`Wrong answers cost you <b>${lost} marks</b>. Skipping unsure questions would have saved them.`]);
  if(subRows.length>1){const w=[...subRows].sort((a,b)=>a.p-b.p)[0];ins.push(['fa-bullseye','#ef4444',`<b>${escapeHtml(w.n)}</b> is your weakest subject at ${w.p}% accuracy — prioritise it this week.`]);}
  if(pcts.length>=4){const a=sum(pcts.slice(0,3),x=>x)/3,b=sum(pcts.slice(3,6),x=>x)/Math.max(1,pcts.slice(3,6).length),d=Math.round(a-b);ins.push([d>=0?'fa-arrow-trend-up':'fa-arrow-trend-down',d>=0?'#10b981':'#ef4444',`Your last 3 tests are <b>${Math.abs(d)}% ${d>=0?'higher':'lower'}</b> than the 3 before.`]);}
  if(sk>att*0.25&&att>0)ins.push(['fa-forward','#0ea5e9',`You skipped ${sk} questions — attempt more where you can eliminate 2 options.`]);
  if(!ins.length)ins.push(['fa-lightbulb','#14b8a6','Complete a few tests and your personalised insights will appear here.']);
  const insHtml=ins.map(i=>`<p><i class="fa-solid ${i[0]}" style="color:${i[1]}"></i><span>${i[2]}</span></p>`).join('');
  /* history (AI feedback button unchanged) */
  const hist=at.length?`<div style="display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding-right:4px;margin-top:14px">${at.map(a=>{const p=a.maxScore>0?Math.max(0,Math.round(a.score/a.maxScore*100)):0,col=p>=70?'#10b981':p>=40?'#f59e0b':'#ef4444';
    return `<div class="st-att"><div style="min-width:0"><h4 style="font-weight:800;font-size:13.5px;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis">${escapeHtml(a.chapter)}</h4><p style="font-size:11px;color:var(--text-muted);margin-top:3px"><span class="st-badge">${escapeHtml(a.mode||'test')}</span>${escapeHtml(a.subject||'')} • ${new Date(a.finishedAt).toLocaleDateString()} ${new Date(a.finishedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</p><div class="st-bar" style="margin-top:9px;max-width:260px"><i style="width:${a.total?(a.correct/a.total*100):0}%;background:#10b981"></i><i style="width:${a.total?(a.wrong/a.total*100):0}%;background:#ef4444"></i><i style="width:${a.total?(a.skipped/a.total*100):0}%;background:#94a3b8"></i></div></div><div style="display:flex;align-items:center;gap:12px;text-align:right;flex:none"><div><b style="display:block;font-size:16px;font-weight:900;color:${col};font-variant-numeric:tabular-nums">${a.score}<span style="font-size:11px;color:var(--text-muted)">/${a.maxScore}</span></b><span style="font-size:10.5px;font-weight:800;color:var(--text-muted)">${a.accuracy||0}% acc · ${a.correct||0}✓ ${a.wrong||0}✗</span></div><button onclick="generateAiTestPerformanceFeedback(${JSON.stringify(a).replace(/"/g,'&quot;')})" class="p-2.5 rounded-xl bg-purple-500/10 text-purple-600 hover:bg-purple-500/20 transition text-xs font-bold" title="AI Feedback"><i class="fa-solid fa-wand-magic-sparkles"></i></button></div></div>`;}).join('')}</div>`:'<div class="st-empty">No attempts in this period. Take a test from the Test Hub!</div>';
  const pill=(v,l)=>`<button class="${range===v?'on':''}" onclick="window.__statsRange='${v}';renderView()">${l}</button>`;
  return `<div class="st">
  <div class="st-head"><div><h2>Performance Analytics</h2><p>Marks, accuracy and time-tested trends — based on +${mc} / −${mw} NEET marking.</p></div><div class="st-pills">${pill('7','7 days')}${pill('30','30 days')}${pill('all','All time')}</div></div>
  <div class="st-grid st-k4">
    <div class="st-c st-hero"><span class="st-lbl">Projected NEET score</span><div class="st-big" style="margin-top:10px">${at.length?projected:'—'}<sub>/ 720</sub></div><span class="st-band">${band}</span></div>
    <div class="st-c st-kpi"><div><span class="st-lbl">Avg test score</span><div class="st-big" style="margin-top:10px">${avgPct}<sub>%</sub></div><div class="st-sub">${best?`Best ${best.score}/${best.maxScore}`:'No tests yet'}</div></div>${ring(avgPct,'#14b8a6')}</div>
    <div class="st-c st-kpi"><div><span class="st-lbl">Accuracy</span><div class="st-big" style="margin-top:10px">${acc}<sub>%</sub></div><div class="st-sub">${cor} right · ${wr} wrong</div></div>${ring(acc,'#10b981')}</div>
    <div class="st-c st-kpi"><div><span class="st-lbl">Day streak</span><div class="st-big" style="margin-top:10px">${streak.current||0}<sub>days</sub></div><div class="st-sub">Best ${streak.best||0} · ${att} solved</div></div><span style="font-size:34px">🔥</span></div>
  </div>
  <div class="st-grid st-g2">
    <div class="st-c"><h3>Marks breakdown <small>${at.length} test${at.length===1?'':'s'}</small></h3>
      <div class="st-marks"><div><b style="color:#10b981">+${gained}</b><span>Gained</span></div><div><b style="color:#ef4444">−${lost}</b><span>Lost</span></div><div><b>${net}</b><span>Net marks</span></div></div>
      <div class="st-bar" style="margin-top:16px"><i style="width:${att+sk?cor/(att+sk)*100:0}%;background:#10b981"></i><i style="width:${att+sk?wr/(att+sk)*100:0}%;background:#ef4444"></i><i style="width:${att+sk?sk/(att+sk)*100:0}%;background:#94a3b8"></i></div>
      <div class="st-legend"><span><i style="background:#10b981"></i>Correct ${cor}</span><span><i style="background:#ef4444"></i>Wrong ${wr}</span><span><i style="background:#94a3b8"></i>Skipped ${sk}</span></div></div>
    <div class="st-c"><h3>Score trend <small>last ${last.length||0} tests · % of max marks</small></h3>${trend}</div>
  </div>
  <div class="st-grid st-g2">
    <div class="st-c"><h3>Subject-wise accuracy <small>all-time</small></h3>${subHtml}</div>
    <div class="st-c"><h3>Chapter strengths &amp; weak spots <small>all-time</small></h3>${chHtml}</div>
  </div>
  <div class="st-grid st-g2">
    <div class="st-c"><h3>Study consistency <small>${active} active day${active===1?'':'s'} · 14 weeks</small></h3><div class="st-heat">${cells}</div></div>
    <div class="st-c"><h3>Smart insights</h3><div class="st-ins">${insHtml}</div></div>
  </div>
  <div class="st-c"><h3>Test attempt history <small>${at.length} in range</small></h3>${hist}</div>
  </div>`;
}
</script>

<div id="bz-warm" aria-hidden="true"></div>
<script id="edupulse-boost-js">
(function(){
'use strict';
var K='edupulse_boost_v1', CK='edupulse_boost_conf_v1';
var DEF={examDate:'',hindi:false,hideTimer:false,focus:false,saver:false,warm:false,autoTheme:false,fontScale:1,lastSync:0};
var cfg=Object.assign({},DEF,rd(K,{}));
function rd(k,f){try{var v=localStorage.getItem(k);return v===null?f:JSON.parse(v);}catch(e){return f;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function save(){wr(K,cfg);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m,t){if(typeof showToast==='function')showToast(m,t||'success');}
function settings(){try{return StorageModule.get(STORAGE_KEYS.settings,defaultSettings)||{};}catch(e){return {};}}

/* ---------- preferences ---------- */
function applyPrefs(){
  var h=document.documentElement;
  h.classList.toggle('bz-hidetimer',!!cfg.hideTimer);
  h.classList.toggle('bz-focus',!!cfg.focus);
  h.classList.toggle('bz-saver',!!cfg.saver);
  h.classList.toggle('bz-warm',!!cfg.warm);
  h.style.setProperty('--bz-fs',String(cfg.fontScale||1));
  autoTheme();
}
function autoTheme(){
  if(!cfg.autoTheme||typeof applyTheme!=='function')return;
  var hr=new Date().getHours(), want=(hr>=19||hr<6)?'dark':'light';
  var isDark=document.documentElement.classList.contains('dark');
  if((want==='dark')!==isDark)applyTheme(want,false);
}
setInterval(autoTheme,600000);

/* ---------- pacing chip: green < 60s, amber < 90s, red after ---------- */
setInterval(function(){
  var chip=document.getElementById('pq-timer'); if(!chip)return;
  var b=chip.querySelector('b'); if(!b)return;
  var p=(b.textContent||'0:00').split(':'), s=(+p[0]||0)*60+(+p[1]||0);
  chip.setAttribute('data-pace',s<60?'ok':s<90?'warn':'bad');
},500);

/* ---------- streak with a weekly rest day ---------- */
window.getDayStreak=function(){
  var counts=(StorageModule.get(STORAGE_KEYS.streak,{dailyCounts:{}})||{}).dailyCounts||{};
  function key(i){return new Date(Date.now()-i*864e5).toISOString().slice(0,10);}
  var streak=0,lastGap=-99,i=counts[key(0)]?0:1;
  for(;i<400;i++){
    if(counts[key(i)]){streak++;continue;}
    if(i-lastGap>=7&&counts[key(i+1)]){lastGap=i;continue;}   /* one rest day per week keeps the streak alive */
    break;
  }
  return streak;
};

/* ---------- confidence + sound + answer wrapper ---------- */
var pendingConf={};
function beep(ok){
  try{
    var A=window.AudioContext||window.webkitAudioContext; if(!A)return;
    var c=window.__bzA||(window.__bzA=new A()), o=c.createOscillator(), g=c.createGain();
    o.type='sine';o.frequency.value=ok?740:220;g.gain.value=.07;o.connect(g);g.connect(c.destination);
    o.start();g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.18);o.stop(c.currentTime+.2);
  }catch(e){}
}
var origSel=window.selectPracticeOption;
if(typeof origSel==='function'){
  window.selectPracticeOption=function(i){
    var idx=quizState.currentIndex, fresh=quizState.userAnswers[idx]===undefined, q=quizState.questions[idx];
    var conf=pendingConf[idx];
    var r=origSel.apply(this,arguments);
    if(fresh&&q){
      var ok=i===q.correct;
      if(settings().sound)beep(ok);
      if(conf){var m=rd(CK,{});m[q.qKey||(quizState.chapter+':'+idx)]={c:conf,ok:ok,t:Date.now()};wr(CK,m);}
    }
    return r;
  };
}

/* ---------- post-render enhancements for practice quiz ---------- */
function post(){
  if(typeof quizState==='undefined'||quizState.mode!=='practice')return;
  var layout=document.querySelector('.quiz-session-layout'); if(!layout)return;
  var idx=quizState.currentIndex, q=quizState.questions[idx]; if(!q)return;
  var answered=quizState.userAnswers[idx]!==undefined;
  var opts=layout.querySelector('.mt-5.space-y-3');
  /* confidence */
  if(opts&&!answered&&!layout.querySelector('.bz-conf')){
    var row=document.createElement('div');row.className='bz-conf';
    row.innerHTML='<small>How sure?</small>'+[['sure','Sure'],['unsure','Unsure'],['guess','Guess']].map(function(a){return '<button type="button" data-c="'+a[0]+'" aria-pressed="'+(pendingConf[idx]===a[0])+'">'+a[1]+'</button>';}).join('');
    row.addEventListener('click',function(e){
      var b=e.target.closest('button[data-c]');if(!b)return;
      pendingConf[idx]=pendingConf[idx]===b.dataset.c?undefined:b.dataset.c;
      row.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(pendingConf[idx]===x.dataset.c));});
    });
    opts.parentNode.insertBefore(row,opts);
  }
  /* result tag + collapsible explanation */
  var res=document.getElementById('quiz-result');
  if(res&&!res.querySelector('.bz-tag')){
    var m=rd(CK,{})[q.qKey||(quizState.chapter+':'+idx)], ok=quizState.userAnswers[idx]===q.correct, tag='';
    if(m&&m.c==='sure'&&!ok)tag='<span class="bz-tag bad"><i class="fa-solid fa-triangle-exclamation"></i> You were sure but wrong: a high-value mistake. Revisit the concept.</span>';
    else if(m&&m.c==='guess'&&ok)tag='<span class="bz-tag lucky"><i class="fa-solid fa-dice"></i> Lucky guess. Count this as not yet learned.</span>';
    else if(m&&m.c==='sure'&&ok)tag='<span class="bz-tag good"><i class="fa-solid fa-circle-check"></i> Confident and correct.</span>';
    if(tag)res.firstElementChild.insertAdjacentHTML('afterend',tag);
    var ex=res.querySelector('.text-xs.leading-relaxed');
    if(ex&&ex.textContent.length>220&&!ex.dataset.bz){
      ex.dataset.bz='1';ex.classList.add('bz-clamp');
      var mb=document.createElement('button');mb.type='button';mb.className='bz-more';mb.textContent='Show more';
      mb.onclick=function(){var open=ex.classList.toggle('bz-clamp');mb.textContent=open?'Show more':'Show less';};
      ex.parentNode.insertBefore(mb,ex.nextSibling);
    }
  }
  /* flag for review */
  var foot=layout.querySelector('.pq-foot');
  if(foot&&!foot.querySelector('.bz-flag')){
    var f=document.createElement('button');f.type='button';f.className='bz-flag';f.title='Flag for review';f.setAttribute('aria-label','Flag for review');
    f.innerHTML='<i class="fa-solid fa-flag"></i>';f.setAttribute('aria-pressed',String(!!(quizState.marked&&quizState.marked[idx])));
    f.onclick=function(){quizState.marked=quizState.marked||{};quizState.marked[idx]=!quizState.marked[idx];if(typeof persistQuizSession==='function')persistQuizSession();renderPracticeQuiz();};
    var skip=foot.querySelector('.pq-skip'),nxt=foot.querySelector('.pq-next');
    foot.insertBefore(f,skip||nxt);
  }
}
var origR=window.renderPracticeQuiz;
if(typeof origR==='function'){
  window.renderPracticeQuiz=function(){var r=origR.apply(this,arguments);try{post();}catch(e){console.warn('bz post',e);}return r;};
}
/* long-press an option to strike it out (touch) */
(function(){
  var t=null,fired=false;
  document.addEventListener('touchstart',function(e){
    var b=e.target.closest&&e.target.closest('.quiz-session-layout button[role="radio"]'); if(!b)return;
    fired=false;clearTimeout(t);
    t=setTimeout(function(){
      var all=Array.prototype.slice.call(b.parentNode.querySelectorAll('button[role="radio"]')), i=all.indexOf(b);
      if(i>=0&&typeof toggleEliminatedOption==='function'){fired=true;if(navigator.vibrate)navigator.vibrate(12);toggleEliminatedOption(i);}
    },480);
  },{passive:true});
  ['touchend','touchmove','touchcancel'].forEach(function(n){document.addEventListener(n,function(){clearTimeout(t);},{passive:true});});
  document.addEventListener('click',function(e){if(fired&&e.target.closest&&e.target.closest('button[role="radio"]')){e.stopPropagation();e.preventDefault();fired=false;}},true);
})();

/* ---------- Hindi explanations ---------- */
var origAI=window.callGeminiApi;
if(typeof origAI==='function'){
  window.callGeminiApi=function(prompt,sys,grounding){
    if(cfg.hindi){sys=(sys?sys+'\n':'')+'Write the explanation in simple Hindi (Devanagari). Keep scientific terms in English in brackets.';}
    return origAI.call(this,prompt,sys,grounding);
  };

/* ---------- dashboard "Today" card ---------- */
function daysTo(d){if(!d)return null;var t=new Date(d+'T00:00:00').getTime();return Math.ceil((t-Date.now())/864e5);}
/* NEET is normally held on the 1st Sunday of May. Until the learner picks their own date we use the next one. */
function firstSundayOfMay(y){var d=new Date(y,4,1);d.setDate(1+(7-d.getDay())%7);return d;}
function isoLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function autoExamDate(){var n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate()),d=firstSundayOfMay(n.getFullYear());if(d<t)d=firstSundayOfMay(n.getFullYear()+1);return isoLocal(d);}
function examDate(){return cfg.examDate||autoExamDate();}
function examDateLabel(){var d=new Date(examDate()+'T00:00:00');return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'long',year:'numeric'});}
function syncHeaderDate(){var el=document.getElementById('current-date');if(el)el.textContent='Padhai ki dhadkan · NEET '+examDate().slice(0,4);}
try{syncHeaderDate();}catch(e){}
function weakChapters(){
  var st=StorageModule.get(STORAGE_KEYS.qstats,{}),g={};
  Object.keys(st).forEach(function(k){var m=st[k];if(!m||!m.seen||!m.ch)return;var n=(m.sj?m.sj+' · ':'')+m.ch;g[n]=g[n]||{s:0,c:0};g[n].s+=m.seen;g[n].c+=m.correct||0;});
  return Object.keys(g).filter(function(n){return g[n].s>=3;}).map(function(n){return {n:n,p:Math.round(g[n].c/g[n].s*100)};}).sort(function(a,b){return a.p-b.p;}).slice(0,3);
}
function badges(){
  var s=StorageModule.get(STORAGE_KEYS.streak,{dailyCounts:{}}),dc=s.dailyCounts||{},tot=Object.keys(dc).reduce(function(n,k){return n+dc[k];},0);
  var st=StorageModule.get(STORAGE_KEYS.qstats,{}),mastered=Object.keys(st).filter(function(k){return st[k]&&st[k].wrong>0&&st[k].streak>=4;}).length;
  var ds=window.getDayStreak(),o=[];
  [[100,'100 solved'],[500,'500 solved'],[1000,'1000 solved']].forEach(function(a){if(tot>=a[0])o.push(a[1]);});
  if(ds>=7)o.push('7-day streak');if(ds>=30)o.push('30-day streak');
  if(mastered>=10)o.push(mastered+' mistakes mastered');
  return o;
}
function weekSummary(){
  var dc=(StorageModule.get(STORAGE_KEYS.streak,{dailyCounts:{}})||{}).dailyCounts||{},a=0,b=0;
  for(var i=0;i<14;i++){var v=dc[new Date(Date.now()-i*864e5).toISOString().slice(0,10)]||0;if(i<7)a+=v;else b+=v;}
  if(!a&&!b)return 'Solve a few questions to unlock your weekly report.';
  var d=a-b;return 'This week you solved '+a+' questions'+(b?(d>=0?', up '+d+' from last week.':', down '+Math.abs(d)+' from last week. Try a short session today.'):'.');
}
function todayCard(){
  var sess=StorageModule.get(STORAGE_KEYS.session,null),has=sess&&sess.questions&&sess.questions.length;
  var dc=(StorageModule.get(STORAGE_KEYS.streak,{dailyCounts:{}})||{}).dailyCounts||{},today=dc[new Date().toISOString().slice(0,10)]||0;
  var goal=typeof getDailyGoal==='function'?getDailyGoal():30,pct=Math.min(100,Math.round(today/Math.max(1,goal)*100));
  var due=typeof getDueRevisionKeys==='function'?getDueRevisionKeys().length:0,dl=daysTo(examDate()),weak=weakChapters(),bd=badges();
  var cont=has?'<button class="bz-btn" onclick="__bz.resume()"><i class="fa-solid fa-play"></i> Continue</button><div class="bz-sub" style="margin-top:6px">'+esc(sess.title||'Practice')+' · Q'+((sess.currentIndex||0)+1)+' of '+sess.questions.length+'</div>'
    :'<button class="bz-btn" onclick="switchTab(\'directory\')"><i class="fa-solid fa-play"></i> Start practising</button>';
  return '<section class="bz-today" id="bz-today">'
   +(auth()?'':'<div class="bz-row" style="background:rgba(99,102,241,.12);border-radius:14px;padding:10px 12px"><span class="bz-sub" style="color:inherit"><i class="fa-solid fa-cloud"></i> Create a free account so your progress is never lost.</span><button class="bz-btn alt" style="height:34px" onclick="switchTab(\'settings\')">Set up</button></div>')
   +'<div class="bz-row"><div><div class="bz-h">Today</div><div class="bz-big">'+(dl!=null?(dl>0?dl+' days to NEET':dl===0?'NEET is today. All the best!':'Exam date has passed'):'Set your exam date')+'</div>'
   +'<div class="bz-sub" style="margin-top:3px">'+esc(examDateLabel())+' · '+(cfg.examDate?'your date <a href="#" onclick="__bz.set(\'examDate\',\'\');switchTab(\'dashboard\');return false" style="text-decoration:underline">use 1st Sunday of May</a>':'1st Sunday of May, tentative until NTA confirms')+'</div></div>'
   +'<div><input type="date" class="bz-date" value="'+esc(examDate())+'" onchange="__bz.set(\'examDate\',this.value);switchTab(\'dashboard\')" aria-label="NEET exam date"></div></div>'
   +'<div class="bz-row"><div>'+cont+'</div><div style="flex:1;min-width:200px"><div class="bz-sub" style="margin-bottom:6px">Daily target: <b>'+today+'</b> / '+goal+' questions</div><div class="bz-bar"><i style="width:'+pct+'%"></i></div></div></div>'
   +'<div class="bz-grid">'
   +'<div class="bz-box"><div class="bz-h" style="color:#8b5cf6">Revision</div><div class="bz-sub" style="margin:4px 0 8px">'+(due?due+' missed question'+(due===1?'':'s')+' due now.':'Nothing due. Missed questions return here automatically.')+'</div><button class="bz-btn vio" '+(due?'':'disabled style="opacity:.5"')+' onclick="__bz.quick()"><i class="fa-solid fa-bolt"></i> 5-min revision</button> <button class="bz-btn alt" onclick="__bz.sheet()"><i class="fa-solid fa-file-lines"></i> Revision sheet</button></div>'
   +'<div class="bz-box"><div class="bz-h" style="color:#ef4444">Weak spots</div><div style="margin:6px 0">'+(weak.length?weak.map(function(w){return '<span class="bz-chip weak">'+esc(w.n)+' · '+w.p+'%</span>';}).join(''):'<span class="bz-sub">Answer a few questions per chapter to see your weakest areas.</span>')+'</div>'+(weak.length?'<button class="bz-btn alt" onclick="startSavedPractice(\'incorrect\')"><i class="fa-solid fa-crosshairs"></i> Practise my mistakes</button>':'')+'</div>'
   +'<div class="bz-box"><div class="bz-h" style="color:#f59e0b">This week</div><div class="bz-sub" style="margin:4px 0 8px">'+esc(weekSummary())+'</div><div>'+(bd.length?bd.map(function(b){return '<span class="bz-chip badge"><i class="fa-solid fa-medal"></i>'+esc(b)+'</span>';}).join(''):'<span class="bz-sub">Badges appear as you hit milestones.</span>')+'</div></div>'
   +'</div></section>';
}

  var dl=daysTo(examDate());
  var t=dl==null?'Set NEET date':dl>0?dl+' days to NEET':dl===0?'NEET is today':'NEET date passed';
  return ' <button type="button" class="bz-pill" onclick="__bz.pickDate()" aria-label="Set NEET exam date"><i class="fa-solid fa-hourglass-half"></i> '+t+'</button>';

}
function insightCard(){
  var weak=weakChapters(),bd=badges(),due=typeof getDueRevisionKeys==='function'?getDueRevisionKeys().length:0;
  var rows=weak.length?weak.map(function(w){var c=w.p<50?'#ef4444':w.p<70?'#f59e0b':'#10b981';return '<div class="bz-wk"><div><span>'+esc(w.n)+'</span><b style="color:'+c+'">'+w.p+'%</b></div><i><u style="width:'+w.p+'%;background:'+c+'"></u></i></div>';}).join('')
    :'<p class="bz-note">Answer a few questions in a chapter and your weakest areas show up here.</p>';
  return '<section class="dv2-card bz-ins"><div class="dv2-h"><h3>Focus areas</h3><span>from your answers</span></div>'
   +'<div class="bz-ins-grid"><div><small class="bz-cap">Weakest chapters</small>'+rows+'</div>'

function friendly(e){

  if(m.indexOf('already registered')>-1||m.indexOf('already been registered')>-1)return 'ALREADY';
  if(m.indexOf('rate limit')>-1||m.indexOf('too many')>-1||(e&&e.status===429))return 'Too many attempts. Please wait a minute and try again.';
  if(m.indexOf('email not confirmed')>-1)return 'Please confirm your email first. Check your inbox for the link.';
  if(m.indexOf('password')>-1&&m.indexOf('short')>-1)return 'Password is too short. Use at least 8 characters.';
  if(m.indexOf('failed to fetch')>-1||m.indexOf('network')>-1)return 'No connection. Check your internet and try again.';

}

  const TITLES = { dashboard: 'Dashboard', learn: 'Instant Practice', mock: 'Test Hub', progress: 'Performance Stats', directory: 'Resource Vault', tools: 'Focus & Planner', about: 'About', settings: 'Settings' };

  /* skip link + main focus target */
  const main = $('#main-container'); if (main) main.setAttribute('tabindex', '-1');
  const skip = document.createElement('a'); skip.className = 'ep-skip'; skip.href = '#main-container'; skip.textContent = 'Skip to content'; document.body.prepend(skip);

  /* grouped sidebar labels */
  const nav = $('.nav');
  if (nav) [['nav-dashboard', 'Overview'], ['nav-learn', 'Study'], ['nav-directory', 'Toolkit'], ['nav-about', 'More']].forEach(([id, t]) => {
    const b = document.getElementById(id); if (!b || b.previousElementSibling?.classList.contains('ep-nav-label')) return;
    const p = document.createElement('p'); p.className = 'ep-nav-label'; p.textContent = t; b.before(p);
  });

  /* scroll progress + back to top */
  const bar = document.createElement('div'); bar.id = 'ep-progress'; bar.setAttribute('aria-hidden', 'true'); document.body.appendChild(bar);
  const top = document.createElement('button'); top.type = 'button'; top.className = 'ep-top'; top.setAttribute('aria-label', 'Back to top'); top.innerHTML = ICON(I.up);
  top.onclick = () => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' }); document.body.appendChild(top);
  let tick = false;
  const onScroll = () => { if (tick) return; tick = true; requestAnimationFrame(() => {
    const h = document.documentElement.scrollHeight - innerHeight, y = scrollY;
    bar.style.width = (h > 0 ? Math.min(100, y / h * 100) : 0) + '%'; top.classList.toggle('show', y > 700); tick = false; }); };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();

  /* count-up numbers + animated ECG line in the hero */
  const ECG = 'M0 62H170L186 62L200 36L218 90L238 14L258 72L272 62H520L536 62L550 40L568 88L588 22L606 68L620 62H1000';
  function enhance() {
    document.querySelectorAll('.dv2-stat b, .dv2-ring-label b').forEach(el => {
      if (el.dataset.epc) return; el.dataset.epc = '1';
      const m = el.textContent.trim().match(/^(\d+)(%|d)?$/); if (!m || reduce) return;
      const end = +m[1]; if (end < 1) return; const suf = m[2] || ''; const t0 = performance.now(), dur = 750;
      const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(end * e) + suf; if (k < 1) requestAnimationFrame(step); };
      el.textContent = '0' + suf; requestAnimationFrame(step);
    });
    const hero = $('.dv2-hero');
    if (hero && !$('.ep-ecg', hero)) hero.insertAdjacentHTML('afterbegin', `<svg class="ep-ecg" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="base" d="${ECG}"/><path d="${ECG}" pathLength="1"/></svg>`);
  }
  if (main) new MutationObserver(enhance).observe(main, { childList: true, subtree: false }); enhance();

  /* topbar search button */
  const tb = $('.topbar');
  if (tb && !$('.ep-search')) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ep-search'; b.setAttribute('aria-label', 'Search and jump to anything');
    b.innerHTML = ICON(I.search) + '<span>Search</span><kbd>Ctrl K</kbd>'; b.onclick = () => openCP();
    const right = tb.lastElementChild; (right && right !== tb.firstElementChild ? right : tb).prepend(b);
  }

  /* route enhancements: title, aria-current, scroll reset, tiny haptic */
  let lastTab = null; const _st = window.switchTab;
  if (typeof _st === 'function') window.switchTab = function (tab) {
    const r = _st.apply(this, arguments);
    try {
      document.title = (TITLES[tab] ? TITLES[tab] + ' · ' : '') + 'EduPulse PRO';
      document.querySelectorAll('.nav button, .bn-item').forEach(b => b.removeAttribute('aria-current'));

    } catch (e) {}
    return r;
  };
  document.addEventListener('click', e => { if (e.target.closest('.bn-item') && navigator.vibrate) { try { navigator.vibrate(8); } catch (_) {} } }, { passive: true });

  /* command palette */
  const CMDS = [
    ['Go to', 'Dashboard', I.home, () => switchTab('dashboard'), 'home overview'],
    ['Go to', 'Instant Practice', I.bolt, () => switchTab('learn'), 'practice questions chapters mcq'],
    ['Go to', 'Test Hub', I.wand, () => switchTab('mock'), 'mock test 180 cbt exam'],
    ['Go to', 'Performance Stats', I.chart, () => switchTab('progress'), 'analytics accuracy progress'],
    ['Go to', 'Resource Vault', I.book, () => switchTab('directory'), 'resources links books pdf'],
    ['Go to', 'Focus & Planner', I.clock, () => switchTab('tools'), 'timer pomodoro plan'],
    ['Go to', 'About', I.heart, () => switchTab('about'), 'info'],
    ['Go to', 'Settings', I.gear, () => switchTab('settings'), 'preferences api key language'],
    ['Actions', 'Ask Pulse AI', I.chat, () => toggleAiChatbotWindow(true), 'assistant chat doubt gemini'],

    ['Links', 'Open edupulse.cc.cd', I.link, () => window.open('https://edupulse.cc.cd', '_blank', 'noopener'), 'website site'],

  function buildCP() {
    cp = document.createElement('div'); cp.className = 'ep-cp-wrap'; cp.setAttribute('role', 'dialog'); cp.setAttribute('aria-modal', 'true'); cp.setAttribute('aria-label', 'Command palette');
    cp.innerHTML = `<div class="ep-cp"><div class="ep-cp-in">${ICON(I.search)}<input type="text" placeholder="Jump to a page or run an action…" aria-label="Search commands" autocomplete="off" spellcheck="false"></div><div class="ep-cp-list" role="listbox"></div><div class="ep-cp-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div>`;
    document.body.appendChild(cp); cpIn = $('input', cp); cpList = $('.ep-cp-list', cp);
    cp.addEventListener('mousedown', e => { if (e.target === cp) closeCP(); });

    cpIn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); paintSel(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); paintSel(); }
      else if (e.key === 'Enter') { e.preventDefault(); run(sel); }
      else if (e.key === 'Escape') { e.preventDefault(); closeCP(); }
    });
  }
  function renderCP() {
    const q = cpIn.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    shown = CMDS.filter(c => q.every(t => (c[0] + ' ' + c[1] + ' ' + c[4]).toLowerCase().includes(t)));
    if (!q.length) { const r = recents().map(t => CMDS.find(c => c[1] === t)).filter(Boolean); if (r.length) shown = [...r.map(c => ['Recent', ...c.slice(1)]), ...CMDS.filter(c => !r.includes(c))]; }
    if (!shown.length) { cpList.innerHTML = '<div class="ep-cp-empty">No match. Try "practice", "mock" or "settings".</div>'; return; }
    let g = '', html = '';
    shown.forEach((c, i) => { if (c[0] !== g) { g = c[0]; html += `<div class="ep-cp-grp">${g}</div>`; }
      html += `<button type="button" class="ep-cp-item" role="option" data-i="${i}" aria-selected="${i === sel}"><span class="ic">${ICON(c[2])}</span>${c[1]}</button>`; });
    cpList.innerHTML = html;
    cpList.querySelectorAll('.ep-cp-item').forEach(b => { b.onclick = () => run(+b.dataset.i); b.onmousemove = () => { sel = +b.dataset.i; paintSel(); }; });
  }
  function paintSel() { cpList.querySelectorAll('.ep-cp-item').forEach(b => b.setAttribute('aria-selected', String(+b.dataset.i === sel))); cpList.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' }); }
  function run(i) { const c = shown[i]; if (!c) return; remember(c[1]); closeCP(); setTimeout(() => { try { c[3](); } catch (e) {} }, 30); }
  function openCP() { if (!cp) buildCP(); prevFocus = document.activeElement; cpIn.value = ''; sel = 0; renderCP(); cp.classList.add('open'); cpIn.focus(); setTimeout(() => cpIn.focus(), 20); }
  function closeCP() { if (!cp) return; cp.classList.remove('open'); try { prevFocus?.focus(); } catch (e) {} }
  window.openCommandPalette = openCP;
  document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;

  });

  try { document.title = 'EduPulse PRO — Padhai ki dhadkan'; } catch (e) {}

})();

/* EduPulse Design v3 — interaction layer (second pass) */
(function () {
  if (window.__epDesign3) return; window.__epDesign3 = true;
  const $ = (s, r = document) => r.querySelector(s);
  const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  const inQuiz = () => !!$('.quiz-session-layout');

  /* focus mode */
  const pill = document.createElement('button'); pill.type = 'button'; pill.className = 'ep-focus-pill'; pill.textContent = 'Exit focus mode · Shift+F';
  pill.onclick = () => window.epToggleFocus(); document.body.appendChild(pill);
  window.epToggleFocus = function (force) {
    const on = typeof force === 'boolean' ? force : !document.body.classList.contains('ep-focus');
    document.body.classList.toggle('ep-focus', on);
    try { showToast(on ? 'Focus mode on. Chrome hidden.' : 'Focus mode off', 'success'); } catch (e) {}
  };

  /* share the app */
  window.epShareApp = async function () {
    const data = { title: 'EduPulse PRO', text: 'EduPulse: Padhai ki dhadkan. Free NEET practice with instant AI explanations.', url: 'https://edupulse.cc.cd' };
    if (navigator.share) { try { await navigator.share(data); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(data.text + '\n' + data.url); showToast('Link copied. Send it to a friend.', 'success'); }
    catch (e) { showToast('Could not copy the link.', 'warning'); }
  };

  /* keyboard shortcuts overlay */
  const KB = (k) => k.split(' ').map(x => `<kbd>${x}</kbd>`).join('');
  const GROUPS = [
    ['Anywhere', [['Command palette', 'Ctrl K'], ['Open palette', '/'], ['This help', '?'], ['Focus mode', 'Shift F'], ['Go to Dashboard', 'g d'], ['Go to Practice', 'g p'], ['Go to Test Hub', 'g t'], ['Go to Stats', 'g s'], ['Go to Vault', 'g v'], ['Go to Focus & Planner', 'g f'], ['Go to Settings', 'g ,']]],
    ['While practising', [['Choose option', '1 – 4'], ['Next question', 'Enter'], ['Previous', '←'], ['Bookmark', 'B'], ['Skip', 'S'], ['Explain simply', 'E'], ['Memory trick', 'M'], ['Share as image', 'I']]]
  ];
  let sc;
  window.epShowShortcuts = function () {
    if (!sc) {
      sc = document.createElement('div'); sc.className = 'ep-cp-wrap'; sc.setAttribute('role', 'dialog'); sc.setAttribute('aria-modal', 'true'); sc.setAttribute('aria-label', 'Keyboard shortcuts');
      sc.innerHTML = `<div class="ep-cp ep-sc"><div class="ep-cp-in"><b style="font-size:16px;font-weight:900;flex:1">Keyboard shortcuts</b><kbd>Esc</kbd></div><div class="ep-sc-body">${GROUPS.map(g => `<h4>${g[0]}</h4>` + g[1].map(r => `<div class="ep-sc-row"><span>${r[0]}</span><span>${KB(r[1])}</span></div>`).join('')).join('')}</div></div>`;
      sc.addEventListener('mousedown', e => { if (e.target === sc) sc.classList.remove('open'); });
      document.body.appendChild(sc);
    }
    sc.classList.add('open');
  };

  /* global key handling: ?, Shift+F, g-then-letter, E / M / I while practising */
  let gWait = 0;
  const NAV = { d: 'dashboard', p: 'learn', t: 'mock', s: 'progress', v: 'directory', f: 'tools', a: 'about', ',': 'settings' };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sc?.classList.contains('open')) { sc.classList.remove('open'); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || typing(e)) return;
    const k = e.key;
    if (k === '?') { e.preventDefault(); sc?.classList.contains('open') ? sc.classList.remove('open') : window.epShowShortcuts(); return; }
    if (k === 'F' && e.shiftKey) { e.preventDefault(); window.epToggleFocus(); return; }
    if (gWait && Date.now() < gWait) { gWait = 0; const t = NAV[k.toLowerCase()] || NAV[k]; if (t && !inQuiz()) { e.preventDefault(); switchTab(t); } return; }
    if (k === 'g' && !inQuiz() && !e.shiftKey) { gWait = Date.now() + 1000; return; }
    if (inQuiz() && !$('#appModal.open .modal-box [role="dialog"]')) {
      const map = { e: 'explain', m: 'mnemonic', i: 'image' };

    });

  document.addEventListener('visibilitychange', () => document.body.classList.toggle('ep-paused', document.hidden));
})();

<script id="ep-design-v4-js">
/* EduPulse Design v4 — interaction layer (third pass) */
(function () {
  if (window.__epDesign4) return; window.__epDesign4 = true;
  const $ = (s, r = document) => r.querySelector(s);

  /* accent colour presets */

  const AK = 'ep_accent';
  function applyAccent(i, announce) {
    const a = ACC[i] || ACC[0]; const root = document.documentElement.style;
    root.setProperty('--ep-a', a[1]); root.setProperty('--ep-b', a[2]);
    if (i > 0) document.body.setAttribute('data-accent', a[0].toLowerCase()); else document.body.removeAttribute('data-accent');
    try { localStorage.setItem(AK, String(i)); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', a[1]);
    if (announce) { try { showToast('Accent colour: ' + a[0], 'success'); } catch (e) {} }
  }
  window.epCycleAccent = function () { let i = 0; try { i = +localStorage.getItem(AK) || 0; } catch (e) {} applyAccent((i + 1) % ACC.length, true); };
  try { const i = +localStorage.getItem(AK) || 0; if (i > 0 && ACC[i]) applyAccent(i, false); } catch (e) {}

  /* toasts: click to dismiss */
  const tc = document.getElementById('toast-container');
  if (tc) tc.addEventListener('click', e => { const t = e.target.closest('#toast-container>div'); if (t) { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; setTimeout(() => t.remove(), 200); } });

  /* quiz: swipe left/right to move, tiny haptic when picking an answer */
  let sx = 0, sy = 0, st = 0, tracking = false;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; tracking = !!e.target.closest('.quiz-session-layout') && !e.target.closest('.palette-touch-btn, input, textarea, [class*="overflow-x"]');
    sx = t.clientX; sy = t.clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!tracking) return; tracking = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.6 || Date.now() - st > 700) return;
    try {
      if (quizState.mode !== 'practice' || !quizState.questions.length) return;
      if (dx < 0) { if (quizState.userAnswers[quizState.currentIndex] !== undefined) goToNextPracticeQuestion(); else showToast('Pick an answer, then swipe for the next one', 'warning'); }

    return r;
  };

  window.epcExport = function () {
    if (typeof epc === 'undefined' || !epc.history.length) { try { showToast('No chat to export yet', 'warning'); } catch (e) {} return; }
    const md = '# Pulse AI chat · EduPulse\n\n' + epc.history.map(m => {
      const t = m.ts ? new Date(m.ts).toLocaleString('en-IN') : '';

      return `**${m.role === 'user' ? 'You' : 'Pulse AI'}**${t ? ' · ' + t : ''}\n\n${body}\n`;

(function(){
  'use strict';
  const $ = (sel,root=document)=>root.querySelector(sel);
  const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
  let fontScale = 1;
  try { fontScale = Math.max(.9,Math.min(1.2,Number(localStorage.getItem('epq_font_scale'))||1)); } catch(e){}
  function activeQuiz(){ return $('.quiz-session-layout'); }
  function answeredCount(){ try{return Object.keys(quizState.userAnswers||{}).length;}catch(e){return 0;} }
  function jumpTo(i){
    if(i<0||i>=quizState.questions.length)return;
    if(quizState.mode==='test') jumpToTestQuestion(i); else jumpToPracticeQuestion(i);
  }
  function nextMatching(predicate){
    const total=quizState.questions.length, cur=quizState.currentIndex||0;
    for(let step=1;step<=total;step++){
      const i=(cur+step)%total;
      if(predicate(i)) { jumpTo(i); return true; }
    }
    return false;
  }
  window.epqJumpUnanswered=function(){
    const found=nextMatching(i=>quizState.userAnswers[i]===undefined);
    if(!found && typeof showToast==='function') showToast('All questions have been answered.','success');
  };
  window.epqJumpIncorrect=function(){
    const found=nextMatching(i=>quizState.userAnswers[i]!==undefined && quizState.userAnswers[i]!==quizState.questions[i]?.correct);
    if(!found && typeof showToast==='function') showToast('No incorrect answers to review yet.','success');
  };
  window.epqToggleBookmark=function(){
    const i=quizState.currentIndex;
    if(quizState.mode==='test'){ toggleMarkTestCurrent(); return; }
    quizState.bookmarked=quizState.bookmarked||{};
    quizState.bookmarked[i]=!quizState.bookmarked[i];
    if(typeof persistQuizSession==='function')persistQuizSession();
    if(typeof showToast==='function')showToast(quizState.bookmarked[i]?'Question bookmarked':'Bookmark removed','success');
    const b=$('.epq-bookmark');
    if(b){b.setAttribute('aria-pressed',String(!!quizState.bookmarked[i]));b.innerHTML=quizState.bookmarked[i]?'<i class="fa-solid fa-bookmark"></i> Saved':'<i class="fa-regular fa-bookmark"></i> Save';}
  };
  window.epqSetFont=function(delta){
    fontScale=Math.max(.9,Math.min(1.2,Math.round((fontScale+delta)*100)/100));
    try{localStorage.setItem('epq_font_scale',String(fontScale));}catch(e){}
    const q=activeQuiz();if(q)q.style.setProperty('--epq-question-size',fontScale);
  };
  window.epqToggleFocus=function(){
    const q=activeQuiz();if(!q)return;
    const on=q.classList.toggle('epq-focus-mode');
    const b=$('.epq-focus',q);if(b){b.setAttribute('aria-pressed',String(on));b.innerHTML=on?'<i class="fa-solid fa-eye"></i> Show tools':'<i class="fa-solid fa-bullseye"></i> Focus';}
  };
  window.epqSearchQuestion=function(value){
    const term=String(value||'').trim().toLowerCase();if(!term)return;
    const i=quizState.questions.findIndex(q=>String(q.question||q.q||'').toLowerCase().includes(term));
    if(i>=0){jumpTo(i);if(typeof showToast==='function')showToast('Matching question found.','success');}
    else if(typeof showToast==='function')showToast('No matching question in this session.','warning');
  };
  function toolbarMarkup(){
    return `<div class="epq-toolbar" role="toolbar" aria-label="Question practice tools">
      <div class="epq-toolbar-left">
        <button type="button" class="epq-jump" data-epq="unanswered" title="Jump to next unanswered question"><i class="fa-regular fa-circle"></i><span>Unanswered</span></button>
        <button type="button" class="epq-jump epq-review" data-epq="incorrect" title="Jump to next incorrect answer"><i class="fa-solid fa-rotate-left"></i><span>Review wrong</span></button>
        <button type="button" class="epq-bookmark" data-epq="bookmark" aria-pressed="false" title="Bookmark this question"><i class="fa-regular fa-bookmark"></i><span>Save</span></button>
      </div>
      <div class="epq-progress-block epq-nonfocus">
        <span class="epq-progress-label">Progress</span><div class="epq-progress" role="progressbar" aria-label="Questions answered" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span style="width:0%"></span></div>
        <span class="epq-count"><strong>0</strong> answered</span>
      </div>
      <div class="epq-toolbar-right">
        <div class="epq-font-group epq-nonfocus" aria-label="Question text size">
          <button type="button" class="epq-font" data-epq="smaller" title="Decrease question text size">A−</button>
          <button type="button" class="epq-font" data-epq="larger" title="Increase question text size">A+</button>
        </div>
        <button type="button" class="epq-focus" data-epq="focus" aria-pressed="false" title="Hide distractions"><i class="fa-solid fa-bullseye"></i> Focus</button>
      </div>
      <label class="epq-search-wrap epq-nonfocus"><i class="fa-solid fa-magnifying-glass epq-search-icon"></i><input class="epq-search" type="search" placeholder="Find a question in this session…" aria-label="Find a question in this session"><span class="epq-search-status" aria-live="polite"></span></label>
    </div>`;
  }
  function updateToolbar(q){
    if(!q)return;
    const total=quizState.questions.length||0, done=answeredCount(), pct=total?Math.round(done/total*100):0;
    const bar=$('.epq-progress',q), label=$('.epq-count strong',q), pb=$('.epq-progress[role="progressbar"]',q);
    if(bar)bar.firstElementChild.style.width=pct+'%';
    if(label)label.textContent=done;
    if(pb)pb.setAttribute('aria-valuenow',String(pct));
    const bm=$('.epq-bookmark',q);
    if(bm){const on=quizState.mode==='test'?!!quizState.marked?.[quizState.currentIndex]:!!quizState.bookmarked?.[quizState.currentIndex];bm.setAttribute('aria-pressed',String(on));bm.innerHTML=on?'<i class="fa-solid fa-bookmark"></i><span>Saved</span>':'<i class="fa-regular fa-bookmark"></i><span>Save</span>';}
    q.style.setProperty('--epq-question-size',fontScale);
  }
  function attach(q){
    if(!q || $('.epq-toolbar',q))return;
    const toolbar=document.createElement('div');toolbar.innerHTML=toolbarMarkup();
    const node=toolbar.firstElementChild;
    const palette=$('.palette-drawer-top',q);
    const header=q.firstElementChild;
    if(palette)palette.insertAdjacentElement('afterend',node);
    else if(header)header.insertAdjacentElement('afterend',node);
    else q.prepend(node);
    node.addEventListener('click',e=>{
      const b=e.target.closest('button[data-epq]');if(!b)return;
      const a=b.dataset.epq;
      if(a==='unanswered')window.epqJumpUnanswered();
      if(a==='incorrect')window.epqJumpIncorrect();
      if(a==='bookmark')window.epqToggleBookmark();
      if(a==='smaller')window.epqSetFont(-.05);
      if(a==='larger')window.epqSetFont(.05);
      if(a==='focus')window.epqToggleFocus();
    });
    const input=$('.epq-search',node);
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();window.epqSearchQuestion(input.value);}});
    input.addEventListener('input',()=>{$('.epq-search-status',node).textContent=input.value?'Press Enter to find':'';});
    updateToolbar(q);
  }
  function refresh(){
    const q=activeQuiz();if(!q)return;
    attach(q);updateToolbar(q);
  }
  const observer=new MutationObserver(()=>{const q=activeQuiz();if(q && !$('.epq-toolbar',q))requestAnimationFrame(refresh);});
  function init(){
    observer.observe(document.body,{childList:true,subtree:true});
    document.addEventListener('keydown',e=>{
      const q=activeQuiz();if(!q)return;
      const target=e.target;
      if(target && (target.matches('input,textarea,select,[contenteditable="true"]')||target.closest('.epq-toolbar')))return;
      if(e.altKey||e.ctrlKey||e.metaKey)return;
      if(e.key==='ArrowRight' && quizState.mode==='practice'){e.preventDefault();goToNextPracticeQuestion();}
      else if(e.key==='ArrowLeft' && quizState.mode==='practice'){e.preventDefault();if(quizState.currentIndex>0)jumpToPracticeQuestion(quizState.currentIndex-1);}
      else if(e.key.toLowerCase()==='u'){e.preventDefault();window.epqJumpUnanswered();}
      else if(e.key.toLowerCase()==='r'){e.preventDefault();window.epqJumpIncorrect();}
      else if(e.key.toLowerCase()==='f'){e.preventDefault();window.epqToggleFocus();}
    },true);
    refresh();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>

<style id="ep2-redesign">

@media(min-width:900px){.k-6{grid-column:span 6}.k-4{grid-column:span 4}.k-8{grid-column:span 8}}

.k-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.k-bars{display:flex;gap:8px;align-items:flex-end;height:90px;margin-top:12px}
.k-bars div{flex:1;text-align:center;font-size:10px;opacity:.9}.k-bars i{display:block;background:var(--ep2-blue);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:4px}
.k-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border-color,#e2e8f0);font-size:13px}
.k-li:first-of-type{border-top:0}.k-tag{font-size:11px;opacity:.65}.k-due{color:#e5484d;font-weight:700}
</style>
<script>
(function(){
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const K={exam:'ep2_exam',hrs:'ep2_hours',rev:'ep2_rev'},T={dashboard:'Home',learn:'Practice',mock:'Tests',progress:'Performance',directory:'Resources',tools:'Focus & planner',kit:'Exam kit',settings:'Settings',about:'About'};
const today=()=>new Date().toISOString().slice(0,10),addD=(n,d)=>{const x=new Date(d||Date.now());x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const exam=()=>LS(K.exam,'2027-05-02'),left=()=>Math.max(0,Math.ceil((new Date(exam()+'T09:00:00')-new Date())/864e5));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(){
 const nav=document.querySelector('.sidebar .nav');if(!nav)return;
 const b=(t,i,l)=>`<button onclick="switchTab('${t}')" id="nav-${t}"><i class="fa-solid ${i} w-5"></i> ${l}</button>`;
 nav.innerHTML=`<div class="grp">Study</div>${b('dashboard','fa-house','Home')}${b('learn','fa-bolt','Practice by chapter')}${b('mock','fa-file-pen','Mock tests')}
 <div class="grp">Review</div>${b('progress','fa-chart-line','Performance')}${b('kit','fa-briefcase-medical','Exam kit')}
 <div class="grp">Library</div>${b('directory','fa-book-bookmark','Resources')}${b('tools','fa-stopwatch','Focus & planner')}
 <div class="push"></div>${b('settings','fa-gear','Settings')}${b('about','fa-circle-info','About')}`;
 const bn=document.getElementById('bottom-nav');
 if(bn){const i=(t,ic,l)=>`<button type="button" class="bn-item" data-tab="${t}" onclick="switchTab('${t}')"><i class="fa-solid ${ic}"></i><span>${l}</span></button>`;
  bn.innerHTML=i('dashboard','fa-house','Home')+i('learn','fa-bolt','Practice')+i('mock','fa-file-pen','Tests')+i('progress','fa-chart-line','Stats')+i('kit','fa-briefcase-medical','Kit');}
 const r=document.querySelector('.topbar > div:last-child');
 if(r){const keep=['offline-badge','pwa-install-btn'].map(id=>document.getElementById(id));
  r.innerHTML=`<button id="ep2-count" onclick="switchTab('kit')" title="Exam countdown"><svg viewBox="0 0 34 14"><path d="M0 7h8l3-6 5 12 4-9 2 3h12"/></svg><span><b id="ep2-d">0</b> days to NEET</span></button>
  <button class="tb-ico" onclick="openApiKeyModal()" title="Gemini AI key"><i class="fa-solid fa-key"></i></button>
  <button class="tb-ico" onclick="openHelpModal()" title="Shortcuts"><i class="fa-regular fa-keyboard"></i></button>
  <button class="tb-ico" onclick="toggleTheme()" title="Theme"><i class="fa-solid fa-circle-half-stroke"></i></button>`;
  keep.forEach(e=>e&&r.prepend(e));}
 head();
}
function head(){const h=document.querySelector('.topbar h1.hidden');if(h)h.textContent=T[currentTab]||'EduPulse';const d=document.getElementById('ep2-d');if(d)d.textContent=left();
 document.querySelectorAll('.bn-item').forEach(x=>x.classList.toggle('active',x.dataset.tab===currentTab));}
const HY={Biology:[['genetic','Genetics & inheritance'],['molecular basis','Molecular biology'],['human reproduction','Reproduction'],['ecosystem','Ecology'],['photosynthesis','Plant physiology'],['neural','Human physiology'],['biotechnology','Biotech']],
Chemistry:[['coordination','Coordination compounds'],['chemical bonding','Bonding'],['equilibrium','Equilibrium'],['thermodynamics','Thermodynamics'],['electrochem','Electrochemistry'],['amines','Organic: Nitrogen compounds'],['hydrocarbons','Organic: Hydrocarbons']],
Physics:[['laws of motion','Mechanics'],['current electricity','Current electricity'],['electrostatic','Electrostatics'],['ray optics','Optics'],['semiconductor','Semiconductors'],['rotational','Rotation'],['magnetic','Magnetism']]};
const RANK=[[700,'Top ~100'],[650,'~2,000 – 5,000'],[600,'~12,000 – 20,000'],[550,'~45,000 – 60,000'],[500,'~1,00,000 – 1,25,000'],[450,'~1,70,000 – 2,00,000'],[400,'~2,50,000+'],[0,'Below 4 lakh']];
function kit(){
 const hrs=LS(K.hrs,{}),rev=LS(K.rev,[]),days=left(),done=Object.values(userProgress||{}).filter(p=>p&&p.completed).length,rem=Math.max(0,TOTAL_CHAPTERS-done);
 const week=[...Array(7)].map((_,i)=>addD(i-6)),mx=Math.max(4,...week.map(d=>hrs[d]||0));
 const hy=Object.entries(HY).map(([s,l])=>l.map(([k,n])=>{const c=(data[s]||[]).find(x=>x.toLowerCase().includes(k));return c?`<div class="k-li"><span>${esc(n)}<br><span class="k-tag">${s} · ${esc(c)}</span></span><button class="k-btn g" data-s="${esc(s)}" data-c="${esc(c)}" onclick="ep2.prac(this)">Practice</button></div>`:''}).join('')).join('');
 const revH=rev.length?rev.map((r,i)=>{const due=r.next<=today();return `<div class="k-li"><span>${esc(r.ch)}<br><span class="k-tag ${due?'k-due':''}">${due?'Revise today':'Next: '+r.next} · round ${r.step+1} of 4</span></span><span class="k-row"><button class="k-btn" onclick="ep2.rv(${i})" ${due?'':'disabled style="opacity:.4"'}>Done</button><button class="k-btn g" onclick="ep2.rm(${i})">×</button></span></div>`}).join(''):'<p class="s">No chapters yet. Add one you just studied.</p>';
 const opts=Object.entries(data).map(([s,l])=>l.map(c=>`<option>${esc(c)}</option>`).join('')).join('');
 return `<div class="k-wrap">
 <div class="k-card k-hero"><div><div class="n">${days}</div><small>days until NEET UG · ${exam()}</small></div>
 <div style="max-width:340px;font-size:14px;line-height:1.5">${rem} chapters left. That is about <b>${days?(rem/Math.max(1,days/7)).toFixed(1):'0'}</b> chapters a week and <b>${Math.ceil(rem*60/Math.max(1,days))}</b> questions a day to finish one full pass.<div class="k-row" style="margin-top:12px"><input type="date" class="k-in" style="width:auto;color:#fff" value="${exam()}" onchange="ep2.date(this.value)"></div></div></div>
 <div class="k-card k-6"><h3>Study hours</h3><p class="s">Today: ${hrs[today()]||0} h. Log what you actually studied.</p>
 <div class="k-row"><button class="k-btn g" onclick="ep2.hr(-.5)">−0.5</button><button class="k-btn" onclick="ep2.hr(.5)">+0.5 h</button><button class="k-btn" onclick="ep2.hr(1)">+1 h</button></div>
 <div class="k-bars">${week.map(d=>`<div><i style="height:${Math.round((hrs[d]||0)/mx*70)}px"></i>${hrs[d]||0}<br>${d.slice(8)}</div>`).join('')}</div></div>
 <div class="k-card k-6"><h3>Score and rank estimate</h3><p class="s">NEET marking: +4 correct, −1 wrong.</p>
 <div class="k-row"><input id="k-c" type="number" min="0" max="180" placeholder="Correct" class="k-in" style="flex:1" oninput="ep2.calc()"><input id="k-w" type="number" min="0" max="180" placeholder="Wrong" class="k-in" style="flex:1" oninput="ep2.calc()"></div>
 <div id="k-out" style="margin-top:12px;font-size:14px">Enter your numbers.</div></div>
 <div class="k-card k-6"><h3>Revision schedule (1-3-7-21)</h3><p class="s">Revise a chapter 1, 3, 7 and 21 days after you study it.</p>
 <div class="k-row" style="margin-bottom:8px"><select id="k-ch" class="k-in" style="flex:1">${opts}</select><button class="k-btn" onclick="ep2.add()">Add</button></div>${revH}</div>
 <div class="k-card k-6"><h3>High-yield chapters</h3><p class="s">Chapters that have carried more questions in recent papers. Trends change each year.</p>${hy}</div></div>`;
}
const EX=[1,3,7,21];
window.ep2={date(v){if(v){SV(K.exam,v);renderView();head()}},hr(n){const h=LS(K.hrs,{});h[today()]=Math.max(0,(h[today()]||0)+n);SV(K.hrs,h);renderView()},
 prac(b){openPracticeSetup(b.dataset.s,b.dataset.c)},
 add(){const c=document.getElementById('k-ch').value,r=LS(K.rev,[]);if(!r.find(x=>x.ch===c)){r.push({ch:c,step:0,next:addD(EX[0])});SV(K.rev,r);showToast('Added. First revision tomorrow.')}renderView()},
 rv(i){const r=LS(K.rev,[]),x=r[i];x.step++;if(x.step>=EX.length){r.splice(i,1);showToast('Chapter fully revised')}else x.next=addD(EX[x.step]-EX[x.step-1]);SV(K.rev,r);renderView()},
 rm(i){const r=LS(K.rev,[]);r.splice(i,1);SV(K.rev,r);renderView()},
 calc(){const c=+document.getElementById('k-c').value||0,w=+document.getElementById('k-w').value||0,m=c*4-w,o=document.getElementById('k-out');
  if(c+w>180){o.textContent='Correct and wrong cannot add up to more than 180.';return}
  const r=RANK.find(x=>m>=x[0]);o.innerHTML=`<b style="font-size:26px">${m}</b> / 720<br><span class="k-tag">Rough rank: ${r[1]}. Only a guide: it shifts every year with difficulty and category.</span>`}};
const rv0=window.renderView;
window.renderView=function(){if(currentTab==='kit'){const m=document.getElementById('main-container');updateGlobalProgress();m.innerHTML=kit();}else rv0();head()};
const sw0=window.switchTab;window.switchTab=function(t){sw0(t);head()};
document.addEventListener('DOMContentLoaded',()=>{shell();renderView()});
if(document.readyState!=='loading'){shell();}
})();
</script>

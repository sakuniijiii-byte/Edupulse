<style>
:root{
    --ink:#12202c;
    --muted:#64748b;
    --line:#dfe8e7;
    --paper:#ffffff;
    --bg:#f8fafc;
    --teal:#0d9488;
    --deep:#123c42;
    --lime:#bef264;
    --card-bg:#ffffff;
    --text-primary:#0f172a;
    --text-muted:#64748b;
    --border-color:#e2e8f0;
    --repo-bg:rgba(0,0,0,0.05);
    --bio-bg:#ecfdf5;
    --bio-text:#047857;
    --chem-bg:#f5f3ff;
    --chem-text:#6d28d9;
    --phy-bg:#f0fdfa;
    --phy-text:#0f766e;
}

body.dark {
    --ink:#f8fafc;
    --muted:#94a3b8;
    --line:#334155;
    --paper:#1e293b;
    --bg:#0f172a;
    --teal:#14b8a6;
    --deep:#0f2e33;
    --lime:#bef264;
    --card-bg:#1e293b;
    --text-primary:#f8fafc;
    --text-muted:#94a3b8;
    --border-color:#334155;
    --repo-bg:rgba(255,255,255,0.08);
    --bio-bg:rgba(16,185,129,0.15);
    --bio-text:#6ee7b7;
    --chem-bg:rgba(139,92,246,0.15);
    --chem-text:#c4b5fd;
    --phy-bg:rgba(20,184,166,0.15);
    --phy-text:#5eead4;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;transition:background-color 0.2s, color 0.2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--paper);border-right:1px solid var(--border-color);padding:24px 20px;display:flex;flex-direction:column;z-index:40;transition:background-color 0.2s, border-color 0.2s}
.brand{display:flex;gap:12px;align-items:center}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--deep);color:var(--lime);font-weight:900}
.brand b{font-size:16px;color:var(--text-primary)}
.brand b span{color:var(--teal)}
.eyebrow{margin:2px 0 0;color:var(--text-muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.nav{margin-top:32px;display:grid;gap:4px}
.nav button{padding:12px;border-radius:12px;background:none;color:var(--text-muted);text-align:left;font-weight:700;transition:all 0.2s;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(16,155,141,0.08);color:var(--teal)}
.nav button.active{background:rgba(16,155,141,0.18);color:var(--teal)}
.goal{margin-top:auto;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);border-radius:16px;padding:16px}
.goal small{color:var(--teal);text-transform:uppercase;font-weight:800;letter-spacing:.1em}
.goal strong{display:block;margin-top:6px;font-size:14px;color:var(--text-primary)}
.bar{height:6px;background:rgba(0,0,0,0.1);border-radius:99px;margin-top:10px;overflow:hidden}
body.dark .bar{background:rgba(255,255,255,0.15)}
.bar i{display:block;width:68%;height:100%;background:var(--teal);transition:width 0.5s ease}
.goal p{font-size:11px;color:var(--text-muted);margin-top:6px}
.content{margin-left:248px}
.topbar{height:76px;border-bottom:1px solid var(--border-color);background:var(--paper);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:30;transition:background-color 0.2s, border-color 0.2s}
.date{color:var(--text-muted);font-size:12px}
.topbar h1{font-size:20px;margin:2px 0 0;color:var(--text-primary)}
.profile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#f6c4a5;color:#6d3c2c;font-weight:800}
.main{max-width:1370px;margin:auto;padding:28px 32px}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
.hero h2{font-size:36px;letter-spacing:-.04em;margin:8px 0 0;color:var(--text-primary)}
.hero p,.desc{color:var(--text-muted)}
.tag{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.17em;font-size:12px}
.primary{padding:12px 20px;border-radius:12px;background:var(--teal);color:#fff;font-weight:800;transition:opacity 0.2s}
.primary:hover{opacity:0.9}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.card,.library{background:var(--card-bg);border:1px solid var(--border-color);border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,0.03);transition:background-color 0.2s, border-color 0.2s}
.stat{padding:16px;display:flex;gap:12px;align-items:center}
.stat-icon{width:40px;height:40px;border-radius:12px;background:rgba(16,155,141,0.12);display:grid;place-items:center;color:var(--teal);font-weight:900}
.stat strong{font-size:18px;display:block;color:var(--text-primary)}
.stat small{color:var(--text-muted)}
.library{margin-top:28px;padding:24px}
.library-head{display:flex;justify-content:space-between;gap:16px;align-items:center}
.library h3{font-size:24px;margin:7px 0;color:var(--text-primary)}
.repo{padding:10px 12px;border-radius:12px;background:var(--repo-bg);color:var(--text-muted);font-size:12px;font-weight:700}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.subject{padding:16px;border:1px solid var(--border-color);border-radius:16px;background:var(--card-bg);display:flex;align-items:center;justify-space-between;text-align:left;transition:all 0.2s;color:var(--text-primary)}
.subject.selected{border-color:var(--teal);background:rgba(16,155,141,0.08)}
.subject b{display:block;color:var(--text-primary)}
.subject small{display:block;color:var(--text-muted);margin-top:4px}
.chip{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:900}
.bio{background:var(--bio-bg);color:var(--bio-text)}
.chem{background:var(--chem-bg);color:var(--chem-text)}
.phy{background:var(--phy-bg);color:var(--phy-text)}
.chapter-head{display:flex;justify-content:space-between;align-items:flex-end;margin-top:28px}
.chapter-head h3{margin:0;font-size:21px;color:var(--text-primary)}
.controls{display:flex;gap:8px}
.controls input,.controls select,.controls button{padding:10px 12px;border:1px solid var(--border-color);border-radius:12px;background:var(--card-bg);color:var(--text-primary);outline:none}
.controls input:focus, .controls select:focus{border-color:var(--teal)}
.controls input{width:210px}
.chapters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.chapter{padding:20px;transition:transform 0.2s, box-shadow 0.2s}
.chapter:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.06)}
.chapter-title{font-weight:800;font-size:15px;min-height:42px;margin-top:18px;color:var(--text-primary)}
.meta{display:flex;justify-content:space-between;color:var(--text-muted);font-size:12px;margin-top:15px}
.progress{height:6px;background:rgba(0,0,0,0.06);border-radius:99px;margin-top:8px;overflow:hidden}
body.dark .progress{background:rgba(255,255,255,0.1)}
.progress i{display:block;height:100%;background:var(--teal);transition:width 0.4s ease}
.practice{margin-top:18px;color:var(--teal);font-weight:800;background:none;padding:0;display:inline-flex;align-items:center;gap:4px}
.practice:hover{text-decoration:underline}
.note{margin-top:28px;padding:16px;color:var(--text-muted)}
.note strong{color:var(--text-primary)}

/* Custom modal */
.custom-modal {
    position: fixed; inset: 0; background: rgba(18,32,44,0.6); backdrop-filter: blur(4px);
    display: grid; place-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
}
.custom-modal.open { opacity: 1; pointer-events: auto; }
.modal-box { background: var(--card-bg); color: var(--text-primary); width: 90%; max-width: 520px; border-radius: 20px; padding: 28px; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: scale(0.95); transition: transform 0.2s ease; }
.custom-modal.open .modal-box { transform: scale(1); }

@media(max-width:900px){
    .sidebar{display:none}
    .content{margin-left:0}
    .topbar{padding:0 20px}
    .main{padding:20px}
    .hero{align-items:flex-start;flex-direction:column}
    .stats,.subjects,.chapters{grid-template-columns:1fr}
    .library-head,.chapter-head{align-items:flex-start;flex-direction:column}
    .controls{width:100%;flex-direction:column}
    .controls input{width:100%}
    .hero h2{font-size:28px}
}
</style>
</head>

function toggleTheme() {
    document.body.classList.toggle('dark');
    document.documentElement.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('edupulse_theme', isDark ? 'dark' : 'light');
}

// Load theme preference on startup
if(localStorage.getItem('edupulse_theme') === 'dark') {
    document.body.classList.add('dark');
    document.documentElement.classList.add('dark');
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + tab);
    if(btn) btn.classList.add('active');
    renderView();
}

function toggleBookmark(resourceId) {
    if(bookmarks.includes(resourceId)) {
        bookmarks = bookmarks.filter(b => b !== resourceId);
    } else {
        bookmarks.push(resourceId);
    }
    localStorage.setItem('edupulse_bookmarks', JSON.stringify(bookmarks));
    renderView();
}

function showModal(title, message) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').textContent = message;
    document.getElementById('modalContentSlot').innerHTML = '';
    document.getElementById('modalActions').innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">Close</button>`;
    openModal();
}

function openModal() {
    document.getElementById('appModal').classList.add('open');
}

function closeModal() {
    document.getElementById('appModal').classList.remove('open');
}

function startTimer() {

        if(timerSeconds > 0) {
            timerSeconds--;

            clearInterval(timerInterval);
            timerInterval = null;
            showModal("Time's Up!", "Your 25-minute Pomodoro focus block is complete. Take a 5-minute break!");
        }
    }, 1000);
}

function pauseTimer() {
    clearInterval(timerInterval);
    timerInterval = null;
}

function resetTimer() {
    pauseTimer();
    timerSeconds = 25 * 60;
    updateTimerDisplay();
}

function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if(!el) return;
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    el.textContent = `${mins}:${secs}`;
}

function saveScratchpad(text) {
    userNotes = text;
    localStorage.setItem('edupulse_scratchpad', text);
}

function startRandomPractice() {
    const allChapters = [...data.Biology, ...data.Chemistry, ...data.Physics];
    const randomChapter = allChapters[Math.floor(Math.random() * allChapters.length)];

}

function setSubject(s) {
    subject = s;

}

function renderChapters() {
    const searchInput = document.getElementById('search');
    if(searchInput) searchQuery = searchInput.value;
    const filterSelect = document.getElementById('statusFilter');
    if(filterSelect) filterStatus = filterSelect.value;

    let list = data[subject].filter(x => x.toLowerCase().includes(searchQuery.toLowerCase()));
    
    if (filterStatus === 'completed') {
        list = list.filter(x => userProgress[x] && userProgress[x].completed);
    } else if (filterStatus === 'pending') {
        list = list.filter(x => !userProgress[x] || !userProgress[x].completed);
    }

    const titleEl = document.getElementById('subject-title');
    const countEl = document.getElementById('count');
    const chaptersEl = document.getElementById('chapters');

    if(titleEl) titleEl.textContent = subject + ' chapters';
    if(countEl) countEl.textContent = list.length + ' chapters · chapter-wise practice';
    
    if(chaptersEl) {
        chaptersEl.innerHTML = list.map((x) => {
            const prog = userProgress[x] ? (userProgress[x].pct || 0) : 0;
            const isDone = userProgress[x] && userProgress[x].completed;
            const chipClass = subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy';
            const chipText = subject === 'Chemistry' ? 'CHEM' : subject.slice(0, 3).toUpperCase();
            
            return `
                <article class="card chapter relative">
                    ${isDone ? '<span class="absolute top-4 right-4 bg-emerald-100 dark:bg-emerald-950/80 text-emerald-800 dark:text-emerald-300 text-[10px] font-extrabold px-2 py-0.5 rounded-full">Completed ✓</span>' : ''}
                    <span class="chip ${chipClass}">${chipText}</span>
                    <div class="chapter-title">${x}</div>
                    <div class="meta"><span>Question Bank</span><b>${prog}%</b></div>
                    <div class="progress"><i style="width:${prog}%"></i></div>
                    <button class="practice" onclick="openPracticeSession('${x.replace(/'/g, "\\'")}')">Practice chapter →</button>
                </article>
            `;
        }).join('');
    }
}

function updateGlobalProgress() {
    let totalChapters = 80;
    let completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
    let pct = Math.round((completedCount / totalChapters) * 100);

    const bar = document.getElementById('sidebar-progress-bar');
    const txt = document.getElementById('sidebar-progress-text');
    const statVal = document.getElementById('stat-progress-val');
    const streakEl = document.getElementById('stat-streak');
    
    const dashboardStats = JSON.parse(localStorage.getItem('edupulse_dash_stats')) || { streak: 0 };
    
    if(bar) bar.style.width = pct + '%';
    if(txt) txt.textContent = pct + '% syllabus covered';
    if(statVal) statVal.innerHTML = `<strong>${pct}%</strong><small>Syllabus covered</small>`;
    if(streakEl) streakEl.textContent = `${dashboardStats.streak || 0} days`;
}

function openPracticeSession(chapterName) {
    document.getElementById('modalTitle').textContent = chapterName;
    document.getElementById('modalBody').textContent = "Chapter Practice Portal";
    document.getElementById('modalContentSlot').innerHTML = `
        <div class="text-center py-8">
            <div class="w-16 h-16 bg-teal-100 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 rounded-2xl grid place-items-center mx-auto text-2xl font-bold mb-4">

            </div>
            <h4 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-2">Coming Soon!</h4>
            <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
                Questions for <strong>${chapterName}</strong> are currently being linked to the GitHub repository. Check back soon for full practice sets!
            </p>
        </div>
    `;
    document.getElementById('modalActions').innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700">Close</button>`;
    openModal();
}

:root{
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-2: #f1f5f9;
    --text: #0f172a;
    --muted: #64748b;
    --teal: #0d9488;
    --teal-strong: #0f766e;
    --border: #e2e8f0;
    --success: #16a34a;
    --success-soft: #dcfce7;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --warning: #f59e0b;
    --warning-soft: #fef3c7;
    --shadow: 0 18px 38px rgba(15, 23, 42, 0.08);
    --lime: #bef264;
    --deep: #123c42;
}
body.dark {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --teal: #14b8a6;
    --teal-strong: #0d9488;
    --border: #334155;
    --success: #22c55e;
    --success-soft: rgba(34, 197, 94, 0.15);
    --danger: #ef4444;
    --danger-soft: rgba(239, 68, 68, 0.15);
    --warning: #fbbf24;
    --warning-soft: rgba(251, 191, 36, 0.15);
    --shadow: 0 18px 38px rgba(0, 0, 0, 0.3);
    --lime: #bef264;
    --deep: #0f2e33;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;transition:background-color 0.2s, color 0.2s; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app-layout{display:flex;flex-direction:column;min-height:100vh}
@media (min-width: 1024px){.app-layout{flex-direction:row}.sidebar{position:fixed;inset:0 auto 0 0;width:260px;height:100vh;overflow-y:auto}.content{margin-left:260px;flex:1;width:calc(100% - 260px)}}
.brand{display:flex;gap:12px;align-items:center}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg, var(--teal-strong), var(--teal));color:white;font-weight:900;box-shadow:0 10px 20px rgba(13,148,136,0.25)}
.brand b{font-size:16px;color:var(--text)}
.brand b span{color:var(--teal)}
.eyebrow{margin:2px 0 0;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.nav button{padding:10px 12px;border-radius:12px;background:none;color:var(--muted);text-align:left;font-weight:700;transition:all 0.2s;display:flex;align-items:center;gap:10px;width:100%}
.nav button:hover{background:rgba(16,155,141,0.08);color:var(--teal)}
.nav button.active{background:rgba(16,155,141,0.18);color:var(--teal)}
.goal{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);border-radius:16px;padding:14px}
.goal small{color:var(--teal);text-transform:uppercase;font-weight:800;letter-spacing:.1em;font-size:10px}
.goal strong{display:block;margin-top:4px;font-size:13px;color:var(--text)}
.bar{height:6px;background:rgba(0,0,0,0.1);border-radius:99px;margin-top:8px;overflow:hidden}
body.dark .bar{background:rgba(255,255,255,0.15)}
.bar i{display:block;height:100%;background:var(--teal);transition:width 0.5s ease}
.goal p{font-size:11px;color:var(--muted);margin-top:6px}
.topbar{height:70px;border-bottom:1px solid var(--border);background:var(--panel);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}
.date{color:var(--muted);font-size:11px;font-weight:600}
.topbar h1{font-size:18px;margin:2px 0 0;color:var(--text);font-weight:800}
.main{max-width:1400px;margin:auto;padding:24px}
.tag{color:var(--teal);font-weight:800;text-transform:uppercase;letter-spacing:.17em;font-size:11px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);transition:all 0.2s ease-in-out}
.card:hover{border-color:rgba(13,148,136,0.3);box-shadow:0 6px 16px rgba(0,0,0,0.05)}
.subject{padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:var(--panel);display:flex;align-items:center;justify-content:space-between;text-align:left;transition:all 0.2s ease}
.subject.selected{border-color:var(--teal);background:rgba(16,155,141,0.08)}
.subject b{display:block;color:var(--text);font-size:14px}
.subject small{display:block;color:var(--muted);margin-top:2px;font-size:12px}
.chip{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:900;flex-shrink:0}
.bio{background:rgba(16,185,129,0.15);color:#047857}
.chem{background:rgba(139,92,246,0.15);color:#6d28d9}
.phy{background:rgba(20,184,166,0.15);color:#0f766e}
.chapter{padding:18px;transition:transform 0.2s, box-shadow 0.2s;display:flex;flex-direction:column;justify-content:space-between}
.chapter:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.06)}
.chapter-title{font-weight:800;font-size:14px;margin-top:14px;color:var(--text);line-height:1.4}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:12px}
.progress{height:6px;background:rgba(0,0,0,0.06);border-radius:99px;margin-top:6px;overflow:hidden}
body.dark .progress{background:rgba(255,255,255,0.1)}
.progress i{display:block;height:100%;background:var(--teal);transition:width 0.4s ease}
.practice{margin-top:14px;color:var(--teal);font-weight:800;background:none;padding:0;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.controls input,.controls select{padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel);color:var(--text);outline:none;font-size:13px}
.controls input:focus, .controls select:focus{border-color:var(--teal)}
.custom-modal{position:fixed;inset:0;background:rgba(15, 23, 42, 0.65);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.custom-modal.open{opacity:1;pointer-events:auto}
.custom-modal.open .modal-box{transform:scale(1)}
.custom-modal .modal-box{width:min(92vw,700px);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:22px 20px;transform:scale(0.96);transition:transform 0.2s ease;box-shadow:var(--shadow)}
/* Full-Screen Quiz Mode Overrides */
.custom-modal.fullscreen-modal { padding: 0; }
.custom-modal.fullscreen-modal .modal-box { max-width: 100vw; width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; border: none; display: flex; flex-direction: column; padding: 0; }
.mobile-nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(2px);z-index:45;opacity:0;pointer-events:none;transition:opacity 0.2s ease}.mobile-nav-overlay.open{opacity:1;pointer-events:auto}
@media (max-width: 1023px){.sidebar-drawer{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--panel);z-index:50;transform:translateX(-100%);transition:transform 0.3s ease;padding:20px 16px}.sidebar-drawer.open{transform:translateX(0)}}
@keyframes lockBounce {0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.05); }}
@keyframes pulseGlow {0%, 100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.2); } 50% { box-shadow: 0 0 35px rgba(234, 179, 8, 0.5); }}
.animate-lock-bounce { animation: lockBounce 2s ease-in-out infinite; }
.animate-pulse-glow { animation: pulseGlow 2.5s infinite; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

async function loadLivingWorldQuestions() {
    try {
        const response = await fetch(LIVING_WORLD_DATA_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to fetch Living World JSON');

        const payload = await response.json();
        const set = Array.isArray(payload?.qs) ? payload.qs : [];

        if (set.length) {
            return set.map((item, index) => ({
                id: index + 1,
                question: item.q,
                options: Array.isArray(item.o) ? item.o : [],
                answer: Array.isArray(item.o) && Number.isInteger(item.a) && item.a > 0 && item.a <= item.o.length ? item.o[item.a - 1] : item.o?.[0] || ''
            }));
        }
    } catch (error) {
        console.warn('Falling back to bundled living world data:', error);
    }

    return generate180LivingWorldQuestions();
}

function escapeHtml(value = '') {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function normalizeQuestion(option) {
    return String(option).trim();
}

function updateGlobalProgress() {
    const totalChapters = 79;
    const completedCount = Object.values(userProgress).filter(p => p && p.completed).length;
    const pct = Math.round((completedCount / totalChapters) * 100);

    const sidebarBar = document.getElementById('sidebar-progress-bar');
    const sidebarText = document.getElementById('sidebar-progress-text');
    if (sidebarBar) sidebarBar.style.width = `${pct}%`;
    if (sidebarText) sidebarText.textContent = `${pct}% syllabus covered`;
}

function renderChapters() {
    const list = data[subject] || [];
    const searchInput = document.getElementById('search');
    const filterSelect = document.getElementById('statusFilter');

    const query = searchInput ? searchInput.value.toLowerCase().trim() : '';
    const filter = filterSelect ? filterSelect.value : 'all';

    const countEl = document.getElementById('count');
    const titleEl = document.getElementById('subject-title');
    if (titleEl) titleEl.textContent = `${subject} Chapters`;

    const filtered = list.filter(ch => {
        const matchesSearch = ch.toLowerCase().includes(query);
        const isDone = userProgress[ch] && userProgress[ch].completed;
        if (filter === 'completed') return matchesSearch && isDone;
        if (filter === 'pending') return matchesSearch && !isDone;
        return matchesSearch;
    });

    if (countEl) countEl.textContent = `${filtered.length} of ${list.length} chapters displayed`;

    const container = document.getElementById('chapters');
    if (!container) return;

    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="col-span-full py-12 text-center text-slate-400">
                <i class="fa-solid fa-magnifying-glass text-3xl mb-2"></i>
                <p class="text-sm font-semibold">No chapters found matching criteria</p>
            </div>
        `;
        return;
    }

    const subjectBadgeClass = subject === 'Biology' ? 'bio' : subject === 'Chemistry' ? 'chem' : 'phy';
    const subjectShort = subject === 'Biology' ? 'BIO' : subject === 'Chemistry' ? 'CHEM' : 'PHY';

    container.innerHTML = filtered.map((ch) => {
        const isDone = userProgress[ch] && userProgress[ch].completed;
        const safeName = ch.replace(/'/g, "\\'");
        return `
            <div class="card chapter flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between">
                        <span class="chip ${subjectBadgeClass}">${subjectShort}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase ${isDone ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">
                            ${isDone ? 'Completed ✓' : 'Pending'}
                        </span>
                    </div>
                    <h3 class="chapter-title">${escapeHtml(ch)}</h3>
                </div>
                <div>
                    <div class="progress">
                        <i style="width: ${isDone ? '100%' : '0%'}"></i>
                    </div>
                    <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 dark:border-slate-800">

                        </button>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

function selectOptionTemp(optionValue) {
    const currentIdx = quizState.currentIndex;
    if (quizState.userAnswers[currentIdx] !== undefined) return;
    quizState.userAnswers[currentIdx] = optionValue;
    delete quizState.skippedQuestions[currentIdx];
    
    const currentQuestion = quizState.questions[currentIdx];
    if (normalizeQuestion(optionValue) === normalizeQuestion(currentQuestion.answer)) {
        quizState.score += 1;
    }

    renderLivingWorldQuiz();
}

function togglePaletteExpanded(forceState) {
    quizState.paletteExpanded = forceState !== undefined ? forceState : !quizState.paletteExpanded;
    renderLivingWorldQuiz();
}

function skipQuestion() {
    const currentIdx = quizState.currentIndex;
    if (quizState.userAnswers[currentIdx] === undefined) {
        quizState.skippedQuestions[currentIdx] = true;
    }
    goToNextLivingWorldQuestion();
}

function jumpToQuestion(index) {
    if (index >= 0 && index < quizState.questions.length) {

                    <button type="button" onclick="jumpToQuestion(${Math.max(0, currentIdx - 1)})" ${currentIdx === 0 ? 'disabled' : ''} class="rounded-xl bg-slate-200 dark:bg-slate-800 px-4 py-2.5 text-xs font-bold text-slate-700 dark:text-slate-200 ${currentIdx === 0 ? 'opacity-50 cursor-not-allowed' : 'hover:bg-slate-300 dark:hover:bg-slate-700'} transition">
                        ← Previous
                    </button>

                    <div class="flex items-center gap-2">
                        ${!isAnswered ? `
                            <button type="button" onclick="skipQuestion()" class="rounded-xl bg-amber-500 hover:bg-amber-600 px-4 py-2.5 text-xs font-bold text-white shadow-sm transition">
                                <i class="fa-solid fa-forward-step mr-1"></i> Skip Q
                            </button>
                        ` : ''}
                        <button type="button" onclick="${isLastQuestion ? 'finishLivingWorldQuiz()' : 'goToNextLivingWorldQuestion()'}" class="rounded-xl bg-teal-600 px-5 py-2.5 text-xs font-bold text-white hover:bg-teal-700 transition shadow-sm">
                            ${isLastQuestion ? 'Finish Quiz' : 'Next Question →'}
                        </button>
                    </div>
                </div>
            </div>

            ${quizState.paletteExpanded ? `
                <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex flex-col justify-end transition-opacity animate-fade-in" onclick="togglePaletteExpanded(false)">
                    <div class="bg-white dark:bg-slate-900 rounded-t-3xl p-4 sm:p-6 max-h-[80vh] flex flex-col shadow-2xl border-t border-slate-200 dark:border-slate-800" onclick="event.stopPropagation()">
                        <div class="w-12 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-4 cursor-pointer" onclick="togglePaletteExpanded(false)"></div>
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-base sm:text-lg font-black text-slate-900 dark:text-slate-100">Question Palette</h3>
                            <button onclick="togglePaletteExpanded(false)" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                                <i class="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>

                        <div class="grid grid-cols-6 sm:grid-cols-10 gap-2 overflow-y-auto p-1 max-h-[60vh]">
                            ${quizState.questions.map((_, idx) => {
                                const isCurrent = idx === currentIdx;
                                const ans = quizState.userAnswers[idx];
                                const isSkipped = quizState.skippedQuestions[idx];

                                let gridBgClass = 'bg-teal-600 text-white font-bold';
                                if (ans !== undefined) {
                                    const qObj = quizState.questions[idx];
                                    if (normalizeQuestion(ans) === normalizeQuestion(qObj.answer)) {
                                        gridBgClass = 'bg-emerald-600 text-white font-bold';
                                    } else {
                                        gridBgClass = 'bg-rose-500 text-white font-bold';
                                    }
                                } else if (isSkipped) {
                                    gridBgClass = 'bg-amber-500 text-white font-bold';
                                }

                                const borderStyle = isCurrent ? 'ring-2 ring-amber-400 ring-offset-2' : '';

                                return `
                                    <button onclick="jumpToQuestion(${idx}); togglePaletteExpanded(false);" class="h-10 rounded-xl text-xs flex items-center justify-center ${gridBgClass} ${borderStyle}">
                                        ${idx + 1}
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            ` : ''}
        </div>
    `;

    document.getElementById('modalTitle').textContent = '';
    document.getElementById('modalBody').textContent = '';
    document.getElementById('modalContentSlot').innerHTML = content;
    document.getElementById('modalActions').innerHTML = '';
    openModal();
}

function exitQuizFullscreen() {
    toggleFullScreenMode(false);
    closeModal();
}

function goToNextLivingWorldQuestion() {
    quizState.currentIndex += 1;

    if (quizState.currentIndex >= quizState.questions.length) {
        finishLivingWorldQuiz();
        return;
    }
    renderLivingWorldQuiz();
}

function finishLivingWorldQuiz() {
    toggleFullScreenMode(false);
    const total = quizState.questions.length;
    const score = quizState.score;
    const percent = Math.round((score / total) * 100);

    if (percent >= 60) {
        userProgress['The Living World'] = { completed: true, pct: 100 };
        saveToLocalStorage();
        updateGlobalProgress();
    }

    const resultHtml = `
        <div class="card w-full max-w-md mx-auto p-6 text-center shadow-lg border-slate-200 dark:border-slate-800">
            <div class="text-[10px] font-extrabold uppercase tracking-[0.18em] text-teal-600 dark:text-teal-400">${total} Question Practice Completed</div>
            <div class="mt-3 text-4xl font-black text-slate-900 dark:text-slate-100">${score} / ${total}</div>
            <div class="mt-2 text-sm font-semibold text-slate-600 dark:text-slate-300">Accuracy Score: <span class="text-teal-600 dark:text-teal-400 font-bold">${percent}%</span></div>
            <div class="mt-4 text-xs leading-relaxed text-slate-600 dark:text-slate-300">
                ${percent >= 70 ? '🎉 Exceptional preparation! You have thoroughly revised all questions of The Living World.' : '💪 Great effort solving all questions! Keep reviewing the explanations and retrying.'}
            </div>
            <div class="mt-6 flex items-center justify-center gap-3">
                <button type="button" onclick="restartLivingWorldQuiz()" class="rounded-xl bg-teal-600 px-4 py-2.5 text-xs font-bold text-white hover:bg-teal-700">Retake Module</button>
                <button type="button" onclick="closeModal(); renderView();" class="rounded-xl bg-slate-200 px-4 py-2.5 text-xs font-bold text-slate-700 hover:bg-slate-300 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700">Close</button>
            </div>
        </div>
    `;

    document.getElementById('modalTitle').textContent = 'Final Result';
    document.getElementById('modalBody').textContent = 'Summary for Living World practice set.';
    document.getElementById('modalContentSlot').innerHTML = resultHtml;
    document.getElementById('modalActions').innerHTML = '';
    openModal();
}

function restartLivingWorldQuiz() {
    quizState.currentIndex = 0;
    quizState.score = 0;
    quizState.userAnswers = {};
    quizState.skippedQuestions = {};
    quizState.answered = false;
    quizState.showResults = false;
    renderLivingWorldQuiz();
}

async function startLivingWorldQuiz() {
    quizState.questions = await loadLivingWorldQuestions();
    quizState.currentIndex = 0;
    quizState.score = 0;
    quizState.userAnswers = {};
    quizState.skippedQuestions = {};
    quizState.answered = false;
    quizState.showResults = false;
    renderLivingWorldQuiz();
}

function openFacultyPlaylist(teacherId) {
    const faculty = TEACHERS_DATA.find(t => t.id === teacherId);
    if (!faculty || !faculty.playlistUrl) return;
    window.open(faculty.playlistUrl, '_blank');
}

function toggleTheme() {
    document.body.classList.toggle('dark');
    document.documentElement.classList.toggle('dark');
    const isDark = document.body.classList.contains('dark');
    localStorage.setItem('edupulse_theme', isDark ? 'dark' : 'light');
}

if (localStorage.getItem('edupulse_theme') === 'dark') {
    document.body.classList.add('dark');
    document.documentElement.classList.add('dark');
}

function toggleMobileNav(open) {
    const drawer = document.getElementById('sidebarDrawer');
    const overlay = document.getElementById('navOverlay');
    if (open) {
        drawer.classList.add('open');
        overlay.classList.add('open');
    } else {
        drawer.classList.remove('open');
        overlay.classList.remove('open');
    }
}

function switchTab(tab) {
    if (currentTab !== tab) previousTab = currentTab;
    currentTab = tab;
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('nav-' + tab);
    if (btn) btn.classList.add('active');
    toggleMobileNav(false);
    renderView();
}

function goBack() {
    switchTab(previousTab || 'home');
}

function toggleBookmark(resourceId) {
    if (bookmarks.includes(resourceId)) {
        bookmarks = bookmarks.filter(b => b !== resourceId);
    } else {
        bookmarks.push(resourceId);
    }
    localStorage.setItem('edupulse_bookmarks', JSON.stringify(bookmarks));
    renderView();
}

function showModal(title, message, actionsHtml = null, contentHtml = '') {
    toggleFullScreenMode(false);

    document.getElementById('modalBody').textContent = message;
    document.getElementById('modalContentSlot').innerHTML = contentHtml;
    const actionsContainer = document.getElementById('modalActions');
    if (actionsHtml) {
        actionsContainer.innerHTML = actionsHtml;
    } else {
        actionsContainer.innerHTML = `<button onclick="closeModal()" class="px-5 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-sm">Close</button>`;
    }

}

function openModal() {

function closeModal() {

function toggleChapterProgress(chapterName) {
    if (!userProgress[chapterName]) {
        userProgress[chapterName] = { completed: true, pct: 100 };
    } else {
        userProgress[chapterName].completed = !userProgress[chapterName].completed;
        userProgress[chapterName].pct = userProgress[chapterName].completed ? 100 : 0;
    }
    saveToLocalStorage();
    closeModal();
    renderView();
}

function setTimerPreset(minutes, mode = 'work') {
    pauseTimer();
    timerMode = mode;
    timerInitialSeconds = minutes * 60;
    timerSeconds = timerInitialSeconds;
    saveToLocalStorage();
    updateTimerDisplay();
}

function startTimer() {
    if (timerInterval) return;
    const timerCard = document.getElementById('timerCard');
    if (timerCard) timerCard.classList.add('border-teal-500', 'ring-2', 'ring-teal-500/20');
    timerInterval = setInterval(() => {
        timerSeconds -= 1;
        if (timerSeconds <= 0) {
            timerSeconds = 0;
            clearInterval(timerInterval);
            timerInterval = null;
            playTimerEndSound();
            if (timerCard) timerCard.classList.remove('border-teal-500', 'ring-2', 'ring-teal-500/20');
        }
        updateTimerDisplay();
    }, 1000);
}

function pauseTimer() {
    if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
    }
    const timerCard = document.getElementById('timerCard');
    if (timerCard) timerCard.classList.remove('border-teal-500', 'ring-2', 'ring-teal-500/20');
}

function resetTimer() {
    pauseTimer();
    timerSeconds = timerInitialSeconds;
    updateTimerDisplay();
}

function playTimerEndSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gainNode.gain.value = 0.1;
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2);
    } catch (e) {
        console.warn('Audio not available', e);
    }
}

function updateTimerDisplay() {
    const timerEl = document.getElementById('timerDisplay');
    if (!timerEl) return;
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    timerEl.textContent = `${mins}:${secs}`;
}

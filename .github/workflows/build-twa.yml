name: Build EduPulse PRO TWA AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.EDUPULSE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing EDUPULSE_KEYSTORE_BASE64"; exit 1; }
          mkdir -p android/keys
          echo "$KEYSTORE_BASE64" | base64 --decode > android/keys/edupulse-upload.jks

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap Android tool paths
        run: bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.EDUPULSE_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.EDUPULSE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.EDUPULSE_KEY_ALIAS }}
        run: |
          test -f twa-manifest.json || { echo "android/twa-manifest.json is missing. Run bubblewrap init in Codespaces first."; exit 1; }
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "Missing EDUPULSE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$BUBBLEWRAP_KEY_PASSWORD" || { echo "Missing EDUPULSE_KEY_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing EDUPULSE_KEY_ALIAS"; exit 1; }
          bubblewrap build --manifest=. --signingKeyPath=keys/edupulse-upload.jks --signingKeyAlias="$KEY_ALIAS"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-pro-android-release
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 14
